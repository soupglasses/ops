name: Pre-commit Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install check tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15
          install_args: >-
            python aqua:go-task/task aqua:pre-commit/pre-commit aqua:editorconfig-checker/editorconfig-checker
            aqua:helm aqua:crossplane/cli aqua:google/yamlfmt aqua:yannh/kubeconform aqua:fluxcd/flux2
            aqua:mikefarah/yq pipx:reuse
      - name: Run pre-commit checks
        run: task check

      - name: Test schema synchronization
        run: python3 -m unittest discover -s scripts -p test_kubernetes_schema_headers.py

      - name: Test local CRD validation
        run: python3 -m unittest discover -s scripts -p test_kubeconform_local_schemas.py
