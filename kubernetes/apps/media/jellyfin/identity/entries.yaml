apiVersion: ldap.ops.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: jellyfin-bind
  annotations:
    crossplane.io/external-name: uid=media.jellyfin,ou=system,dc=finnes,dc=dev
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: directory
  forProvider:
    dataJsonSecretRef:
      name: jellyfin-identity
      key: ldap-entry.json
    restrictAttributes: [objectClass, cn, sn, userPassword, pwdPolicySubentry]
