services:
  ldap:
    image: docker.io/nfrastack/openldap:2.6-8.1.1@sha256:5e5c8fdd1d7e3a9623500839699b258d0569bf965528b85c682ec5d0902f5d6c
    hostname: ldap.finnes.dev
    user: "389:389"
    entrypoint: /usr/sbin/slapd
    command: ["-F", /data/config, "-h", "ldaps:/// ldapi:///", "-d", "256"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${LDAP_TEST_DIR:?Run test.py --keep first}/data:/data
      - ${LDAP_TEST_DIR}/data/db:/var/lib/openldap
      - ${LDAP_TEST_DIR}/run:/run/openldap
      - ${LDAP_TEST_DIR}/certs:/certs:ro
    networks:
      isolated:
        aliases:
          - ldap.finnes.dev
  tls-reload:
    image: docker.io/nfrastack/openldap:2.6-8.1.1@sha256:5e5c8fdd1d7e3a9623500839699b258d0569bf965528b85c682ec5d0902f5d6c
    user: "389:389"
    entrypoint: ["/bin/sh", /source/reload-tls.sh]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${LDAP_TEST_DIR}/run:/run/openldap
      - ${LDAP_TEST_DIR}/certs:/certs:ro
      - ./reload-tls.sh:/source/reload-tls.sh:ro
    networks:
      - isolated

networks:
  isolated:
    internal: true
