name: Renovate
on:
  schedule:
    - cron: "20 04 * * 6,0"

  workflow_dispatch:
    inputs:
      runner:
        description: Runner
        required: true
        default: codeberg-tiny
        type: choice
        options:
          - codeberg-tiny
          - codeberg-tiny-lazy
          - codeberg-small
          - codeberg-small-lazy

      loglevel:
        description: "Log Level"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug

jobs:
  Renovate:
    runs-on: ${{ inputs.runner || 'codeberg-tiny-lazy' }}
    steps:
      - name: Run Renovate
        uses: docker://ghcr.io/renovatebot/renovate:latest
        timeout-minutes: 120
        with:
          args: ${{ forge.repository }}
        env:
          LOG_LEVEL: ${{ inputs.loglevel || 'info' }}
          RENOVATE_GIT_AUTHOR: Ops Bot <sofie+bot@mailbox.org>
          RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ forge.server_url }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_PR_HOURLY_LIMIT: "0"
          RENOVATE_PR_CONCURRENT_LIMIT: "0"
