apiVersion: ldap.ops.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: directory-users
  annotations:
    crossplane.io/external-name: ou=users,dc=finnes,dc=dev
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: directory-admin
  forProvider:
    dataJsonSecretRef:
      name: directory-foundation-attributes
      key: users.json
    restrictAttributes:
      - objectClass
---
