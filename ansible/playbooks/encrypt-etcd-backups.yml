- name: Replace native plaintext etcd uploads with verified encrypted backups
  hosts: rke2_servers
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Install the encrypted backup service
      ansible.builtin.import_role:
        name: rke2
        tasks_from: encrypted-backup

    - name: Prove the actual service can restore its encrypted upload before cutover
      ansible.builtin.systemd_service:
        name: rke2-etcd-restic-backup.service
        state: started

    - name: Disable the native scheduled uploader
      ansible.builtin.import_role:
        name: rke2
        tasks_from: encrypted-backup-policy

    - name: Restart the existing RKE2 release to apply the backup policy
      ansible.builtin.systemd_service:
        name: rke2-server
        state: restarted

    - name: Wait for the API after the same-version restart
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig=/etc/rancher/rke2/rke2.yaml
          - --request-timeout=20s
          - get
          - --raw=/readyz
      register: encrypted_backup_api
      changed_when: false
      retries: 60
      delay: 5
      until: encrypted_backup_api.rc == 0 and encrypted_backup_api.stdout == 'ok'

    - name: Wait for the node and Cilium after restart
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [/var/lib/rancher/rke2/bin/kubectl, --kubeconfig=/etc/rancher/rke2/rke2.yaml, wait, node/nas,
          --for=condition=Ready, --timeout=300s]
        - [/var/lib/rancher/rke2/bin/kubectl, --kubeconfig=/etc/rancher/rke2/rke2.yaml, -n, kube-system,
          rollout, status, daemonset/cilium, --timeout=300s]
      changed_when: false

    - name: Prove explicit encrypted snapshots work with the native scheduler disabled
      ansible.builtin.systemd_service:
        name: rke2-etcd-restic-backup.service
        state: started

    - name: Enable the encrypted backup schedule
      ansible.builtin.systemd_service:
        name: rke2-etcd-restic-backup.timer
        enabled: true
        state: started

    - name: Stop the obsolete native S3 metric timer
      ansible.builtin.systemd_service:
        name: rke2-etcd-snapshot-metrics.timer
        enabled: false
        state: stopped

    - name: Remove obsolete native S3 freshness metrics
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter/rke2-etcd-s3-snapshots.prom
        state: absent
