apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-dns01-production
spec:
  acme:
    email: acme@${DOMAIN}
    privateKeySecretRef:
      name: cloudflare-dns01-production-account-key
    profile: tlsserver
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-dns01-staging
spec:
  acme:
    email: acme@${DOMAIN}
    privateKeySecretRef:
      name: cloudflare-dns01-staging-account-key
    profile: tlsserver
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
