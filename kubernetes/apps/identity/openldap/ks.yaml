# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openldap
  namespace: &namespace identity
spec:
  path: ./kubernetes/apps/identity/openldap/app
  targetNamespace: *namespace
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: openldap
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      # slapd runs as nobody; the mover must match to read the 0600 mdb files.
      VOLSYNC_PUID: "65534"
      VOLSYNC_PGID: "65534"
      VOLSYNC_QUIESCE_TARGET_SELECTOR: app.kubernetes.io/name=openldap
      # Not a quiesce: mdb snapshots are crash-consistent. This drops a
      # portable LDIF dump into the volume so every snapshot carries one.
      VOLSYNC_QUIESCE_CMD: slapcat -f /config/slapd.conf -l /config/data/dump.ldif
      VOLSYNC_RESUME_CMD: echo resume-noop
