# CiliumBGPPeerConfig defines the BGP peering settings for RouterOS
# This is referenced by CiliumBGPClusterConfig
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: routeros-ipv4
  namespace: kube-system
spec:
  timers:
    # Fast failure detection for home network
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  # Graceful restart allows Cilium agent restarts without traffic disruption
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: routeros-ipv6
  namespace: kube-system
spec:
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
