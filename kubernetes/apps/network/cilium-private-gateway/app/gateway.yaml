apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: private
  namespace: network
spec:
  service:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    loadBalancerClass: io.cilium/bgp-control-plane
    ipFamilies: [IPv4]
    ipFamilyPolicy: SingleStack
    allocateLoadBalancerNodePorts: false
    loadBalancerSourceRanges:
      - 172.21.69.0/24
      - 172.21.70.0/24
      - 172.21.71.10/32
    loadBalancerSourceRangesPolicy: Allow
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-private
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: private
    namespace: network
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-gateway-tls
  namespace: network
spec:
  secretName: private-gateway-tls
  issuerRef:
    name: cloudflare-dns01-production
    kind: ClusterIssuer
  dnsNames:
    - jellyfin.home.${DOMAIN}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: network
  annotations:
    external-dns.kubernetes.io/target: 172.21.68.11
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  gatewayClassName: cilium-private
  infrastructure:
    labels:
      networking.finnes.dev/exposure: private
      bgp: "enabled"
    annotations:
      lbipam.cilium.io/ips: 172.21.68.11
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: private-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
