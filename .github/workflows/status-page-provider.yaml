name: Status page provider
on:
  pull_request:
    paths:
      - "scripts/verify-status-page-composition.py"
      - "kubernetes/apps/crossplane-system/crossplane/providers/uptime-kuma/**"
      - "kubernetes/apps/monitoring/uptime-kuma/app/*.yaml"
      - ".github/workflows/status-page-provider.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-status-page-composition.py"
      - "kubernetes/apps/crossplane-system/crossplane/providers/uptime-kuma/**"
      - "kubernetes/apps/monitoring/uptime-kuma/app/*.yaml"
      - ".github/workflows/status-page-provider.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-page-provider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Crossplane CLI
        run: |
          curl -fsSL https://cli.crossplane.io/stable/v2.5.0/bin/linux_amd64/crossplane -o /tmp/crossplane
          echo '065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e  /tmp/crossplane' | sha256sum --check
          sudo install /tmp/crossplane /usr/local/bin/crossplane
      - name: Install Helm and kubectl
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: aqua:helm aqua:kubernetes/kubectl aqua:mikefarah/yq
      - name: Render status-page references and recovery scenarios
        run: python3 scripts/verify-status-page-composition.py
