apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-public
spec:
  podSelector:
    matchLabels:
      app: minecraft
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 25565
          protocol: TCP
        - port: 24454
          protocol: UDP
