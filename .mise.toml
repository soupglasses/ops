[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/.secure/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/.secure/age.agekey"
MISE_EXPERIMENTAL = true # for krew plugin

[plugins]
krew="https://github.com/soupglasses/mise-krew"

[tools]
"python" = "3.14.6"
"aqua:budimanjojo/talhelper" = "3.1.16"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.52.0"
"aqua:helm/helm" = "3.21.3"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.0"
"aqua:kubernetes/kubectl" = "1.34.2"
"aqua:kubecolor/kubecolor" = "0.6.0"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:siderolabs/talos" = "1.13.8"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:editorconfig-checker/editorconfig-checker" = "3.8.0"
"aqua:dandavison/delta" = "0.19.2"
"pipx:reuse" = "6.2.0"
"pipx:flux-local" = "8.4.0"
"aqua:google/yamlfmt" = "v0.21.0"
"aqua:pre-commit/pre-commit" = "4.4.0"
"go:github.com/jkulzer/kubefetch" = { version = "0.8.1", version_prefix = "" }
"krew:pv-migrate" = "v3.0.0"
"krew:pv-mounter" = "v26.10.0"
"krew:volsync" = "v0.15.0"
"github:flux-iac/tofu-controller" = "v0.16.4"

[[hooks.enter]]
shell = "bash"
script = '''
source <(\kubectl completion bash)
source <(kubectl-pv_mounter completion bash)
source <(kubectl-pv_migrate completion bash)
source <(talosctl completion bash)
source <(task --completion bash)
source <(flux completion bash)
source <(talhelper completion bash)
source <(tfctl completion bash)
source <(kubectl-volsync completion bash)

# kubectl ≥1.26 looks up `kubectl_complete-<plugin>` in PATH to complete
# `kubectl <plugin>` (and therefore `k <plugin>` / `kubecolor <plugin>`).
# Generate one shim per krew plugin so completion works there too — the
# plugins' own `completion bash` output only covers the bare binary form.
_kcs_dir="${XDG_CACHE_HOME:-$HOME/.cache}/soupglasses-ops/kubectl-complete-shims"
mkdir -p "$_kcs_dir"
for _kcs_plugin in volsync pv_migrate pv_mounter; do
  _kcs_shim="$_kcs_dir/kubectl_complete-$_kcs_plugin"
  if [[ ! -x "$_kcs_shim" ]]; then
    printf '#!/usr/bin/env bash\nexec kubectl-%s __complete "$@"\n' "$_kcs_plugin" >"$_kcs_shim"
    chmod +x "$_kcs_shim"
  fi
done
case ":$PATH:" in *":$_kcs_dir:"*) ;; *) export PATH="$_kcs_dir:$PATH" ;; esac
unset _kcs_dir _kcs_plugin _kcs_shim

alias kubectl=kubecolor
complete -o default -F __start_kubectl kubecolor
alias k=kubectl
complete -o default -F __start_kubectl k
alias t=talosctl
complete -o default -F __start_talosctl t

_openldap_exec() {
  local ldap_command=$1
  shift

  kubectl exec -n identity -i deploy/openldap -- bash -lc '
  set -euo pipefail
  export LDAPTLS_CACERT=/config/tls/ca.crt
  export LDAPTLS_REQCERT=never
  export LDAPURI=ldaps://127.0.0.1:636/
  case "$1" in
    ldapsearch)
      shift
      exec ldapsearch -x -H "$LDAPURI" -D "$LDAP_ROOT_DN" -w "$LDAP_ROOT_PASSWORD" -b "$LDAP_SUFFIX" "$@"
      ;;
    *)
      ldap_command=$1
      shift
      exec "$ldap_command" -x -H "$LDAPURI" -D "$LDAP_ROOT_DN" -w "$LDAP_ROOT_PASSWORD" "$@"
      ;;
  esac
  ' -- "$ldap_command" "$@"
}

_ldapsearch() { _openldap_exec ldapsearch "$@"; }
_ldapmodify() { _openldap_exec ldapmodify "$@"; }
_ldapadd() { _openldap_exec ldapadd "$@"; }
_ldapdelete() { _openldap_exec ldapdelete "$@"; }
_ldappasswd() { _openldap_exec ldappasswd "$@"; }
_ldapwhoami() { _openldap_exec ldapwhoami "$@"; }

alias ldapsearch=_ldapsearch
alias ldapmodify=_ldapmodify
alias ldapadd=_ldapadd
alias ldapdelete=_ldapdelete
alias ldappasswd=_ldappasswd
alias ldapwhoami=_ldapwhoami
'''

[[hooks.enter]]
shell = "zsh"
script = '''
source <(kubectl completion zsh)
source <(kubectl-pv_mounter completion zsh)
source <(kubectl-pv_migrate completion zsh)
source <(talosctl completion zsh)
source <(task --completion zsh)
