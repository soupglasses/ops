apiVersion: jellyfin.finnes.dev/v1alpha1
kind: Library
metadata:
  name: jellyfin-anime
  annotations:
    crossplane.io/external-name: Anime
spec:
  forProvider:
    collectionType: tvshows
    paths:
      - /media/anime
    libraryOptions:
      typeOptions:
        - type: Series
          metadataFetchers: [AniDB, TheMovieDb]
          metadataFetcherOrder: [AniDB, TheMovieDb]
          imageFetchers: [AniDB, TheMovieDb]
          imageFetcherOrder: [AniDB, TheMovieDb]
        - type: Season
          metadataFetchers: [AniDB, TheMovieDb]
          metadataFetcherOrder: [AniDB, TheMovieDb]
          imageFetchers: [AniDB, TheMovieDb]
          imageFetcherOrder: [AniDB, TheMovieDb]
        - type: Episode
          metadataFetchers: [AniDB, TheMovieDb]
          metadataFetcherOrder: [AniDB, TheMovieDb]
          imageFetchers: [TheMovieDb, Screen Grabber]
          imageFetcherOrder: [TheMovieDb, Screen Grabber]
