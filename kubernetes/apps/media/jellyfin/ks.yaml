apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-identity
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/identity
  targetNamespace: media
  dependsOn:
    - name: ldap-directory
      namespace: identity
    - name: jellyfin-groups
      namespace: media
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-media
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/media
  dependsOn:
    - name: csi-driver-nfs
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/app
  targetNamespace: media
  dependsOn:
    - name: jellyfin-identity
      namespace: media
    - name: jellyfin-media
      namespace: media
    - name: cilium-private-gateway
      namespace: network
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: false
  wait: true
  postBuild:
    substitute:
      APP: jellyfin
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_CACHE_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: openebs-zfs
      VOLSYNC_QUIESCE_TARGET_SELECTOR: app=jellyfin
      VOLSYNC_QUIESCE_TARGET_CONTAINER: jellyfin
      VOLSYNC_QUIESCE_CMD: python3 /usr/local/lib/jellyfin/runtime.py checkpoint
      VOLSYNC_RESUME_CMD: /bin/true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-media-backup
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/media-backup
  targetNamespace: media
  dependsOn:
    - name: jellyfin-media
      namespace: media
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  timeout: 5m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-groups
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/groups
  targetNamespace: identity
  dependsOn:
    - name: ldap-system-users
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: identity.ops.finnes.dev/v1alpha1
      kind: GroupOfNames
      name: jellyfin-user-group
      namespace: identity
    - apiVersion: identity.ops.finnes.dev/v1alpha1
      kind: GroupOfNames
      name: jellyfin-admin-group
      namespace: identity
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
