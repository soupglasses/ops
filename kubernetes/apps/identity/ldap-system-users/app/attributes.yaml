apiVersion: v1
kind: Secret
metadata:
  name: directory-foundation-attributes
type: Opaque
stringData:
  users.json: '{"objectClass":["organizationalUnit"]}'
  system.json: '{"objectClass":["organizationalUnit"]}'
  groups.json: '{"objectClass":["organizationalUnit"]}'
  policies.json: '{"objectClass":["organizationalUnit"]}'
  oauth.json: '{"objectClass":["organizationalUnit"]}'
  oauth-clients.json: '{"objectClass":["organizationalUnit"]}'
  oauth-authorizations.json: '{"objectClass":["organizationalUnit"]}'
  oauth-consents.json: '{"objectClass":["organizationalUnit"]}'
  oauth-tokens.json: '{"objectClass":["organizationalUnit"]}'
  password-policy.json: |
    {
      "objectClass": [
        "pwdPolicy",
        "person",
        "top"
      ],
      "sn": [
        "password"
      ],
      "pwdAttribute": [
        "userPassword"
      ],
      "pwdMustChange": [
        "TRUE"
      ],
      "pwdLockout": [
        "TRUE"
      ],
      "pwdAllowUserChange": [
        "TRUE"
      ],
      "pwdGraceAuthNLimit": [
        "1"
      ],
      "pwdMaxFailure": [
        "999"
      ]
    }
  system-policy.json: |
    {
      "objectClass": [
        "pwdPolicy",
        "person",
        "top"
      ],
      "sn": [
        "system"
      ],
      "pwdAttribute": [
        "userPassword"
      ],
      "pwdMustChange": [
        "FALSE"
      ],
      "pwdLockout": [
        "FALSE"
      ],
      "pwdAllowUserChange": [
        "FALSE"
      ],
      "pwdMaxFailure": [
        "0"
      ]
    }
  admin-user.json: '{"objectClass":["inetOrgPerson","oathHOTPToken","organizationalPerson","person"]}'
  admin-user-defaults.json: |
    {
      "cn": [
        "Admin"
      ],
      "sn": [
        "Admin"
      ],
      "mail": [
        "admin@${DOMAIN}"
      ],
      "userPassword": [
        "${admin_password_hash}"
      ]
    }
  auth-user.json: |
    {
      "objectClass": [
        "inetOrgPerson",
        "organizationalPerson",
        "person"
      ],
      "pwdPolicySubentry": [
        "cn=system,ou=policies,dc=finnes,dc=dev"
      ]
    }
  auth-user-defaults.json: '{"cn":["System Auth User"],"sn":["Auth"],"userPassword":["${admin_user_password_hash}"]}'
  admin-group.json: '{"objectClass":["groupOfNames"]}'
  admin-group-defaults.json: '{"member":["cn=admin,dc=finnes,dc=dev","uid=admin,ou=users,dc=finnes,dc=dev"]}'
