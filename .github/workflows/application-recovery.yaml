name: Application recovery
on:
  pull_request:
    paths:
      - "scripts/volsync-restore.sh"
      - "scripts/test_volsync_restore.py"
      - "kubernetes/components/volsync/**"
      - ".github/workflows/application-recovery.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.7
          install_args: aqua:restic/restic aqua:mikefarah/yq
      - name: Exercise restore failures and controller holds
        run: python3 -m unittest scripts.test_volsync_restore -v
