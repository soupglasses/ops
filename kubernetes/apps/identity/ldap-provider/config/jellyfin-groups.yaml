apiVersion: ldap.ops.finnes.dev/v1beta1
kind: ProviderConfig
metadata:
  name: jellyfin-groups
  namespace: identity
spec:
  host: openldap.identity.svc.cluster.local
  port: 636
  tls: true
  tlsServerName: ldap.finnes.dev
  bindDN: cn=admin,dc=finnes,dc=dev
  credentialsSecretRef:
    name: openldap
    key: LDAP_ROOT_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: jellyfin-group-attributes
  namespace: identity
stringData:
  user.json: '{"objectClass":["groupOfNames"],"description":["Users permitted to sign in to Jellyfin"]}'
  admin.json: '{"objectClass":["groupOfNames"],"description":["Jellyfin administrators"]}'
  user-defaults.json: >-
    {"member":["uid=admin,ou=users,dc=finnes,dc=dev","uid=sofie,ou=users,dc=finnes,dc=dev","uid=lcp,ou=users,dc=finnes,dc=dev"]}
  admin-defaults.json: '{"member":["uid=admin,ou=users,dc=finnes,dc=dev"]}'
---
apiVersion: ldap.ops.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: jellyfin-user-group
  namespace: identity
  annotations:
    crossplane.io/external-name: cn=jellyfin.user,ou=groups,dc=finnes,dc=dev
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin-groups
  forProvider:
    dataJsonSecretRef:
      name: jellyfin-group-attributes
      key: user.json
    dataJsonCreateDefaultsSecretRef:
      name: jellyfin-group-attributes
      key: user-defaults.json
    restrictAttributes: [objectClass, description]
---
apiVersion: ldap.ops.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: jellyfin-admin-group
  namespace: identity
  annotations:
    crossplane.io/external-name: cn=jellyfin.admin,ou=groups,dc=finnes,dc=dev
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin-groups
  forProvider:
    dataJsonSecretRef:
      name: jellyfin-group-attributes
      key: admin.json
    dataJsonCreateDefaultsSecretRef:
      name: jellyfin-group-attributes
      key: admin-defaults.json
    restrictAttributes: [objectClass, description]
