apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: canaille-http
  namespace: identity
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: canaille
  ingress:
    - fromEntities: [ingress, host]
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
