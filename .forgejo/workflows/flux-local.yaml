name: Flux Local Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-local:
    name: Flux Local
    runs-on: codeberg-tiny
    env:
      CLUSTER_PATH: kubernetes/clusters/home
      STRIP_ATTRS: "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          entrypoint: /bin/sh
          args: -c "git config --global --add safe.directory ${{ forge.workspace }} && flux-local test
            --enable-helm --all-namespaces --path kubernetes/clusters/home -v"
      - name: Diff
        if: always() && github.event_name == 'pull_request'
        uses: docker://ghcr.io/allenporter/flux-local:v8.1.0
        with:
          entrypoint: /bin/sh
          args: -c "git config --global --add safe.directory ${{ forge.workspace }} && flux-local diff
            kustomization --path $CLUSTER_PATH --strip-attrs $STRIP_ATTRS --all-namespaces > diff.txt
            2>/dev/null; flux-local diff helmrelease --path $CLUSTER_PATH --strip-attrs $STRIP_ATTRS --all-namespaces
            >> diff.txt 2>/dev/null; true"
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ ! -s diff.txt ]; then
            echo "No diff output, skipping comment."
            exit 0
          fi

          {
            echo "## Flux Local Diff"
            echo ""
            echo '```diff'
            cat diff.txt
            echo '```'
          } > body.md

          jq -Rs '{"body": .}' body.md | \
            curl -s -X POST \
              "${{ forge.server_url }}/api/v1/repos/${{ forge.repository }}/issues/${{ github.event.number }}/comments" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @-
