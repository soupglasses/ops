apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-volsync-quiesce
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: ["${APP}"]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-volsync-quiesce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-volsync-quiesce
subjects:
  - kind: ServiceAccount
    name: ${APP}-volsync-quiesce
