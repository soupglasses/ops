name: Flux Local Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-local:
    name: Flux Local
    runs-on: codeberg-tiny
    env:
      CLUSTER_PATH: kubernetes/clusters/home
      STRIP_ATTRS: "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        env:
          GITHUB_TOKEN: ""
        run: |
          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize /usr/local/bin/
          # Install helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Install flux-local
        run: |
          pip install flux-local==8.1.0
      - name: Test
        run: |
          flux-local test --enable-helm --all-namespaces --path kubernetes/clusters/home -v
      - name: Diff
        if: always() && github.event_name == 'pull_request'
        run: |
          flux-local diff kustomization --path $CLUSTER_PATH --strip-attrs $STRIP_ATTRS \
            --all-namespaces > diff.txt 2>/dev/null || true
          flux-local diff helmrelease --path $CLUSTER_PATH --strip-attrs $STRIP_ATTRS \
            --all-namespaces >> diff.txt 2>/dev/null || true
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ ! -s diff.txt ]; then
            echo "No diff output, skipping comment."
            exit 0
          fi

          {
            echo "## Flux Local Diff"
            echo ""
            echo '```diff'
            cat diff.txt
            echo '```'
          } > body.md

          jq -Rs '{"body": .}' body.md | \
            curl -s -X POST \
              "${{ forge.server_url }}/api/v1/repos/${{ forge.repository }}/issues/${{ github.event.number }}/comments" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @-
