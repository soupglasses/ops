name: Flux Local Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-local:
    name: Flux Local
    runs-on: ubuntu-latest
    env:
      CLUSTER_PATH: kubernetes/clusters/home
      STRIP_ATTRS: helm.sh/chart,checksum/config,app.kubernetes.io/version,chart

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install manifest tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: aqua:fluxcd/flux2 aqua:helm/helm aqua:kubernetes-sigs/kustomize
      - name: Install flux-local
        run: pip install flux-local==8.4.0

      - name: Test
        run: flux-local test --enable-helm --all-namespaces --path "$CLUSTER_PATH" -v

      - name: Fetch base branch
        if: always() && github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF"

      - name: Diff
        if: always() && github.event_name == 'pull_request'
        run: |
          flux-local diff kustomization --path "$CLUSTER_PATH" \
            --branch-orig "origin/$GITHUB_BASE_REF" --strip-attrs "$STRIP_ATTRS" \
            --all-namespaces | tee -a diff.txt
          flux-local diff helmrelease --path "$CLUSTER_PATH" \
            --branch-orig "origin/$GITHUB_BASE_REF" --strip-attrs "$STRIP_ATTRS" \
            --all-namespaces | tee -a diff.txt

      - name: Add diff to job summary
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -s diff.txt ]; then
            echo "No Flux Local diff." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Flux Local Diff"
            echo
            echo '```diff'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: >-
          always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
          == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s diff.txt ]; then
            exit 0
          fi

          {
            echo "## Flux Local Diff"
            echo
            echo '```diff'
            cat diff.txt
            echo '```'
          } > body.md

          gh pr comment "$PR_NUMBER" --body-file body.md
