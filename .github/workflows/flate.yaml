name: Flate Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flate:
    name: Flate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: github:home-operations/flate aqua:go-task/task aqua:mikefarah/yq

      - name: Test diff summary
        run: python3 -m unittest discover -s scripts -p test_flate_diff_summary.py

      - name: Test
        run: task flate:test

      - name: Verify application recovery contracts
        run: task app:verify-render

      - name: Diff
        id: render-diff
        if: always() && github.event_name == 'pull_request'
        run: |
          # Compare the tested merge result with the main commit it was built on.
          BASE_SHA="$(git rev-parse HEAD^1)"
          task flate:diff BASE="$BASE_SHA" OUTPUT=github > diff.txt
          task flate:diff BASE="$BASE_SHA" OUTPUT=html > diff.html
          task flate:diff BASE="$BASE_SHA" OUTPUT=diff > diff-unified.txt

      - name: Upload rendered diff
        if: always() && github.event_name == 'pull_request'
        id: diff-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flate-diff
          path: |
            diff.txt
            diff.html
            diff-unified.txt
          if-no-files-found: ignore

      - name: Prepare diff summary
        id: diff-summary
        if: always() && github.event_name == 'pull_request'
        env:
          DIFF_ARTIFACT_URL: ${{ steps.diff-artifact.outputs.artifact-url }}
          DIFF_OUTCOME: ${{ steps.render-diff.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "has-diff=false" >> "$GITHUB_OUTPUT"
          if [ "$DIFF_OUTCOME" != success ]; then
            echo "Rendered diff failed. Check the Diff step before reviewing this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -s diff.txt ]; then
            echo "No rendered Flux diff." > body.md
            cat body.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$DIFF_ARTIFACT_URL"

          python3 scripts/flate-diff-summary.py \
            diff.txt diff-unified.txt "$DIFF_ARTIFACT_URL" > body.md
          if grep -q '^--- ' diff-unified.txt; then
            echo "has-diff=true" >> "$GITHUB_OUTPUT"
            printf '\nCommit: [`%.12s`](%s/%s/commit/%s)\n' \
              "$PR_HEAD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR_HEAD_SHA" >> body.md
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: >-
          always() && steps.render-diff.outcome == 'success' && steps.diff-summary.outcome == 'success'
          && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: flate-diff
          path: body.md
          delete: ${{ steps.diff-summary.outputs.has-diff != 'true' }}
