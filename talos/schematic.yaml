customization:
  extraKernelArgs:
    # Ryzen 1000-series soft locks on C6 sleep states. Disable it explicitly.
    - rcu_nocbs=0-11
    - processor.max_cstate=5
  systemExtensions:
    officialExtensions:
      - siderolabs/amd-ucode
      - siderolabs/nvidia-container-toolkit-production
      - siderolabs/nvidia-open-gpu-kernel-modules-production
      - siderolabs/zfs
