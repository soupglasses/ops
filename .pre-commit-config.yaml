default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: alejandra
        language: system
        files: \.nix$
        stages: [pre-commit]
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
        stages: [pre-commit]
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        files: \.ya?ml$
        stages: [pre-commit]
      - id: kubeconform
        name: kubeconform
        entry: >
          kubeconform -kubernetes-version='1.33.2' -schema-location='default' -schema-location='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -schema-location='https://json.schemastore.org/{{.ResourceKind}}.json' -summary
        language: system
        files: ^kubernetes/.*\.ya?ml$
        stages: [pre-commit]
