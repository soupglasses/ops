- name: Resume backups after verifying surviving application storage
  hosts: "{{ rke2_backup_coordinator | default('all:!all') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Resume the journaled backup schedules and Flux reconciliation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/rke2-uninstall/volsync-uninstall-hold.py
          - resume
      environment:
        KUBECONFIG: /etc/rancher/rke2/rke2.yaml
        PATH: /var/lib/rancher/rke2/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      changed_when: true
