all:
  children:
    rke2_servers:
      hosts:
        nas:
          # `initial_ansible_host` supports the one-time installer-address handoff.
          # Unlike overriding ansible_host directly, the network role can replace it.
          ansible_host: "{{ initial_ansible_host | default('172.21.71.10') }}"
          ansible_user: ansible
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ansible"
          ansible_ssh_common_args: -o HostKeyAlias=nas.home.arpa
    routers:
      hosts:
        router:
          ansible_host: 172.21.69.1
          ansible_user: ansible
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: community.routeros.routeros
