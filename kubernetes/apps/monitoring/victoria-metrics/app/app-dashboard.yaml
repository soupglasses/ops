                    "1": {
                      "text": "Out of sync",
                      "color": "red"
                    }
                  }
                }
              ],
              "noValue": "No backup status"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "description": "Native VolSync status. Backup age above remains relevant for sources triggered by quiesce controllers."
        },
