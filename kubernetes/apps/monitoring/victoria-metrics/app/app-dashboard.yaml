          },
          "targets": [
            {
              "refId": "A",
              "expr": "(volsync_volume_out_of_sync{role=\"source\",obj_namespace=\"$namespace\"} and on (obj_namespace, obj_name) label_replace(label_replace((volsync_source_info{namespace=\"$namespace\"} and on (namespace, persistentvolumeclaim) namespace_app_persistentvolumeclaim:info{namespace=\"$namespace\",app=~\"$${app:regex}\"}), \"obj_namespace\", \"$1\", \"namespace\", \"(.+)\"), \"obj_name\", \"$1\", \"source\", \"(.+)\"))",
              "legendFormat": "{{obj_name}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [
