# Adopt the old recovery-owned object while paused so Flux can prune it safely.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: victoria-logs-dst
  labels:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  restic:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 10Gi
    cacheStorageClassName: openebs-zfs
    capacity: 200Gi
    cleanupCachePVC: true
    cleanupTempPVC: true
    copyMethod: Snapshot
    enableFileDeletion: true
    moverSecurityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    repository: volsync-victoria-logs
    storageClassName: openebs-zfs
    volumeSnapshotClassName: openebs-zfs-snapshot
  trigger:
    manual: backup-refresh-2026-10-22T18:18:15Z
  paused: true
