apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: volsync
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    manageCRDs: true
    metrics:
      disableAuth: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
            patch: |
              - op: add
                path: /metadata/labels/monitoring.finnes.dev~1enabled
                value: "true"
          - target:
              kind: Deployment
              name: volsync
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --zap-log-level=info
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --zap-encoder=json
