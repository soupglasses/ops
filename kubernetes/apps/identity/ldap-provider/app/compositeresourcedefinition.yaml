apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: serviceaccounts.ops.finnes.dev
spec:
  scope: Namespaced
  group: ops.finnes.dev
  names:
    kind: ServiceAccount
    plural: serviceaccounts
  defaultCompositionRef:
    name: serviceaccount-ldap
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cn
              properties:
                cn:
                  type: string
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                baseDN:
                  type: string
                  minLength: 1
                  default: ou=system,dc=finnes,dc=dev
                description:
                  type: string
                deletionPolicy:
                  type: string
                  enum:
                    - Delete
                    - Orphan
                  default: Delete
                backendRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ClusterProviderConfig
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: backendRef is immutable
                  default:
                    kind: ClusterProviderConfig
                    name: directory
                passwordPolicyDN:
                  type: string
                  default: cn=system,ou=policies,dc=finnes,dc=dev
                rotationID:
                  type: string
                  default: ''
            status:
              type: object
              properties:
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    resourceVersion:
                      type: string
