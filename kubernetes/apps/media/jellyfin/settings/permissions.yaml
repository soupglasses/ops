apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jellyfin-settings-composer
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [jellyfin.ops.finnes.dev]
    resources: [pluginconfigurations]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jellyfin-settings-composer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jellyfin-settings-composer
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
