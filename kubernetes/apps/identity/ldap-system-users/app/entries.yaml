apiVersion: ldap.ops.finnes.dev/v1alpha1
kind: Entry
metadata:
  name: directory-password-policy
  annotations:
    crossplane.io/external-name: cn=password,ou=policies,dc=finnes,dc=dev
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: directory-admin
  forProvider:
    dataJsonSecretRef:
      name: directory-foundation-attributes
      key: password-policy.json
    restrictAttributes:
      - objectClass
      - sn
      - pwdAttribute
      - pwdMustChange
      - pwdLockout
      - pwdAllowUserChange
      - pwdGraceAuthNLimit
      - pwdMaxFailure
---
