apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: victoria-logs-backup-cleanup
rules:
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    resourceNames: [victoria-logs]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [volsync-src-victoria-logs]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: victoria-logs-backup-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: victoria-logs-backup-cleanup
subjects:
  - kind: ServiceAccount
    name: victoria-logs-backup-cleanup
    namespace: monitoring
