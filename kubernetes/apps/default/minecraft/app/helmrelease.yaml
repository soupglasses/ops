# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  interval: 30m
  chart:
    spec:
      chart: minecraft
      version: 5.3.1
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: itzg/minecraft-server
      tag: latest@sha256:0222a05b5bdf82e0d5fc91920d89f02d0df77b6ee51a3c08d748b3864a418524
    initContainers:
      - name: require-restored-world
        image: itzg/minecraft-server:latest@sha256:0222a05b5bdf82e0d5fc91920d89f02d0df77b6ee51a3c08d748b3864a418524
        command: [/bin/sh, -ec]
        args:
          - test -s /data/world/level.dat || { echo 'Minecraft world missing; restore a verified backup.'
            >&2; exit 1; }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: datadir
            mountPath: /data
            readOnly: true
    resources:
      requests:
        memory: 1024M
        cpu: 1000m
    extraEnv:
      INIT_MEMORY: 1024M
      USER_API_PROVIDER: mojang
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      EXISTING_OPS_FILE: SYNCHRONIZE
      WHITELIST:
        valueFrom:
          secretKeyRef:
            name: minecraft
            key: WHITELIST
      OPS:
        valueFrom:
          secretKeyRef:
            name: minecraft
            key: OPS
    minecraftServer:
      rcon:
        enabled: true
      memory: 4096M
      # Permit unused heap to return to the OS while the empty server is paused.
      jvmXXOpts: "-XX:G1PeriodicGCInterval=300000"
      pvp: true
      eula: true
      type: FABRIC
      version: 1.21.10
      modrinth:
        projects:
          # Dependencies
          - fabric-api
          - fabric-language-kotlin
          # Optimization mods
          - lithium
          - scalablelux
          - c2me-fabric
          - krypton
          - ferrite-core
          # QoL
          - no-chat-reports
          - simple-voice-chat
          - ledger
        downloadDependencies: none
        allowedVersionType: release
      gamemode: survival
      difficulty: hard
      levelType: normal
      allowNether: true
      spawnAnimals: true
      spawnMonsters: true
      motd: |
        \u00A7d\u00A7lS\u00A75\u00A7lo\u00A79\u00A7lf\u00A7b\u00A7li\u00A7a\u00A7le\u00A7e\u00A7l'\u00A76\u00A7ls \u00A7c\u00A7lC\u00A7d\u00A7lo\u00A75\u00A7lr\u00A79\u00A7ln\u00A7b\u00A7le\u00A7a\u00A7lr
      maxPlayers: 20
      viewDistance: 16
      spawnProtection: 0
      generateStructures: true
      overrideServerProperties: true
      serviceType: LoadBalancer
      loadBalancerClass: io.cilium/bgp-control-plane
      externalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
        - IPv6
      ipFamilyPolicy: RequireDualStack
      extraPorts:
        - name: voice-chat
          containerPort: 24454
          protocol: UDP
          service:
            enabled: true
            embedded: true
            port: 24454
    serviceAnnotations:
      external-dns.kubernetes.io/hostname: mc.${DOMAIN}
      external-dns.kubernetes.io/target: ${IP_ADDRESS},${IPV6_ADDRESS}
      lbipam.cilium.io/ips: 172.21.68.10,2a13:e745:1ee8:68::10
      lbipam.cilium.io/sharing-key: public-services
      lbipam.cilium.io/sharing-cross-namespace: network
    serviceLabels:
      bgp: "enabled"
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft
