apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jellyfin-media
provisioner: nfs.csi.k8s.io
parameters:
  server: 172.21.71.10
  share: /srv/media
  subDir: library
  onDelete: retain
  mountPermissions: "0"
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions: [vers=4.2, hard, nosuid, nodev]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: jellyfin-media
  resources:
    requests:
      storage: 1Ti
