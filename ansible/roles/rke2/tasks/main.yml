- name: Validate the pinned RKE2 configuration
  ansible.builtin.assert:
    that:
      - rke2_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+$')
      - rke2_cluster_cidrs | length == 2
      - rke2_service_cidrs | length == 2
      - rke2_tarball_sha256 is match('^[0-9a-f]{64}$')
      - "':' in rke2_cluster_cidrs[1]"
      - "':' in rke2_service_cidrs[1]"

- name: Require a stable recovery token before first boot
  ansible.builtin.assert:
    that:
      - (rke2_token | default('')) | length >= 32
    fail_msg: Define rke2_token in the encrypted SOPS inventory before starting RKE2.
  no_log: true

- name: Require independent high-entropy BGP authentication passwords
  ansible.builtin.assert:
    that:
      - (cilium_bgp_ipv4_password | default('')) is match('^[A-Za-z0-9_-]{32,80}$')
      - (cilium_bgp_ipv6_password | default('')) is match('^[A-Za-z0-9_-]{32,80}$')
      - (cilium_bgp_ipv4_password | default('')) != (cilium_bgp_ipv6_password | default(''))
    fail_msg: >-
      Supply distinct, randomly generated, 32-80 character base64url-safe BGP passwords through encrypted
      inventory variables. Hexadecimal values are valid.
  no_log: true

- name: Create the etcd service identity required by the CIS profile
  ansible.builtin.user:
    name: etcd
    system: true
    home: /var/lib/rancher/rke2/server/db
    shell: /usr/sbin/nologin
    create_home: false

- name: Create RKE2 configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/rancher/rke2
      mode: "0750"
    - path: /var/lib/rancher/rke2/server/manifests
      mode: "0750"

- name: Remove any legacy rendered BGP authentication manifest
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests/cilium-bgp-auth-secrets.yaml
    state: absent

- name: Read the installed RKE2 version
  ansible.builtin.command: /usr/local/bin/rke2 --version
  register: rke2_installed_version
  changed_when: false
  failed_when: false

- name: Record the exact installed release
  ansible.builtin.set_fact:
    rke2_installed_release: "{{ rke2_installed_version.stdout.split()[2] if rke2_installed_version.rc
      == 0 else '' }}"

- name: Require the upgrade playbook for an installed RKE2 version change
  ansible.builtin.assert:
    that:
      - >-
        rke2_installed_version.rc != 0 or rke2_version == rke2_installed_release
    fail_msg: Update the version and checksum together, then run task ansible:upgrade.

- name: Select the immutable RKE2 release URL
  ansible.builtin.set_fact:
    rke2_release_url: >-
      https://github.com/rancher/rke2/releases/download/{{ rke2_version | replace('+', '%2B') }}
  when: rke2_version != rke2_installed_release

- name: Create the RKE2 artifact cache
  ansible.builtin.file:
    path: /var/cache/rke2
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: rke2_version != rke2_installed_release

- name: Explain the fresh-host RKE2 check-mode boundary
  ansible.builtin.debug:
    msg: >-
      RKE2 configuration, recovery, S3, and BGP inputs are valid. Check mode will not create the artifact
      cache or install RKE2, so installation-dependent checks continue after the first convergence.
  when: ansible_check_mode and rke2_version != rke2_installed_release

- name: Stop installation-dependent RKE2 checks on a fresh host
  ansible.builtin.meta: end_role
  when: ansible_check_mode and rke2_version != rke2_installed_release

- name: Download the immutable RKE2 release artifact
  ansible.builtin.get_url:
    url: "{{ rke2_release_url }}/rke2.linux-amd64.tar.gz"
    dest: "/var/cache/rke2/rke2-{{ rke2_version | replace('+', '_') }}.tar.gz"
    owner: root
    group: root
    mode: "0640"
    checksum: "sha256:{{ rke2_tarball_sha256 }}"
  when: rke2_version != rke2_installed_release

- name: Install the verified pinned RKE2 release without starting it
  ansible.builtin.unarchive:
    src: "/var/cache/rke2/rke2-{{ rke2_version | replace('+', '_') }}.tar.gz"
    dest: /usr/local
    remote_src: true
  changed_when: true
  notify: Restart RKE2
  when: rke2_version != rke2_installed_release

- name: Preserve Flux-managed ingress ownership
  ansible.builtin.import_tasks: ingress.yml
  notify: Restart RKE2

- name: Disable native plaintext etcd uploads
  ansible.builtin.import_tasks: encrypted-backup-policy.yml
  notify: Restart RKE2

- name: Install the RKE2 server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ (rke2_etcd_s3_enabled | bool) or ((rke2_token | default('')) | length > 0) }}"
  notify: Restart RKE2

- name: Install the bootstrap Cilium configuration
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    owner: root
    group: root
    mode: "0640"
  notify:
    - Restart RKE2
    - Wait for Cilium Helm values
    - Restart Cilium

- name: Install the RKE2 CoreDNS configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/bootstrap/rke2-coredns.yaml"
    dest: /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml
    owner: root
    group: root
    mode: "0640"

- name: Enable and start RKE2
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending RKE2 restart before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Wait for the Kubernetes API
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - get
      - --raw=/readyz
  register: rke2_kubernetes_ready
  retries: 36
  delay: 5
  until: rke2_kubernetes_ready.rc == 0 and rke2_kubernetes_ready.stdout == 'ok'
  changed_when: false

- name: Apply Cilium BGP authentication Secrets without persistent plaintext
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - apply
      - -f
      - "-"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: cilium-bgp-ipv4-auth
        namespace: kube-system
      type: Opaque
      stringData:
        password: {{ cilium_bgp_ipv4_password | to_json }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: cilium-bgp-ipv6-auth
        namespace: kube-system
      type: Opaque
      stringData:
        password: {{ cilium_bgp_ipv6_password | to_json }}
  register: rke2_cilium_bgp_auth_secrets
  failed_when: false
  changed_when: >-
    'created' in rke2_cilium_bgp_auth_secrets.stdout or 'configured' in rke2_cilium_bgp_auth_secrets.stdout
  no_log: true

- name: Report a BGP authentication Secret apply failure without credential content
  ansible.builtin.fail:
    msg: kubectl failed to apply the BGP Secrets; inspect API readiness and permissions.
  when: rke2_cilium_bgp_auth_secrets.rc != 0

- name: Wait for the Cilium agent
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - -n
      - kube-system
      - rollout
      - status
      - daemonset/cilium
      - --timeout=300s
  changed_when: false

- name: Install the Prometheus host metrics exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the node exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/prometheus/node-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the node exporter textfile collector
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus node exporter

- name: Enable the Prometheus node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Install tools for independent etcd recovery
  ansible.builtin.import_tasks: recovery-tools.yml

- name: Install encrypted scheduled etcd backups
  ansible.builtin.import_tasks: encrypted-backup.yml

- name: Enable encrypted scheduled etcd backups
  ansible.builtin.systemd_service:
    name: rke2-etcd-restic-backup.timer
    enabled: true
    state: started

- name: Report the server-token recovery requirement without exposing it
  ansible.builtin.debug:
    msg: >-
      Preserve /var/lib/rancher/rke2/server/token independently; it is required with an etcd snapshot
      for disaster recovery. This role deliberately does not read or print it.
