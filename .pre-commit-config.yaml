default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: ec
        language: system
        stages: [pre-commit]
      - id: kubeconform
        name: kubeconform
        # Wrapper applies `flux envsubst` first so postBuild placeholders
        # resolve before validation (e.g. ${VAR:=1000} -> 1000 satisfies
        # typed-int schema fields like runAsUser).
        entry: scripts/kubeconform.sh
        language: system
        files: ^kubernetes/.*\.ya?ml$
        stages: [pre-commit]
      - id: reuse
        name: reuse
        entry: reuse
        args: [lint-file]
        language: system
        stages: [pre-commit]
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        types: [yaml]
        stages: [pre-commit]
      - id: verify-push-signatures
        name: verify pushed commit signatures
        entry: scripts/verify-push-signatures.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/onedr0p/sops-pre-commit
    rev: v2.1.1
    hooks:
      - id: forbid-secrets
        name: forbid-secrets
        files: .*\.sops\.ya?ml
