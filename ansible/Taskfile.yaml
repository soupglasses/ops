version: "3"

tasks:
  deps:
    desc: Install pinned Ansible collections
    cmds:
      - ansible-galaxy collection install -r requirements.yml

  test:
    desc: Check all playbooks without loading encrypted variables
    env:
      # Use the pinned linter's bundled schemas; its HTTP 304 refresh leaks a response.
      ANSIBLE_LINT_SKIP_SCHEMA_UPDATE: "1"
    cmds:
      - for playbook in playbooks/*.yml; do ansible-playbook "$playbook" --syntax-check || exit; done
      - ansible-lint

  bootstrap:
    desc: Create the automation account through the human administrator login
    cmds:
      - ansible-playbook playbooks/bootstrap.yml {{.CLI_ARGS}}

  bootstrap-flux:
    desc: Resume the GitOps handoff on an already running control plane
    cmds:
      - ansible-playbook playbooks/bootstrap-flux.yml {{.CLI_ARGS}}

  network:
    desc: Configure static addresses during a console-backed maintenance window
    cmds:
      - ansible-playbook playbooks/network.yml {{.CLI_ARGS}}

  check:
    desc: Preview host changes (operator credential access required)
    env:
      ANSIBLE_VARS_ENABLED: host_group_vars,community.sops.sops
    cmds:
      - ansible-playbook playbooks/site.yml --check --diff

  apply:
    desc: Converge host configuration (operator credential access required)
    env:
      ANSIBLE_VARS_ENABLED: host_group_vars,community.sops.sops
    cmds:
      - ansible-playbook playbooks/site.yml

  upgrade:
    desc: Upgrade pinned RKE2 and bundled Cilium after recovery and release preflight
    env:
      ANSIBLE_VARS_ENABLED: host_group_vars
    cmds:
      - ansible-playbook playbooks/upgrade-rke2.yml {{.CLI_ARGS}}

  verify:
    desc: Verify host, Kubernetes, Cilium, snapshots and ZFS without loading credentials
    cmds:
      - ansible-playbook playbooks/verify.yml

  firewall:verify:
    desc: Verify enforced Flux host policy through fresh dual-stack connections
    cmds:
      - ansible-playbook playbooks/verify-host-firewall.yml
