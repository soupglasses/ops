apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  path: ./kubernetes/apps/kube-system/csi-driver-nfs/app
  targetNamespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
