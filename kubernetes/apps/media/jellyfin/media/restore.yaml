apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-media-restore-v1
  namespace: media
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-media-restore
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: ghcr.io/soupglasses/ops/jellyfin-runtime@sha256:54ed2633b05a399f14f35fc3b23285dbf25b02b4f8ae3dbeb411866ce8444820
          command: [python3, /usr/local/lib/jellyfin/media_restore.py]
          args: [--root, /media, --allow-initialize, --initialize-repository]
          envFrom:
            - secretRef:
                name: volsync-jellyfin-media
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: temporary
          emptyDir: {}
