apiVersion: v1
kind: ConfigMap
metadata:
  name: node-overview-dashboard
  labels:
    grafana_dashboard: "1"
data:
  node-overview.json: |-
    {
      "uid": "node-overview",
      "title": "Node overview",
      "description": "Host utilization with stacked Kubernetes application usage.",
      "editable": false,
      "schemaVersion": 41,
      "version": 1,
      "tags": [
        "kubernetes",
        "nodes"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "VictoriaMetrics"
            },
            "definition": "label_values(node_uname_info{job=\"rke2-host-metrics\"}, nodename)",
            "query": {
              "query": "label_values(node_uname_info{job=\"rke2-host-metrics\"}, nodename)",
              "refId": "node"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "current": {
              "text": "nas",
              "value": "nas"
            }
          },
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "VictoriaMetrics"
            },
            "definition": "label_values(node_uname_info{job=\"rke2-host-metrics\",nodename=\"$node\"}, instance)",
            "query": {
              "query": "label_values(node_uname_info{job=\"rke2-host-metrics\",nodename=\"$node\"}, instance)",
              "refId": "instance"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 2,
            "current": {
              "text": "172.21.71.10:9100",
              "value": "172.21.71.10:9100"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Node overview",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "CPU busy",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{job=\"rke2-host-metrics\",instance=\"$instance\",mode=\"idle\"}[$__rate_interval])))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "description": "Percentage of total node CPU capacity across all cores."
        },
        {
          "id": 3,
          "title": "Memory used",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"rke2-host-metrics\",instance=\"$instance\"} / node_memory_MemTotal_bytes{job=\"rke2-host-metrics\",instance=\"$instance\"})",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Root filesystem used",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"rke2-host-metrics\",instance=\"$instance\",mountpoint=\"/\"} / node_filesystem_size_bytes{job=\"rke2-host-metrics\",instance=\"$instance\",mountpoint=\"/\"})",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Uptime",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - node_boot_time_seconds{job=\"rke2-host-metrics\",instance=\"$instance\"}",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
