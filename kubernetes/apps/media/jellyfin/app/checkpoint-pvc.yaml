apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-checkpoint
  annotations:
    volsync.backube/use-copy-trigger: ""
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-zfs
  resources:
    requests:
      storage: 20Gi
