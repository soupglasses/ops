apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: alertmanager-smtp
      valuesKey: values.yaml
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.90.2
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    victoria-metrics-operator:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      crds:
        cleanup:
          # Never let removing this release delete unrelated VM custom resources.
          enabled: false

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 1y
        # The shared VolSync component owns the PVC and restores it before binding.
        storage: null
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: victoria-metrics
        initContainers:
          - name: require-restored-metrics
            image: victoriametrics/victoria-metrics:v1.149.0@sha256:13b8951e35bb3589626816538483127785a9d8b53f9f5123769db0fcab1d961f
            command: [/bin/sh, -ec]
            args:
              - test -d /data/data && test -d /data/metadata
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: data
                mountPath: /data
                readOnly: true
        extraArgs:
          storage.minFreeDiskSpaceBytes: 5GB
        useStrictSecurity: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    vmagent:
      enabled: true
      spec:
        selectAllByDefault: false
        serviceScrapeNamespaceSelector: {}
        serviceScrapeSelector:
          matchLabels:
            monitoring.finnes.dev/enabled: "true"
        scrapeInterval: 1m
        useStrictSecurity: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi

    vmalert:
      enabled: true
      spec:
        selectAllByDefault: false
        ruleNamespaceSelector: {}
        evaluationInterval: 1m
        ruleSelector:
          matchLabels:
            monitoring.finnes.dev/enabled: "true"
        useStrictSecurity: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    alertmanager:
      enabled: true
      # Leave room for the operator's prefix and StatefulSet revision suffix.
      name: victoria-metrics
      # Raw configuration allows sensitive global SMTP authentication values to
      # arrive through Helm valuesFrom without putting them in a rendered CR.
      useManagedConfig: false
      spec:
        selectAllByDefault: false
        useStrictSecurity: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      config:
        global:
          smtp_from: alertmanager@noreply.finnes.dev
          smtp_require_tls: true
          smtp_smarthost: prod-mta-06.swg-srv.net:2525
        route:
          receiver: monitoring-email
          group_by:
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
        receivers:
          - name: monitoring-email
            email_configs:
              - send_resolved: true
                to: alerts+ops@finnes.dev
      monzoTemplate:
        enabled: false

    # Avoid duplicate exporters and broad cluster scraping. VMAgent only selects
    # explicitly labelled repository-owned ServiceMonitors.
    defaultDashboards:
      enabled: false
    syncJob:
      enabled: false
    defaultRules:
      enabled: false
    grafana:
      enabled: true
      rbac:
        create: true
        namespaced: true
        # The chart still generates the namespace-local binding, but its
        # built-in Role always includes Secrets. Bind our ConfigMap-only Role.
        useExistingRole: victoria-metrics-grafana-configmaps
      admin:
        existingSecret: grafana-auth
        userKey: admin-user
        passwordKey: admin-password
      defaultDashboardsTimezone: browser
      plugins:
        - victoriametrics-logs-datasource@0.32.0
      ingress:
        enabled: true
        ingressClassName: nginx-public
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-dns01-production
          external-dns.alpha.kubernetes.io/hostname: grafana.${DOMAIN}
          external-dns.alpha.kubernetes.io/target: ${IP_ADDRESS},${IPV6_ADDRESS}
        hosts:
          - grafana.${DOMAIN}
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${DOMAIN}
      persistence:
        # Dashboards and datasources are provisioned from Git. Keeping Grafana
        # stateless makes clean recovery deterministic and avoids backing up an
        # otherwise authoritative SQLite database.
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          resource: configmap
          searchNamespace: monitoring
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
          resource: configmap
          searchNamespace: monitoring
      grafana.ini:
        analytics:
          check_for_updates: false
          reporting_enabled: false
        auth.anonymous:
          enabled: false
        security:
          cookie_secure: true
          disable_gravatar: true
          strict_transport_security: true
          strict_transport_security_max_age_seconds: 31536000
        server:
          domain: grafana.${DOMAIN}
          root_url: https://grafana.${DOMAIN}
        users:
          allow_sign_up: false
      assertNoLeakedSecrets: true
    defaultDatasources:
      victoriametrics:
        # Use the Prometheus-compatible API built into Grafana. The optional
        # VictoriaMetrics plugin is unnecessary for the initial deployment.
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
            editable: false
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: false
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    coreDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
