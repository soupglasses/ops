apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openldap
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 389
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: require-restored-directory
          image: docker.io/nfrastack/openldap:2.6-8.1.1@sha256:5e5c8fdd1d7e3a9623500839699b258d0569bf965528b85c682ec5d0902f5d6c
          command:
            - /bin/sh
            - -ec
          args:
            - test -s /data/db/data.mdb; test -s /data/config/cn=config.ldif; test -s '/data/config/cn=config/olcDatabase={1}mdb.ldif';
              mkdir -p /run/openldap/run
          securityContext:
            runAsNonRoot: true
            runAsUser: 389
            runAsGroup: 389
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run/openldap
        - name: reconcile-directory-policy
          image: ghcr.io/soupglasses/ops/openldap-acl@sha256:5a114d208d8e6c70f0215ec4642ea50ba573b463a5c717db4de3d783ce286028
          args:
            - --policy
            - /policy/jellyfin.ldif
            - --config-directory
            - /data/config
            - --lock-timeout
            - "120"
          securityContext:
            runAsNonRoot: true
            runAsUser: 389
            runAsGroup: 389
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: acl-policy
              mountPath: /policy
              readOnly: true
      containers:
        - name: openldap
          image: ghcr.io/soupglasses/ops/openldap-acl@sha256:5a114d208d8e6c70f0215ec4642ea50ba573b463a5c717db4de3d783ce286028
          command:
            - /bin/sh
            - /usr/local/lib/openldap-acl/serve.sh
          args:
            - -F
            - /data/config
            - -h
            - ldaps://0.0.0.0:1636/ ldapi:///
            - -d
            - '256'
          securityContext:
            runAsNonRoot: true
            runAsUser: 389
            runAsGroup: 389
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /var/lib/openldap
              subPath: db
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: run
              mountPath: /run/openldap
            - name: source
              mountPath: /source
              readOnly: true
          ports:
            - name: ldaps
              containerPort: 1636
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - openssl s_client -connect 127.0.0.1:1636 -servername ldap.finnes.dev -verify_hostname
                  ldap.finnes.dev -verify_return_error </dev/null >/dev/null 2>&1
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: ldaps
            initialDelaySeconds: 20
            periodSeconds: 20
        - name: tls-reload
          image: docker.io/nfrastack/openldap:2.6-8.1.1@sha256:5e5c8fdd1d7e3a9623500839699b258d0569bf965528b85c682ec5d0902f5d6c
          command:
            - /bin/sh
            - /source/reload-tls.sh
          securityContext:
            runAsNonRoot: true
            runAsUser: 389
            runAsGroup: 389
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: run
              mountPath: /run/openldap
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: acl-policy
          configMap:
            name: openldap-acl-policy
        - name: data
          persistentVolumeClaim:
            claimName: openldap-directory
        - name: run
          emptyDir: {}
        - name: source
          configMap:
            name: openldap-runtime
        - name: tls
          secret:
            secretName: openldap-tls
            defaultMode: 0440
