apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: openebs-zfs-snapshot-retain
driver: zfs.csi.openebs.io
deletionPolicy: Retain
parameters:
  recordsize: "128k"
  compression: "zstd"
  dedup: "off"
  fstype: "zfs"
  poolname: "zfspool/k8s"
