apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: SystemConfiguration
metadata:
  name: jellyfin
  annotations:
    crossplane.io/external-name: system
spec:
  managementPolicies:
    - Observe
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin
  forProvider:
    serverName: Jellyfin
    uiCulture: en-US
    metadataCountryCode: US
    preferredMetadataLanguage: en
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: NetworkingConfiguration
metadata:
  name: jellyfin
  annotations:
    crossplane.io/external-name: network
spec:
  managementPolicies:
    - Observe
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin
  forProvider:
    enableUpnp: false
    enableRemoteAccess: true
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: BrandingConfiguration
metadata:
  name: jellyfin
  annotations:
    crossplane.io/external-name: branding
spec:
  managementPolicies:
    - Observe
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin
  forProvider:
    loginDisclaimer: ''
