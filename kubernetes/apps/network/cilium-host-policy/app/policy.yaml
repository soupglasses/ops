apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-host-ingress
spec:
  description: Permit only management, cluster, BGP, and essential ICMP traffic to the RKE2 host.
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: nas
  ingress:
    - fromEntities:
        - host
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
            - {port: "10250", protocol: TCP}
            - {port: "10257", protocol: TCP}
            - {port: "10259", protocol: TCP}
            - {port: "4240", protocol: TCP}
            - {port: "4244", protocol: TCP}
            - {port: "9100", protocol: TCP}
    - fromCIDR:
        - 172.21.69.0/24
        - 172.21.70.0/24
        - 2a13:e745:1ee8:69::/64
        - 2a13:e745:1ee8:70::/64
      toPorts:
        - ports:
            - {port: "22", protocol: TCP}
    - fromCIDR:
        - 172.21.69.0/24
        - 172.21.70.0/24
        - 2a13:e745:1ee8:69::/64
        - 2a13:e745:1ee8:70::/64
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
            - {port: "9345", protocol: TCP}
            - {port: "10250", protocol: TCP}
    - fromCIDR:
        - 172.21.69.0/24
        - 172.21.70.0/24
        - 2a13:e745:1ee8:69::/64
        - 2a13:e745:1ee8:70::/64
      toPorts:
        - ports:
            - {port: "2049", protocol: TCP}
    - fromCIDR:
        - 172.21.71.1/32
        - 2a13:e745:1ee8:71::1/128
      toPorts:
        - ports:
            - {port: "179", protocol: TCP}
    - icmps:
        - fields:
            - {family: IPv4, type: DestinationUnreachable}
            - {family: IPv4, type: TimeExceeded}
            - {family: IPv4, type: EchoRequest}
            - {family: IPv6, type: DestinationUnreachable}
            - {family: IPv6, type: PacketTooBig}
            - {family: IPv6, type: TimeExceeded}
            - {family: IPv6, type: ParameterProblem}
            - {family: IPv6, type: EchoRequest}
            - {family: IPv6, type: RouterAdvertisement}
            - {family: IPv6, type: NeighborSolicitation}
            - {family: IPv6, type: NeighborAdvertisement}
