# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.12.3
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    printNotes: false
    serviceAccount:
      create: true
      automountToken: false

    server:
      retentionPeriod: 7d
      # Keep 20% of the PVC free for merges and ingestion bursts. Time and size
      # retention both apply; whichever threshold is reached first wins.
      retentionDiskSpaceUsage: 32GiB
      extraArgs:
        envflag.enable: true
        envflag.prefix: VM_
        loggerFormat: json
        httpListenAddr: :9428
        http.shutdownDelay: 15s
        snapshotsMaxAge: 1d
      persistentVolume:
        enabled: true
        existingClaim: victoria-logs
        mountPath: /storage
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      ingress:
        enabled: false
      service:
        type: ClusterIP
      vmServiceScrape:
        enabled: true
        extraLabels:
          app.kubernetes.io/name: victoria-logs
          monitoring.finnes.dev/enabled: "true"
        interval: 1m
        scrapeTimeout: 10s

    vector:
      enabled: true
      role: Agent
      image:
        # The journald source invokes journalctl, which isn't in the distroless image.
        base: debian
      serviceAccount:
        create: true
        automountToken: true
      rbac:
        create: true
      podLabels:
        vector.dev/exclude: "true"
      tolerations:
        - operator: Exists
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      # Limit host access to logs. In particular, do not mount the chart's
      # default /var/lib, /proc, or /sys host paths.
      defaultVolumes:
        - name: var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: run-log-journal
          hostPath:
            path: /run/log/journal
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
      defaultVolumeMounts:
        - name: var-log
          mountPath: /var/log
          readOnly: true
        - name: run-log-journal
          mountPath: /run/log/journal
          readOnly: true
        - name: machine-id
          mountPath: /etc/machine-id
          readOnly: true
      persistence:
        hostPath:
          enabled: true
          path: /var/lib/vector-victoria-logs
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      customConfig:
        data_dir: /vector-data-dir
        api:
          enabled: false
        sources:
          k8s:
            type: kubernetes_logs
            # Escape Flux substitution; Vector expands this from the pod env.
            self_node_name: $${VECTOR_SELF_NODE_NAME}
          journald:
            type: journald
            current_boot_only: false
            since_now: false
          internal_metrics:
            type: internal_metrics
        transforms:
          parser:
            type: remap
            inputs: [k8s]
            source: |
              .log = parse_json(.message) ?? .message
              del(.message)
              .source = "kubernetes"
          journald_normalize:
            type: remap
            inputs: [journald]
            source: |
              .node_name = get_env_var!("VECTOR_SELF_NODE_NAME")
              .source = "journald"
        sinks:
          exporter:
            type: prometheus_exporter
            address: 0.0.0.0:9090
            inputs: [internal_metrics]
          vlogs:
            type: elasticsearch
            inputs: [parser, journald_normalize]
            mode: bulk
            api_version: v8
            compression: gzip
            healthcheck:
              enabled: true
            buffer:
              type: disk
              max_size: 536870912
              when_full: block
            request:
              headers:
                VL-Time-Field: timestamp
                VL-Stream-Fields: source,node_name,kubernetes.pod_namespace,kubernetes.container_name,_SYSTEMD_UNIT
                VL-Msg-Field: message,msg,_msg,log.msg,log.message,log
                AccountID: "0"
                ProjectID: "0"

    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
