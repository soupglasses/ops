apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptimekuma-controller
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: uptimekuma-provider
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: package-runtime
          env:
            - name: WATCH_NAMESPACE
              value: monitoring
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          image: provider-runtime
      serviceAccountName: uptimekuma-controller
