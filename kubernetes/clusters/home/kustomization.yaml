# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - cluster-apps.yaml
  - cluster-repositories.yaml
  - secret.sops.yaml
  - ./flux-system
  # Use parts of components directly, gotk defines flux-system directly causing a conflict otherwise.
  - ../../components/common/alerts
  - ../../components/common/config
