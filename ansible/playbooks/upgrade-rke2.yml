- name: Upgrade RKE2 after backup preflight
  hosts: rke2_servers
  become: true
  serial: 1
  tasks:
    - name: Require an explicitly selected RKE2 version
      ansible.builtin.assert:
        that:
          - rke2_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+\\+rke2r[0-9]+$')

    - name: Create an etcd snapshot before upgrading
      ansible.builtin.command: rke2 etcd-snapshot save --name pre-upgrade
      environment:
        PATH: /var/lib/rancher/rke2/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
      changed_when: true

    - name: Apply the pinned RKE2 role
      ansible.builtin.include_role:
        name: rke2
