- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Install the host ruleset
  ansible.builtin.template:
    src: host-firewall.nft.j2
    dest: /etc/host-firewall.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft --check --file %s

- name: Install the host firewall unit
  ansible.builtin.template:
    src: host-firewall.service.j2
    dest: /etc/systemd/system/host-firewall.service
    owner: root
    group: root
    mode: "0644"

- name: Load the ruleset and keep it only when new connections succeed
  when: not ansible_check_mode
  block:
    - name: Arm a rollback that removes the firewall after five minutes
      ansible.builtin.command:
        argv:
          - systemd-run
          - --collect
          - --unit=host-firewall-rollback
          - --on-active=5min
          - systemctl
          - disable
          - --now
          - host-firewall.service
      changed_when: true

    - name: Load the host ruleset
      ansible.builtin.systemd_service:
        name: host-firewall.service
        state: reloaded
        enabled: true
        daemon_reload: true

    - name: Open a fresh SSH session from the controller
      ansible.builtin.command:
        argv:
          - ssh
          - "-{{ item.family }}"
          - -S
          - none
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=10
          - -o
          - "HostKeyAlias={{ network_ipv4_address.split('/')[0] }}"
          - -o
          - "HostName={{ item.address }}"
          - "{{ inventory_hostname }}"
          - /bin/true
      loop:
        - family: 4
          address: "{{ network_ipv4_address.split('/')[0] }}"
        - family: 6
          address: "{{ network_ipv6_address.split('/')[0] }}"
      loop_control:
        label: "IPv{{ item.family }}: {{ item.address }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Open the Kubernetes API and NFS ports from the controller
      ansible.builtin.wait_for:
        host: "{{ item[0].split('/')[0] }}"
        port: "{{ item[1] }}"
        connect_timeout: 5
        timeout: 15
      loop: "{{ [network_ipv4_address, network_ipv6_address] | product([6443, 2049]) | list }}"
      delegate_to: localhost
      become: false

    - name: Keep the firewall by stopping the rollback
      ansible.builtin.systemd_service:
        name: host-firewall-rollback.timer
        state: stopped
