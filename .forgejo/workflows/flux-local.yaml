name: Flux Local Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ forge.workflow }}-${{ forge.event.number || forge.ref }}
  cancel-in-progress: true

jobs:
  flux-local:
    name: Flux Local
    runs-on: codeberg-tiny
    env:
      CLUSTER_PATH: kubernetes/clusters/home
      STRIP_ATTRS: "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
      - name: Install tools
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Export token for install scripts
          export GITHUB_TOKEN
          echo "Token length: ${#GITHUB_TOKEN}"
          # Install kustomize (downloads from GitHub releases)
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize /usr/local/bin/
          # Install helm (uses get.helm.sh, no GitHub API)
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          # Install flux (downloads from GitHub releases)
          curl -s https://fluxcd.io/install.sh | bash
      - name: Install flux-local
        run: |
          pip install flux-local==4.3.1
      - name: Test
        run: |
          flux-local test --enable-helm --all-namespaces --path $CLUSTER_PATH -v
      - name: Checkout base branch
        if: always() && forge.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ forge.base_ref }}
          path: base
      - name: Diff
        if: always() && forge.event_name == 'pull_request'
        run: |
          flux-local diff kustomization --path $CLUSTER_PATH --path-orig base/$CLUSTER_PATH \
            --strip-attrs $STRIP_ATTRS --all-namespaces | tee -a diff.txt
          flux-local diff helmrelease --path $CLUSTER_PATH --path-orig base/$CLUSTER_PATH \
            --strip-attrs $STRIP_ATTRS --all-namespaces | tee -a diff.txt
      - name: Comment on PR
        if: always() && forge.event_name == 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ ! -s diff.txt ]; then
            echo "No diff output, skipping comment."
            exit 0
          fi

          {
            echo "## Flux Local Diff"
            echo ""
            echo '```diff'
            cat diff.txt
            echo '```'
          } > body.md

          jq -Rs '{"body": .}' body.md | \
            curl -s -X POST \
              "${{ forge.server_url }}/api/v1/repos/${{ forge.repository }}/issues/${{ forge.event.number }}/comments" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @-
