apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway-api-crds
  namespace: network
spec:
  path: ./kubernetes/apps/network/cilium-gateway/crds
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 1h
  prune: false
  wait: true
  timeout: 5m
