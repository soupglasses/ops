version: "3"

set: [pipefail]
shopt: [globstar]

tasks:
  install:
    desc: Install the committed Flux controllers without removing existing resources
    cmds:
      - kubectl apply --server-side -f kubernetes/clusters/home/flux-system/gotk-components.yaml
      - kubectl -n flux-system rollout status deployment/source-controller --timeout=180s
      - kubectl -n flux-system rollout status deployment/kustomize-controller --timeout=180s
      - kubectl -n flux-system rollout status deployment/helm-controller --timeout=180s

  bootstrap:import-secrets:
    desc: Import existing Flux credentials over SSH
    preconditions:
      - command -v sops
      - command -v ssh
    cmds:
      - |
        for secret in \
          kubernetes/clusters/home/secret.sops.yaml \
          kubernetes/components/common/sops/secret.sops.yaml; do
          sops --decrypt "$secret" |
            ssh -F /dev/null -o BatchMode=yes -i "$HOME/.ssh/ansible" \
              -o StrictHostKeyChecking=yes -o HostKeyAlias=nas.home.finnes.dev \
              ansible@172.21.71.10 \
              'sudo -n /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml apply -n flux-system -f -' || exit
        done
      - >-
        ssh -F /dev/null -o BatchMode=yes -i "$HOME/.ssh/ansible" -o StrictHostKeyChecking=yes -o HostKeyAlias=nas.home.finnes.dev
        ansible@172.21.71.10 'sudo -n /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n flux-system get secret flux-system sops-age'

  bootstrap:
    desc: Connect Flux to Git after operator credential installation
    preconditions:
      - sh: kubectl -n flux-system get secret flux-system sops-age >/dev/null
        msg: Install the existing Git and SOPS credentials first; see docs/rke2-operations.md.
      - kubectl -n kube-system rollout status deployment/rke2-snapshot-controller --timeout=120s
    cmds:
      - kubectl apply --server-side -k kubernetes/apps/network/cilium-gateway/crds
      - >-
        kubectl wait --for=condition=Established --timeout=120s -k kubernetes/apps/network/cilium-gateway/crds
      # Cilium discovers Gateway API CRDs only when the operator starts.
      - kubectl -n kube-system rollout restart deployment/cilium-operator
      - kubectl -n kube-system rollout status deployment/cilium-operator --timeout=180s
      - kubectl apply -k kubernetes/clusters/home/flux-system
      - flux reconcile kustomization flux-system --with-source

  reconcile:
    desc: Trigger manual reconcile for Flux.
    preconditions:
      - which flux
      - flux check
    cmd: flux reconcile kustomization flux-system --with-source
  reconcile-ks:
    desc: Reconcile all Flux Kustomizations across all namespaces
    preconditions:
      - which flux
      - flux check
    cmds:
      - flux reconcile kustomization flux-system --namespace flux-system --with-source
      - |
        kubectl get kustomizations.kustomize.toolkit.fluxcd.io --all-namespaces -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' | \
        while read namespace name; do
          if [ ! -z "$namespace" ] && [ ! -z "$name" ]; then
            flux reconcile kustomization "$name" --namespace "$namespace"
          fi
        done
  unstuck:
    desc: Reconcile all Flux Kustomizations across all namespaces
    preconditions:
      - which flux
      - flux check
    requires:
      vars: [NAME, NAMESPACE]
    cmds:
      - |
        flux suspend kustomization "{{.NAME}}" --namespace "{{.NAMESPACE}}"
        flux resume kustomization "{{.NAME}}" --namespace "{{.NAMESPACE}}"
