# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./certificate.yaml
  - ./secret.sops.yaml
  - ./configmap.yaml
components:
  - ../../../../components/volsync
  - ../../../../components/volsync-quiesce
configMapGenerator:
  - name: openldap-oauth-schema
    files:
      - ./oauth.schema.conf
