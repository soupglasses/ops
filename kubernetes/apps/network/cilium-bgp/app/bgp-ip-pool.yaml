# CiliumLoadBalancerIPPool defines the IP pool for BGP LoadBalancer services
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bgp-pool
  namespace: kube-system
spec:
  blocks:
    - cidr: "172.21.68.10/32"
    - cidr: "2a13:e745:1ee8:68::10/128"
  # Only allocate to services with the bgp label
  serviceSelector:
    matchLabels:
      bgp: "enabled"
