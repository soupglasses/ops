apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-observer
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - replicationcontrollers
      - resourcequotas
      - services
      - serviceaccounts
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, csinodes, csistoragecapacities, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses, volumesnapshotcontents, volumesnapshots]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [buckets, externalartifacts, gitrepositories, helmcharts, helmrepositories, ocirepositories]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [alerts, providers, receivers]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [alertmanagers, podmonitors, probes, prometheuses, prometheusrules, scrapeconfigs, servicemonitors,
      thanosrulers]
    verbs: [get, list, watch]
  - apiGroups: [volsync.backube]
    resources: [replicationdestinations, replicationsources]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates, clusterissuers, issuers]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: [ciliumbgpadvertisements, ciliumbgpclusterconfigs, ciliumbgppeerconfigs, ciliumbgppeeringpolicies,
      ciliumloadbalancerippools, ciliumnetworkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [tailscale.com]
    resources: [connectors, dnsconfigs, proxyclasses, proxygroups, recorders]
    verbs: [get, list, watch]
  - apiGroups: [infra.contrib.fluxcd.io]
    resources: [terraforms]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-security-reviewer
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingadmissionpolicies, validatingadmissionpolicybindings,
      validatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-flux-reconciler
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, helmcharts, helmrepositories, ocirepositories]
    verbs: [get, list, watch, patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-observers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-observer
subjects:
  - kind: ServiceAccount
    name: opslead
    namespace: hermes-system
  - kind: ServiceAccount
    name: incident
    namespace: hermes-system
  - kind: ServiceAccount
    name: observability
    namespace: hermes-system
  - kind: ServiceAccount
    name: implementer
    namespace: hermes-system
  - kind: ServiceAccount
    name: security
    namespace: hermes-system
  - kind: ServiceAccount
    name: resilience
    namespace: hermes-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-security-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-security-reviewer
subjects:
  - kind: ServiceAccount
    name: security
    namespace: hermes-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-flux-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-flux-reconciler
subjects:
  - kind: ServiceAccount
    name: implementer
    namespace: hermes-system
