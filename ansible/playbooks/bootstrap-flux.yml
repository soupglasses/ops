- name: Resume GitOps bootstrap on an already running control plane
  hosts: rke2_servers
  become: true
  gather_facts: false
  tasks:
    - name: Bootstrap Flux from the committed configuration
      ansible.builtin.import_tasks: tasks/bootstrap-flux.yml
