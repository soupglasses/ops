version: "3"

set: [pipefail]
shopt: [globstar]

tasks:
  bootstrap:
    desc: Bootstrap flux on the cluster, should only be run once.
    preconditions:
      - test -f ".secure/age.agekey"
    prompt: Are you sure you want to (RE)INSTALL Flux?
    cmds:
      - flux uninstall --namespace=flux-system --silent || true
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
      - sops -d kubernetes/clusters/home/secret.sops.yaml | kubectl apply -n flux-system -f -
      - sops -d kubernetes/components/common/sops/secret.sops.yaml | kubectl apply -n flux-system -f -
      - |
        export GITEA_TOKEN=$(sops -d kubernetes/clusters/home/secret.sops.yaml | yq .stringData.password)
        flux bootstrap gitea \
          --token-auth \
          --hostname=codeberg.org \
          --owner=soupglasses \
          --repository=ops \
          --branch=main \
          --path=kubernetes/clusters/home \
          --personal
  reconcile:
    desc: Trigger manual reconcile for Flux.
    preconditions:
      - which flux
      - flux check
    cmd: flux reconcile kustomization flux-system --with-source
  reconcile-ks:
    desc: Reconcile all Flux Kustomizations across all namespaces
    preconditions:
      - which flux
      - flux check
    cmds:
      - flux reconcile kustomization flux-system --namespace flux-system --with-source
      - |
        kubectl get kustomizations.kustomize.toolkit.fluxcd.io --all-namespaces -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' | \
        while read namespace name; do
          if [ ! -z "$namespace" ] && [ ! -z "$name" ]; then
            flux reconcile kustomization "$name" --namespace "$namespace"
          fi
        done
  unstuck:
    desc: Reconcile all Flux Kustomizations across all namespaces
    preconditions:
      - which flux
      - flux check
    requires:
      vars: [NAME, NAMESPACE]
    cmds:
      - |
        flux suspend kustomization "{{.NAME}}" --namespace "{{.NAMESPACE}}"
        flux resume kustomization "{{.NAME}}" --namespace "{{.NAMESPACE}}"
