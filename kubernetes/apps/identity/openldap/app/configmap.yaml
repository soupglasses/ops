# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.33.2/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-overlays
data:
  01-memberof.ldif: |
    dn: olcOverlay=memberof,olcDatabase={1}mdb,cn=config
    changetype: add
    objectClass: olcConfig
    objectClass: olcMemberOf
    objectClass: olcOverlayConfig
    objectClass: top
    olcOverlay: memberof
    olcMemberOfDangling: ignore
    olcMemberOfRefInt: TRUE
    olcMemberOfGroupOC: groupOfNames
    olcMemberOfMemberAD: member
    olcMemberOfMemberOfAD: memberOf

  02-refint.ldif: |
    dn: olcOverlay=refint,olcDatabase={1}mdb,cn=config
    changetype: add
    objectClass: olcConfig
    objectClass: olcOverlayConfig
    objectClass: olcRefintConfig
    objectClass: top
    olcOverlay: refint
    olcRefintAttribute: memberof
    olcRefintAttribute: member
    olcRefintAttribute: manager
    olcRefintAttribute: owner

  03-ppolicy.ldif: |
    dn: olcOverlay=ppolicy,olcDatabase={1}mdb,cn=config
    changetype: add
    objectClass: olcOverlayConfig
    objectClass: olcPPolicyConfig
    olcOverlay: ppolicy
    olcPPolicyDefault: cn=password,ou=policies,dc=finnes,dc=dev
    olcPPolicyUseLockout: TRUE

  04-otp.ldif: |
    dn: olcOverlay=otp,olcDatabase={1}mdb,cn=config
    changetype: add
    objectClass: olcOverlayConfig
    olcOverlay: otp
