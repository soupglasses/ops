automation_user: ansible
# Only the public half is read here. Back up the private key in the controller credential store.
automation_authorized_key: >-
  {{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/ansible.pub') | trim
  }}
# Exact stable controller sources used by the SSH key restriction and host firewall policy.
automation_controller_sources:
  - 172.21.69.10/32
  - 2a13:e745:1ee8:69:1911:3b22:c2d8:819d/128
automation_controller_allowed_ipv4_subnet: 172.21.69.0/24
automation_controller_allowed_ipv6_subnet: 2a13:e745:1ee8:69::/64

network_interface: "{{ ansible_default_ipv4.interface }}"
network_ipv4_address: 172.21.71.10/24
network_ipv4_gateway: 172.21.71.1
network_ipv6_address: 2a13:e745:1ee8:71::10/64
network_ipv6_gateway: 2a13:e745:1ee8:71::1
network_dns_servers:
  - 172.21.71.1
  - 2a13:e745:1ee8:71::1
network_ntp_servers:
  - 172.21.71.1

zfs_pool_name: zfspool
zfs_dataset_name: zfspool/k8s
# The parent does not exist in the imported Talos-era pool. Create this isolated child without mounting or
# modifying the preserved legacy PVC datasets listed in the recovery record.
zfs_create_dataset: true

# Driver installation is opt-in after `ubuntu-drivers list --gpgpu` identifies the supported package.
nvidia_driver_package: ""

# Renovate updates this release and its Linux amd64 archive checksum together.
rke2_version: v1.37.0+rke2r1
rke2_tarball_sha256: 57eed94ca59e1245234ad1f97d84a29a31c0b02a59760af3b7d4338c40d5b513
rke2_cluster_cidrs:
  - 10.42.0.0/16
  - fd94:a259:ebb8:4200::/56
rke2_service_cidrs:
  - 10.43.0.0/16
  - fd94:a259:ebb8:4300::/112
rke2_tls_sans:
  - nas
  - k8s.home.finnes.dev
  - 172.21.71.10
  - 2a13:e745:1ee8:71::10
rke2_etcd_snapshot_schedule: "0 */6 * * *"
rke2_etcd_snapshot_retention: 28
rke2_etcd_s3_retention: 28
rke2_etcd_s3_enabled: true
rke2_etcd_s3_folder: rke2-etcd
