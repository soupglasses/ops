- name: Refuse unsupported RouterOS check mode
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
    fail_msg: community.routeros.command cannot predict changes; run this bootstrap without --check or
      --diff.

- name: Read the controller public key
  ansible.builtin.set_fact:
    routeros_bootstrap_public_key: >-
      {{ lookup('ansible.builtin.file', routeros_automation_public_key_file) | trim }}
  no_log: true

- name: Validate the controller public key
  ansible.builtin.assert:
    that:
      - routeros_bootstrap_public_key.split() | length >= 2
      - routeros_bootstrap_public_key.split()[0] in ['ssh-ed25519', 'ssh-rsa']
      - routeros_bootstrap_public_key.split()[1] | length >= 40
    fail_msg: routeros_automation_public_key_file must contain one OpenSSH Ed25519 or RSA public key.

- name: Validate the dedicated management boundary
  ansible.builtin.assert:
    that:
      - routeros_management_source_ipv4 is ansible.utils.ipv4
      - (routeros_management_source_ipv4 | ansible.utils.ipaddr('prefix') | int) == 32
      - routeros_controller_mac_address is match('^(?:[0-9A-F]{2}:){5}[0-9A-F]{2}$')
    fail_msg: Set routeros_management_source_ipv4 to the controller's stable IPv4 /32.

- name: Inspect the controller DHCP reservation
  community.routeros.command:
    commands:
      - >-
        /ip/dhcp-server/lease/print detail where mac-address="{{ routeros_controller_mac_address }}"
      - >-
        :put [/ip/dhcp-server/lease/get [find where mac-address="{{ routeros_controller_mac_address }}"]
        dynamic]
      - >-
        :put [/ip/dhcp-server/lease/get [find where mac-address="{{ routeros_controller_mac_address }}"]
        status]
      - >-
        :put [/ip/dhcp-server/lease/get [find where mac-address="{{ routeros_controller_mac_address }}"]
        address]
  register: routeros_bootstrap_controller_lease
  changed_when: false

- name: Require one active controller lease before reserving it
  ansible.builtin.assert:
    that:
      - routeros_bootstrap_controller_lease.stdout[0] | trim | length > 0
      - routeros_bootstrap_controller_lease.stdout_lines[1][-1] | trim in ['true', 'false']
      - routeros_bootstrap_controller_lease.stdout_lines[2][-1] | trim == 'bound'
      - >-
        routeros_bootstrap_controller_lease.stdout_lines[3][-1] | trim == (routeros_management_source_ipv4
        | ansible.utils.ipaddr('address'))
    fail_msg: >-
      Connect the controller through RouterOS DHCP and confirm its MAC before bootstrapping the address-restricted
      automation identity.

- name: Convert the controller lease to a static reservation
  community.routeros.command:
    commands:
      - >-
        /ip/dhcp-server/lease/make-static [find where mac-address="{{ routeros_controller_mac_address
        }}"]
  when: routeros_bootstrap_controller_lease.stdout_lines[1][-1] | trim == 'true'

- name: Converge the controller management reservation
  community.routeros.command:
    commands:
      - >-
        /ip/dhcp-server/lease/set [find where mac-address="{{ routeros_controller_mac_address }}"] address={{
        routeros_management_source_ipv4 | ansible.utils.ipaddr('address') }} comment="ansible:controller-management"
  changed_when: >-
    ('address=' ~ (routeros_management_source_ipv4 | ansible.utils.ipaddr('address'))) not in routeros_bootstrap_controller_lease.stdout[0]
    or 'comment="ansible:controller-management"' not in routeros_bootstrap_controller_lease.stdout[0]

- name: Re-read the controller management reservation
  community.routeros.command:
    commands:
      - >-
        :put [/ip/dhcp-server/lease/get [find where mac-address="{{ routeros_controller_mac_address }}"]
        dynamic]
      - >-
        :put [/ip/dhcp-server/lease/get [find where mac-address="{{ routeros_controller_mac_address }}"]
        status]
      - >-
        :put [/ip/dhcp-server/lease/get [find where mac-address="{{ routeros_controller_mac_address }}"]
        address]
  register: routeros_bootstrap_controller_lease_final
  changed_when: false

- name: Verify the bound static controller reservation
  ansible.builtin.assert:
    that:
      - routeros_bootstrap_controller_lease_final.stdout_lines[0][-1] | trim == 'false'
      - routeros_bootstrap_controller_lease_final.stdout_lines[1][-1] | trim == 'bound'
      - >-
        routeros_bootstrap_controller_lease_final.stdout_lines[2][-1] | trim == (routeros_management_source_ipv4
        | ansible.utils.ipaddr('address'))
    fail_msg: The controller DHCP reservation is not static, bound, and assigned to the expected address.

- name: Inspect the automation group
  community.routeros.command:
    commands:
      - /user/group/print detail where name="{{ routeros_automation_group }}"
  register: routeros_bootstrap_group_state
  changed_when: false

- name: Create the least-privilege automation group
  community.routeros.command:
    commands:
      - >-
        /user/group/add name="{{ routeros_automation_group }}" policy=ssh,read,write,test comment="ansible:cilium:automation-group"
  when: routeros_bootstrap_group_state.stdout[0] | trim == ""

- name: Converge the automation group policy
  community.routeros.command:
    commands:
      - >-
        /user/group/set [find where name="{{ routeros_automation_group }}"] policy=ssh,read,write,test
        comment="ansible:cilium:automation-group"
  changed_when: >-
    'policy=ssh,read,write,test' not in routeros_bootstrap_group_state.stdout[0] or 'comment="ansible:cilium:automation-group"'
    not in routeros_bootstrap_group_state.stdout[0]
  when: routeros_bootstrap_group_state.stdout[0] | trim != ""

- name: Inspect the automation user
  community.routeros.command:
    commands:
      - /user/print detail where name="{{ routeros_automation_user }}"
  register: routeros_bootstrap_user_state
  changed_when: false

- name: Create the automation user
  community.routeros.command:
    commands:
      - >-
        /user/add name="{{ routeros_automation_user }}" group="{{ routeros_automation_group }}" disabled=yes
        address={{ routeros_management_source_ipv4 }} password={{ routeros_bootstrap_one_time_password
        | community.routeros.quote_argument_value }} comment="ansible:cilium:automation-user"
  no_log: true
  when: routeros_bootstrap_user_state.stdout[0] | trim == ""
  vars:
    routeros_bootstrap_one_time_password: >-
      {{ lookup('community.general.random_string', length=64, special=false) }}

- name: Keep the automation user disabled until its key is installed
  community.routeros.command:
    commands:
      - >-
        /user/set [find where name="{{ routeros_automation_user }}"] group="{{ routeros_automation_group
        }}" address={{ routeros_management_source_ipv4 }} disabled=yes comment="ansible:cilium:automation-user"
  changed_when: >-
    ('group=' ~ routeros_automation_group) not in routeros_bootstrap_user_state.stdout[0] or 'disabled=no'
    in routeros_bootstrap_user_state.stdout[0] or ('address=' ~ routeros_management_source_ipv4) not in
    routeros_bootstrap_user_state.stdout[0] or 'comment="ansible:cilium:automation-user"' not in routeros_bootstrap_user_state.stdout[0]
  when: routeros_bootstrap_user_state.stdout[0] | trim != ""

- name: Inspect the controller SSH key
  community.routeros.command:
    commands:
      - >-
        :put [:len [/user/ssh-keys/find where user="{{ routeros_automation_user }}" info="{{ routeros_automation_key_owner
        }}"]]
  register: routeros_bootstrap_key_state
  changed_when: false

- name: Import the controller SSH public key
  when: routeros_bootstrap_key_state.stdout_lines[0][-1] | trim == '0'
  block:
    - name: Upload the controller SSH public key
      ansible.netcommon.net_put:
        src: "{{ routeros_automation_public_key_file }}"
        dest: "{{ routeros_automation_key_owner }}.pub"
        mode: binary
        protocol: sftp

    - name: Import the uploaded controller SSH public key
      community.routeros.command:
        commands:
          - >-
            /user/ssh-keys/import public-key-file="{{ routeros_automation_key_owner }}.pub" user="{{ routeros_automation_user
            }}"
  always:
    - name: Remove the uploaded public-key file
      community.routeros.command:
        commands:
          - /file/remove [find where name="{{ routeros_automation_key_owner }}.pub"]
      changed_when: true

- name: Re-read the controller SSH key count
  community.routeros.command:
    commands:
      - >-
        :put [:len [/user/ssh-keys/find where user="{{ routeros_automation_user }}" info="{{ routeros_automation_key_owner
        }}"]]
  register: routeros_bootstrap_key_state_final
  changed_when: false

- name: Require exactly one controller SSH key before enabling automation
  ansible.builtin.assert:
    that:
      - routeros_bootstrap_key_state_final.stdout_lines[0][-1] | trim == '1'
    fail_msg: Keep the RouterOS automation user disabled until exactly one managed SSH key is installed.

- name: Enable the keyed automation user
  community.routeros.command:
    commands:
      - >-
        /user/set [find where name="{{ routeros_automation_user }}"] group="{{ routeros_automation_group
        }}" address={{ routeros_management_source_ipv4 }} disabled=no comment="ansible:cilium:automation-user"

- name: Validate an explicitly retired key owner
  ansible.builtin.assert:
    that:
      - routeros_automation_retire_key_owner != routeros_automation_key_owner
    fail_msg: The active controller key cannot be retired in the same run.
  when: routeros_automation_retire_key_owner | length > 0

- name: Retire the old controller key after replacement validation
  community.routeros.command:
    commands:
      - >-
        /user/ssh-keys/remove [find where user="{{ routeros_automation_user }}" info="{{ routeros_automation_retire_key_owner
        }}"]
  when: routeros_automation_retire_key_owner | length > 0
