version: "3"
tasks:
  test:
    desc: Run an application's acceptance check (NAMESPACE and APP, or RELEASE)
    requires:
      vars: [NAMESPACE]
    cmds:
      - |
        python3 scripts/application-test.py --namespace {{.NAMESPACE | shellQuote}} \
          {{if .RELEASE}}--release {{.RELEASE | shellQuote}}{{else}}--deployment {{.APP | shellQuote}}{{end}}

  verify-render:
    desc: Verify Jellyfin recovery and private-route invariants in the final Flux render
    vars:
      RENDER:
        sh: mktemp
    cmds:
      - defer: rm -f {{.RENDER | shellQuote}}
      - task flate:build > {{.RENDER | shellQuote}}
      - python3 scripts/verify-jellyfin-render.py {{.RENDER | shellQuote}}
