name: Jellyfin provider
on:
  pull_request:
    paths:
      - "scripts/verify-jellyfin-composition.py"
      - "kubernetes/apps/crossplane-system/crossplane/providers/jellyfin/**"
      - "kubernetes/apps/media/jellyfin/app/*.yaml"
      - ".github/workflows/jellyfin-provider.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/verify-jellyfin-composition.py"
      - "kubernetes/apps/crossplane-system/crossplane/providers/jellyfin/**"
      - "kubernetes/apps/media/jellyfin/app/*.yaml"
      - ".github/workflows/jellyfin-provider.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jellyfin-provider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Crossplane CLI
        run: |
          curl -fsSL https://cli.crossplane.io/stable/v2.5.0/bin/linux_amd64/crossplane -o /tmp/crossplane
          echo '065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e  /tmp/crossplane' | sha256sum --check
          sudo install /tmp/crossplane /usr/local/bin/crossplane
      - name: Install Helm and kubectl
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.19
          install_args: aqua:helm aqua:kubernetes/kubectl aqua:mikefarah/yq
      - name: Render plugin settings with synthetic credentials
        run: python3 scripts/verify-jellyfin-composition.py
