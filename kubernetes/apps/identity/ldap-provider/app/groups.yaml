apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: groupofnames.identity.ops.finnes.dev
spec:
  scope: Namespaced
  group: identity.ops.finnes.dev
  names:
    kind: GroupOfNames
    plural: groupofnames
  defaultCompositionRef:
    name: groupofnames-ldap
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cn
              properties:
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                backendRef:
                  type: object
                  default:
                    kind: ClusterProviderConfig
                    name: directory
                  required:
                    - name
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: A backend change requires deliberate replacement and adoption.
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ClusterProviderConfig
                cn:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                description:
                  type: string
                baseDN:
                  type: string
                  minLength: 1
                  default: ou=groups,dc=finnes,dc=dev
                sentinelDN:
                  type: string
                  minLength: 1
                  default: uid=group-placeholder,ou=users,dc=finnes,dc=dev
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: groupofnames-ldap
spec:
  compositeTypeRef:
    apiVersion: identity.ops.finnes.dev/v1alpha1
    kind: GroupOfNames
  mode: Pipeline
  pipeline:
    - step: render-group
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{/* SPDX-FileCopyrightText: 2026 Sofie Finnes <sofie+git@finnes.dev>
            SPDX-License-Identifier: MIT */}}
            {{- $xr := getCompositeResource . -}}
            {{- $spec := $xr.spec -}}
            {{- $name := printf "group-%s" $xr.metadata.uid -}}
            {{- $entry := getComposedResource . "ldap-entry" -}}
            {{- $attributes := dict "cn" (list $spec.cn) -}}
            {{- if hasKey $spec "description" -}}
            {{- $_ := set $attributes "description" (ternary (list $spec.description) (list) (ne $spec.description "")) -}}
            {{- end }}
            apiVersion: ldap.finnes.dev/v1alpha1
            kind: Entry
            metadata:
              name: {{ $name }}
              namespace: {{ $xr.metadata.namespace }}
              labels:
                identity.ops.finnes.dev/group-uid: {{ $xr.metadata.uid | quote }}
              annotations:
                {{ setResourceNameAnnotation "ldap-entry" }}
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" (not (empty (and $entry (eq (getResourceCondition "Ready" $entry).Status "True") (eq (getResourceCondition "Synced" $entry).Status "True") (eq (toString (dig "status" "atProvider" "observedGeneration" 0 $entry)) (toString $entry.metadata.generation)) (deepEqual $entry.spec.forProvider (dict "dn" (printf "cn=%s,%s" $spec.cn $spec.baseDN) "attributes" $attributes "sharedAttributes" (dict "objectClass" (list "groupOfNames") "member" (list $spec.sentinelDN))))))) | quote }}
            spec:
              managementPolicies: {{ ternary "[Observe, Create, Update]" "[Observe, Create, Update, Delete]" (eq ($spec.deletionPolicy | default "Delete") "Orphan") }}
              providerConfigRef:
                kind: {{ $spec.backendRef.kind | default "ClusterProviderConfig" }}
                name: {{ $spec.backendRef.name | quote }}
              forProvider:
                dn: {{ printf "cn=%s,%s" $spec.cn $spec.baseDN | quote }}
                attributes:
                  {{- $attributes | toYaml | nindent 18 }}
                sharedAttributes:
                  objectClass: [groupOfNames]
                  member: [{{ $spec.sentinelDN | quote }}]
