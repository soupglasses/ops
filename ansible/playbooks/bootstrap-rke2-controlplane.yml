- name: Bootstrap a clean control plane and hand applications to Flux
  hosts: rke2_servers
  become: true
  gather_facts: false
  pre_tasks:

    # Raw avoids uploading modules or gathering facts on an existing cluster.
    # Transitional services are also left alone: bootstrap must not race startup
    # or shutdown and accidentally treat live storage as abandoned.
    - name: Inspect RKE2 service state without changing the node
      ansible.builtin.raw: >-
        systemctl show --property=ActiveState --value rke2-server.service rke2-agent.service
      register: bootstrap_service_state
      changed_when: false
      failed_when: bootstrap_service_state.rc != 0 or bootstrap_service_state.stdout.split() | length
        != 2
      check_mode: false
      tags: [always]

    - name: Leave an existing or transitioning RKE2 cluster untouched
      ansible.builtin.meta: end_host
      when: bootstrap_service_state.stdout.split() | difference(['inactive', 'failed']) | length > 0
      tags: [always]

    - name: Gather facts only for a stopped cluster
      ansible.builtin.setup:

    - name: Require a supported host without obsolete restore options
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('26.04', '>=')
          - lookup('env', 'RKE2_RESTORE_SNAPSHOT') == ''
          - lookup('env', 'RKE2_BOOTSTRAP_MODE') == ''
          - rke2_restore_snapshot is not defined
        fail_msg: Use a supported Ubuntu host. Bootstrap always rebuilds cleanly; remove obsolete etcd
          restore options.

    - name: Inspect existing control-plane state before changing the host
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/server
      register: bootstrap_existing_server

    - name: Require an empty RKE2 server state directory
      ansible.builtin.assert:
        that:
          - not bootstrap_existing_server.stat.exists
        fail_msg: "Stopped RKE2 server state still exists. Complete rke2:uninstall before bootstrap; bootstrap
          never deletes or adopts existing server state."

    - name: Load recovery credentials only when creating a new cluster
      community.sops.load_vars:
        file: "{{ inventory_dir }}/group_vars/all/secrets.sops.yaml"
        expressions: ignore
      no_log: true
      diff: false

    - name: Clear abandoned OpenEBS volumes before creating a new cluster
      ansible.builtin.include_tasks: tasks/bootstrap-storage.yml

    - name: Remove a previous cluster's uninstall journal only after the clean-host checks
      ansible.builtin.file:
        path: /var/lib/rke2-uninstall
        state: absent

  roles:
    - rke2

  post_tasks:

    - name: Bootstrap Flux from the committed configuration
      ansible.builtin.import_tasks: tasks/bootstrap-flux.yml
