# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ${APP}-backup-maintenance
  labels:
    monitoring.finnes.dev/enabled: "true"
spec:
  groups:
    - name: ${APP}.backup-maintenance
      rules:
        - alert: VolSyncMaintenanceJobFailed
          expr: |
            (
              label_replace(
                (kube_job_failed{condition="true",job_name=~"${APP}-(backup-check|restore-refresh)-[0-9]+"} == 1)
                * on(namespace, job_name) group_left() kube_job_status_start_time,
                "cronjob", "$1", "job_name", "(.*)-[0-9]+"
              )
              > on(namespace, cronjob) group_left()
                kube_cronjob_status_last_successful_time{cronjob=~"${APP}-(backup-check|restore-refresh)"}
            )
            or
            (
              label_replace(
                (kube_job_failed{condition="true",job_name=~"${APP}-(backup-check|restore-refresh)-[0-9]+"} == 1)
                * on(namespace, job_name) group_left() kube_job_status_start_time,
                "cronjob", "$1", "job_name", "(.*)-[0-9]+"
              )
              unless on(namespace, cronjob)
                kube_cronjob_status_last_successful_time{cronjob=~"${APP}-(backup-check|restore-refresh)"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Backup maintenance failed for {{ $labels.namespace }}/{{ $labels.cronjob }}"
            description: Inspect the failed Job and any recovery lock. Integrity failures do not prove
              a usable backup; preserve history and validate a restore before pruning or resuming maintenance.
            runbook_url: https://github.com/soupglasses/ops/blob/main/kubernetes/components/volsync/README.md
