apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./entries.yaml
  - ./groups.yaml
  - ../app/secret.sops.yaml
patches:
  - target:
      kind: Secret
    patch: |-
      - op: add
        path: /metadata/namespace
        value: media
