apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-collector
  namespace: log-collection
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
