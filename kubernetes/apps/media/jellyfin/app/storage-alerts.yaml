apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jellyfin-storage
  labels:
    monitoring.finnes.dev/enabled: "true"
spec:
  groups:
    - name: jellyfin.storage
      rules:
        - alert: JellyfinConfigurationCapacityLow
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="media",persistentvolumeclaim="jellyfin"} / kubelet_volume_stats_capacity_bytes{namespace="media",persistentvolumeclaim="jellyfin"}
            > 0.8
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Jellyfin configuration volume is nearly full
            description: >-
              Expand the Jellyfin configuration volume before it fills and database writes fail.
