name: Identity runtime
on:
  pull_request:
    paths: ["packages/**", "charts/ldap-provider/**", ".github/workflows/identity-runtime.yaml"]
  push:
    branches: [main]
    paths: ["packages/**", "charts/ldap-provider/**", ".github/workflows/identity-runtime.yaml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identity-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jellyfin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test runtime and settings reconciliation
        run: |
          python3 -m unittest discover -s packages/jellyfin-runtime/tests -v
          python3 -m unittest discover -s packages/jellyfin-runtime -p test_configuration.py -v
      - name: Build pinned Jellyfin and plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: packages/jellyfin-runtime/build.sh ghcr.io/soupglasses/ops/jellyfin-runtime:${{ github.sha
          }}
      - name: Test LDAP password and SSO-first profile images
        env:
          JELLYFIN_INTEGRATION_IMAGE: ghcr.io/soupglasses/ops/jellyfin-runtime:${{ github.sha }}
        run: |
          echo 'slapd slapd/no_configuration boolean true' | sudo debconf-set-selections
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y slapd ldap-utils
          python3 -m unittest discover -s packages/jellyfin-runtime/tests -p test_identity_integration.py -v
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/soupglasses/ops/jellyfin-runtime:${{ github.sha }}
  ldap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Helm and kubectl
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.9
          install_args: aqua:helm aqua:kubernetes/kubectl
      - name: Install pinned kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.33.0 --repo kubernetes-sigs/kind --pattern kind-linux-amd64 --dir /tmp
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind-linux-amd64' | sha256sum --check
          sudo install /tmp/kind-linux-amd64 /usr/local/bin/kind
      - name: Build controller and integration fixtures
        run: |
          docker build --target runtime -t ghcr.io/soupglasses/ops/provider-ldap:${{ github.sha }} packages/provider-ldap
          docker build --target tests -t ghcr.io/soupglasses/ops/provider-ldap-tests:${{ github.sha }} packages/provider-ldap
      - name: Verify generated CRDs are reproducible
        run: |
          docker build --target generated --output type=local,dest=/tmp/ldap-generated packages/provider-ldap
          diff -r charts/ldap-provider/crds /tmp/ldap-generated/generated/crds
      - name: Test real LDAP and Canaille
        run: docker run --rm ghcr.io/soupglasses/ops/provider-ldap-tests:${{ github.sha }} -test.v -test.run
          'TestCanaille|TestHuman'
      - name: Test the real Crossplane composition through Helm
        env:
          PROVIDER_IMAGE: ghcr.io/soupglasses/ops/provider-ldap:${{ github.sha }}
          TESTS_IMAGE: ghcr.io/soupglasses/ops/provider-ldap-tests:${{ github.sha }}
        run: packages/provider-ldap/kind-test.sh
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/soupglasses/ops/provider-ldap:${{ github.sha }}
          docker push ghcr.io/soupglasses/ops/provider-ldap-tests:${{ github.sha }}
