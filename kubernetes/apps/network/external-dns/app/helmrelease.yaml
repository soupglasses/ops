# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    policy: upsert-only
    sources:
      - ingress
      - service
    domainFilters:
      - ${DOMAIN}
    extraArgs:
      - --zone-id-filter=cec77e1bff57b978e3abdcd8e6b76b3e
    txtPrefix: "k8s-${CLUSTER_NAME}."
    txtOwnerId: default
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    image:
      pullPolicy: Always
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
        ephemeral-storage: 100Mi
      limits:
        memory: 100Mi
        ephemeral-storage: 200Mi
    serviceMonitor:
      enabled: true
