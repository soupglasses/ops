# Plugins are pinned by their Plugin resources, so Jellyfin must not update them.
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: ScheduledTask
metadata:
  name: jellyfin-plugin-updates
  annotations:
    crossplane.io/external-name: PluginUpdates
spec:
  forProvider:
    triggers: []
