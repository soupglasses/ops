# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  ansible:
    taskfile: ansible/Taskfile.yaml
    dir: ansible
  talos:
    taskfile: .taskfiles/talos.yaml
    dir: .
  flux:
    taskfile: .taskfiles/flux.yaml
    dir: .
  flate:
    taskfile: .taskfiles/flate.yaml
    dir: .
  kube:
    taskfile: .taskfiles/kubernetes.yaml
    dir: .
  license:
    taskfile: .taskfiles/license.yaml
    dir: .
  volsync:
    taskfile: .taskfiles/volsync.yaml
    dir: .

tasks:
  rke2:bootstrap:
    dir: ansible
    desc: Bootstrap RKE2 on a prepared host; prompt to erase old OpenEBS volumes (running cluster is unchanged)
    interactive: true
    env:
      # Running clusters exit before the playbook explicitly loads recovery credentials.
      ANSIBLE_VARS_ENABLED: host_group_vars
    preconditions:
      - sh: test -z {{.RESTORE | default "" | shellQuote}} && test -z {{.SNAPSHOT | default "" | shellQuote}}
          && test -z {{.MODE | default "" | shellQuote}}
        msg: Bootstrap always rebuilds cleanly. Etcd restore selectors are no longer supported.
    cmds:
      - ansible-playbook playbooks/bootstrap-rke2-controlplane.yml {{.CLI_ARGS}}

  check:
    desc: Run all configured pre-commit checks on tracked files
    cmd: pre-commit run --all-files --hook-stage pre-commit {{.CLI_ARGS}}

  rke2:uninstall:
    dir: ansible
    desc: Finish and hold backups, then run RKE2's uninstaller on a node [NODE=required]
    requires:
      vars: [NODE]
    env:
      ANSIBLE_VARS_ENABLED: host_group_vars
    cmds:
      - ansible-playbook playbooks/uninstall-rke2.yml -e {{printf "rke2_uninstall_node=%s" .NODE | shellQuote}}
        {{.CLI_ARGS}}

  schemas:update:
    desc: Align Kubernetes editor schema comments with the RKE2 inventory
    cmd: python3 scripts/kubernetes-schema-headers.py --write

  hermes:deploy-keys:
    desc: Install or renew Kubernetes credentials in an existing Hermes container
    silent: true
    requires:
      vars: [HOST]
    cmd: python3 scripts/hermes-kubeconfig.py --host {{.HOST | shellQuote}} {{.CLI_ARGS}}
