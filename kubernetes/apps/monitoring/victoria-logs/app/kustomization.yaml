# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ./grafana-datasource.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
components:
  - ../../../../components/volsync

configMapGenerator:
  - name: vector-k8s-monitoring-dashboard
    files:
      - vector-k8s-monitoring-custom.json=vector-k8s-monitoring.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
