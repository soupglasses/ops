# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  ansible:
    taskfile: ansible/Taskfile.yaml
    dir: ansible
  talos:
    taskfile: .taskfiles/talos.yaml
    dir: .
  flux:
    taskfile: .taskfiles/flux.yaml
    dir: .
  flate:
    taskfile: .taskfiles/flate.yaml
    dir: .
  kube:
    taskfile: .taskfiles/kubernetes.yaml
    dir: .
  license:
    taskfile: .taskfiles/license.yaml
    dir: .
  volsync:
    taskfile: .taskfiles/volsync.yaml
    dir: .

tasks:
  rke2:bootstrap:
    dir: ansible
    desc: Bootstrap a replacement host, optionally restore encrypted etcd, then start Flux
    env:
      ANSIBLE_VARS_ENABLED: host_group_vars,community.sops.sops
      RKE2_RESTORE_SNAPSHOT: '{{.RESTORE | default ""}}'
    cmds:
      - ansible-playbook playbooks/bootstrap-rke2-controlplane.yml {{.CLI_ARGS}}

  check:
    desc: Run all configured pre-commit checks on tracked files
    cmd: pre-commit run --all-files --hook-stage pre-commit {{.CLI_ARGS}}

  schemas:update:
    desc: Align Kubernetes editor schema comments with the RKE2 inventory
    cmd: python3 scripts/kubernetes-schema-headers.py --write

  hermes:deploy-keys:
    desc: Install or renew Kubernetes credentials in an existing Hermes container
    silent: true
    requires:
      vars: [HOST]
    cmd: python3 scripts/hermes-kubeconfig.py --host {{.HOST | shellQuote}} {{.CLI_ARGS}}
