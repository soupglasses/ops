# Resolve through Flux substituteFrom; never render credentials on an operator host.
apiVersion: v1
kind: Secret
metadata:
  name: volsync-openldap-v2
stringData:
  RESTIC_REPOSITORY: ${SECRET_S3_ENDPOINT}/volsync-openldap-v2
  RESTIC_PASSWORD: ${SECRET_PASSWORD}
  AWS_ACCESS_KEY_ID: ${SECRET_AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${SECRET_AWS_SECRET_ACCESS_KEY}
