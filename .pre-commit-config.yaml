default_install_hook_types: [pre-commit]
repos:
- repo: local
  hooks:
  - id: alejandra
    name: alejandra
    entry: alejandra
    language: system
    files: \.nix$
    stages: [pre-commit]
  - id: editorconfig-checker
    name: editorconfig-checker
    entry: editorconfig-checker
    language: system
    stages: [pre-commit]
