# Admin bind for the tofu runner. The key name matches the module's
# ldap_bind_password variable (varsFrom maps keys to variables by name).
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-ldap-admin
stringData:
  ldap_bind_password: ${SECRET_LDAP_ADMIN_PASSWORD}
