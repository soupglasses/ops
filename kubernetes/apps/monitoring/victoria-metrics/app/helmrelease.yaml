apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 30m
  valuesFrom:
    - kind: Secret
      name: alertmanager-smtp
      valuesKey: values.yaml
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.95.2
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    victoria-metrics-operator:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      crds:
        cleanup:
          # Never let removing this release delete unrelated VM custom resources.
          enabled: false

    vmsingle:
      enabled: true
      spec:
        image:
          repository: victoriametrics/victoria-metrics
          tag: v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
        managedMetadata:
          labels:
            monitoring.finnes.dev/enabled: "true"
        retentionPeriod: 1y
        # The shared VolSync component owns the PVC and restores it before binding.
        storage: null
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: victoria-metrics
        initContainers:
          - name: require-restored-metrics
            image: victoriametrics/victoria-metrics:v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
            command: [/bin/sh, -ec]
            args:
              - test -d /data/data && test -d /data/metadata
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: data
                mountPath: /data
                readOnly: true
        extraArgs:
          storage.minFreeDiskSpaceBytes: 5GB
        useStrictSecurity: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    vmagent:
      enabled: true
      spec:
        managedMetadata:
          labels:
            monitoring.finnes.dev/enabled: "true"
        selectAllByDefault: false
        serviceScrapeNamespaceSelector: {}
        serviceScrapeSelector:
          matchLabels:
            monitoring.finnes.dev/enabled: "true"
        nodeScrapeSelector:
          matchLabels:
            monitoring.finnes.dev/enabled: "true"
        scrapeInterval: 1m
        useStrictSecurity: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi

    vmalert:
      enabled: true
      spec:
        managedMetadata:
          labels:
            monitoring.finnes.dev/enabled: "true"
        selectAllByDefault: false
        ruleNamespaceSelector: {}
        evaluationInterval: 1m
        ruleSelector:
          matchLabels:
            monitoring.finnes.dev/enabled: "true"
        useStrictSecurity: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    alertmanager:
      enabled: true
      # Leave room for the operator's prefix and StatefulSet revision suffix.
      name: victoria-metrics
      # Raw configuration allows sensitive global SMTP authentication values to
      # arrive through Helm valuesFrom without putting them in a rendered CR.
      useManagedConfig: false
      spec:
        selectAllByDefault: false
        useStrictSecurity: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      config:
        global:
          smtp_from: alertmanager@noreply.finnes.dev
          smtp_require_tls: true
          smtp_smarthost: prod-mta-06.swg-srv.net:2525
        route:
          receiver: monitoring-email
          group_by:
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
        receivers:
          - name: monitoring-email
            email_configs:
              - send_resolved: true
                to: alerts+ops@finnes.dev
      monzoTemplate:
        enabled: false

    # Keep scrape selection explicit as exporters are added.
    defaultDashboards:
      enabled: false
    syncJob:
      enabled: false
    defaultRules:
      enabled: false
    grafana:
      enabled: true
      image:
        registry: ghcr.io
        repository: soupglasses/grafana
        tag: 13.2.4-oidc.1
        sha: c8728c56838cb34441455ae4912806be1a19a4c81db82ab1df9aeb8a383f6bb9
      rbac:
        create: true
        namespaced: true
        # The chart still generates the namespace-local binding, but its
        # built-in Role always includes Secrets. Bind our ConfigMap-only Role.
        useExistingRole: victoria-metrics-grafana-configmaps
      admin:
        existingSecret: grafana-auth
        userKey: admin-user
        passwordKey: admin-password
      extraSecretMounts:
        - name: grafana-oidc
          secretName: grafana-oidc
          mountPath: /etc/secrets/grafana-oidc
          readOnly: true
          defaultMode: 0440
      defaultDashboardsTimezone: browser
      plugins:
        - victoriametrics-logs-datasource@0.32.0
      ingress:
        enabled: false
      persistence:
        # Dashboards and datasources are provisioned from Git. Keeping Grafana
        # stateless makes clean recovery deterministic and avoids backing up an
        # otherwise authoritative SQLite database.
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          resource: configmap
          searchNamespace: monitoring
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
          resource: configmap
          searchNamespace: monitoring
      grafana.ini:
        analytics:
          check_for_updates: false
          reporting_enabled: false
        auth:
          oauth_allow_insecure_email_lookup: false
        auth.generic_oauth:
          enabled: true
          name: Canaille
          allow_sign_up: true
          auto_login: false
          client_id: monitoring.grafana
          client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
          auth_style: InParams
          scopes: openid profile email groups
          auth_url: https://auth.${DOMAIN}/oauth/authorize
          token_url: https://auth.${DOMAIN}/oauth/token
          api_url: https://auth.${DOMAIN}/oauth/userinfo
          use_pkce: true
          validate_id_token: true
          jwk_set_url: https://auth.${DOMAIN}/oauth/jwks.json
          use_refresh_token: true
          login_attribute_path: sub
          email_attribute_path: email
          name_attribute_path: name
          groups_attribute_path: groups
          allowed_groups: monitoring.grafana-admins
          role_attribute_path: >-
            contains(groups || `[]`, 'monitoring.grafana-admins') && 'GrafanaAdmin' || ''
          role_attribute_strict: true
          allow_assign_grafana_admin: true
          skip_org_role_sync: false
        auth.anonymous:
          enabled: false
        security:
          cookie_secure: true
          disable_gravatar: true
          strict_transport_security: true
          strict_transport_security_max_age_seconds: 31536000
        server:
          domain: grafana.${DOMAIN}
          root_url: https://grafana.${DOMAIN}
        users:
          allow_sign_up: false
      assertNoLeakedSecrets: true
    defaultDatasources:
      victoriametrics:
        # Use the Prometheus-compatible API built into Grafana. The optional
        # VictoriaMetrics plugin is unnecessary for the initial deployment.
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            jsonData:
              manageAlerts: true
            isDefault: true
            editable: false
    prometheus-node-exporter:
      enabled: false
    kube-state-metrics:
      enabled: true
      collectors:
        - nodes
        - pods
        - persistentvolumeclaims
      metricLabelsAllowlist:
        - pods=[app.kubernetes.io/name,app,k8s-app,component]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      vmScrape:
        labels:
          monitoring.finnes.dev/enabled: "true"
      rbac:
        extraRules:
          - apiGroups: [volsync.backube]
            resources: [replicationsources]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: volsync.backube
                  version: v1alpha1
                  kind: ReplicationSource
                metricNamePrefix: volsync
                labelsFromPath:
                  namespace: [metadata, namespace]
                  source: [metadata, name]
                  persistentvolumeclaim: [spec, sourcePVC]
                metrics:
                  - name: source_info
                    help: Configured VolSync backup source and its PVC.
                    each:
                      type: Info
                      info:
                        path: [metadata]
                        labelsFromPath:
                          source: [name]
                  - name: source_last_sync_time_seconds
                    help: Timestamp of the last successful VolSync synchronization.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastSyncTime]
    kubelet:
      enabled: true
      vmScrape:
        labels:
          monitoring.finnes.dev/enabled: "true"
        spec:
          tlsConfig:
            insecureSkipVerify: false
      vmScrapes:
        probes:
          enabled: false
        resources:
          enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    coreDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
