apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: groupofnames.ops.finnes.dev
spec:
  scope: Namespaced
  group: ops.finnes.dev
  names:
    kind: GroupOfNames
    plural: groupofnames
  defaultCompositionRef:
    name: groupofnames-ldap
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cn
              properties:
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                backendRef:
                  type: object
                  default:
                    kind: ClusterProviderConfig
                    name: directory
                  required:
                    - name
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: A backend change requires deliberate replacement and adoption.
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ClusterProviderConfig
                cn:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                description:
                  type: string
                baseDN:
                  type: string
                  minLength: 1
                  default: ou=groups,dc=finnes,dc=dev
                sentinelDN:
                  type: string
                  minLength: 1
                  default: uid=group-placeholder,ou=users,dc=finnes,dc=dev
---
