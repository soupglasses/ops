apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: log-collector
  namespace: monitoring
spec:
  path: ./kubernetes/apps/monitoring/log-collector/app
  dependsOn:
    - name: prometheus-operator-crds
      namespace: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
