# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.13.10
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # The repository dashboard displays event rates as e/s.
          - target:
              kind: ConfigMap
              name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
            patch: |-
              - op: remove
                path: /metadata/labels/grafana_dashboard
  values:
    printNotes: false
    serviceAccount:
      create: true
      automountToken: false

    server:
      image:
        repository: victoriametrics/victoria-logs
        tag: v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
      retentionPeriod: 1y
      initContainers:
        - name: require-restored-logs
          # The server is distroless; the restore guard needs a separate shell image.
          image: docker.io/library/alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: [/bin/sh, -ec]
          args:
            - test -d /storage/partitions && test -n "$(ls -A /storage/partitions)"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: server-volume
              mountPath: /storage
              readOnly: true
      # Alert and expand the ZFS volume rather than delete history under pressure.
      retentionDiskSpaceUsage: ""
      extraArgs:
        envflag.enable: true
        envflag.prefix: VM_
        loggerFormat: json
        httpListenAddr: :9428
        http.shutdownDelay: 15s
        snapshotsMaxAge: 1d
        storage.minFreeDiskSpaceBytes: 5GB
      persistentVolume:
        enabled: true
        existingClaim: victoria-logs
        mountPath: /storage
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      ingress:
        enabled: false
      service:
        type: ClusterIP
      vmServiceScrape:
        enabled: true
        extraLabels:
          app.kubernetes.io/name: victoria-logs
          monitoring.finnes.dev/enabled: "true"
        interval: 1m
        scrapeTimeout: 10s

    vector:
      enabled: false

    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
