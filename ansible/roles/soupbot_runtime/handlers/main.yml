- name: Restart soupbot broker
  ansible.builtin.systemd_service:
    name: soupbot-github-agent.service
    state: restarted
    daemon_reload: true
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Create the shared socket alias
  ansible.builtin.command:
    argv: [systemd-tmpfiles, --create, /etc/tmpfiles.d/soupbot.conf]
  changed_when: true
