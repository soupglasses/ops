apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP}-volsync-quiesce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP}-volsync-quiesce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP}-volsync-quiesce
    spec:
      serviceAccountName: ${APP}-volsync-quiesce
      containers:
        - name: watcher
          image: docker.io/bitnami/kubectl:latest
          env:
            - name: NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PVC
              value: ${APP}
            - name: TARGET_SELECTOR
              value: ${VOLSYNC_QUIESCE_TARGET_SELECTOR}
            - name: TARGET_CONTAINER
              value: ${VOLSYNC_QUIESCE_TARGET_CONTAINER:=}
            - name: QUIESCE_CMD
              value: ${VOLSYNC_QUIESCE_CMD}
            - name: RESUME_CMD
              value: ${VOLSYNC_RESUME_CMD}
          command: [/bin/bash, -c]
          args:
            - |
              set -u
              status() {
                kubectl get -n "$NS" pvc/"$PVC" \
                  -o 'jsonpath={.metadata.annotations.volsync\.backube/latest-copy-status}' 2>/dev/null
              }
              target_pod() {
                kubectl get -n "$NS" pod -l "$TARGET_SELECTOR" \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null
              }
              c_flag() { [ -n "$TARGET_CONTAINER" ] && printf -- '-c\n%s' "$TARGET_CONTAINER"; }

              echo "Watching pvc/$PVC in ns/$NS for WaitingForTrigger..."
              while true; do
                until [ "$(status)" = "WaitingForTrigger" ]; do sleep 5; done

                pod=$(target_pod)
                if [ -z "$pod" ] || ! kubectl wait -n "$NS" --for=condition=Ready \
                  "pod/$pod" --timeout=10s >/dev/null 2>&1; then
                  echo "ERROR: application unavailable; withholding backup trigger"
                  sleep 30
                  continue
                fi
                echo "Preparing backup in pod/$pod"
                if ! kubectl exec -n "$NS" "$pod" $(c_flag) -- bash -c "$QUIESCE_CMD"; then
                  echo "ERROR: backup preparation failed; withholding backup trigger"
                  # A failed flush can leave Minecraft's automatic saving disabled.
                  kubectl exec -n "$NS" "$pod" $(c_flag) -- bash -c "$RESUME_CMD" \
                    || echo "ERROR: resume failed; operator intervention required"
                  sleep 30
                  continue
                fi

                tr="trigger-$(date +%s)"
                echo "Releasing snapshot ($tr)"
                kubectl annotate -n "$NS" pvc/"$PVC" --overwrite \
                  "volsync.backube/copy-trigger=$tr" >/dev/null

                # Wait for backup to finish (Completed) or fail (Error).
                # Cap at 30min so a stuck mover doesn't keep the app quiesced forever.
                for _ in $(seq 1 360); do
                  case "$(status)" in
                    Completed|Error) break ;;
                  esac
                  sleep 5
                done

                if [ -n "$pod" ]; then
                  echo "Resuming in pod/$pod (final status=$(status))"
                  kubectl exec -n "$NS" "$pod" $(c_flag) -- bash -c "$RESUME_CMD" \
                    || echo "WARN: resume returned non-zero"
                fi

                # Debounce so we don't immediately re-detect the same cycle
                sleep 30
              done
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
