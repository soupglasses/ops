# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./alertmanager-smtp.sops.yaml
  - ./grafana-auth.sops.yaml
  - ./grafana-dashboard.yaml
  - ./grafana-rbac.yaml
  - ./helmrelease.yaml
  - ./storage-alerts.yaml
components:
  - ../../../../components/volsync
patches:
  # Enable after migrating the existing metrics and proving the first restore.
  - target:
      kind: ReplicationSource
    patch: |-
      - op: add
        path: /spec/paused
        value: true
