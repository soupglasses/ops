# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rke2-host-metrics
  labels:
    monitoring.finnes.dev/enabled: "true"
spec:
  serviceDiscoveryRole: EndpointSlice
  endpoints:
    - interval: 1m
      port: metrics
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: rke2-host-metrics
