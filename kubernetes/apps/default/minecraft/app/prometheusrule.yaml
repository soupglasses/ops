# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minecraft-backup
spec:
  groups:
    - name: minecraft.backup.rules
      rules:
        - alert: MinecraftBackupContainerCrashLoop
          annotations:
            summary: "Minecraft backup container is crash-looping"
            description: >-
              The mc-backup container in pod {{ $labels.pod }} has restarted {{ $value }} times in the
              last hour. This indicates backup failures (not skipped backups due to no players).
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="default",
              container="mc-backup"
            }[1h]) > 0
          for: 6h
          labels:
            severity: warning
            app: minecraft
