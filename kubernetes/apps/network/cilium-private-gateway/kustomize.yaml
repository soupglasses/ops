apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-private-gateway
  namespace: network
spec:
  dependsOn:
    - name: cilium-gateway-api-crds
      namespace: network
    - name: cloudflare-issuers
      namespace: cert-manager
  path: ./kubernetes/apps/network/cilium-private-gateway/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  prune: true
  wait: true
  timeout: 5m
