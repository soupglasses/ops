# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  interval: 1h
  chart:
    spec:
      chart: minecraft
      version: 5.1.2
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    resources:
      requests:
        memory: 1024M
        cpu: 1000m
    extraEnv:
      USER_API_PROVIDER: mojang
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      EXISTING_OPS_FILE: SYNCHRONIZE
      WHITELIST:
        valueFrom:
          secretKeyRef:
            name: minecraft
            key: WHITELIST
      OPS:
        valueFrom:
          secretKeyRef:
            name: minecraft
            key: OPS
    minecraftServer:
      rcon:
        enabled: true
      memory: 4096M
      pvp: true
      eula: true
      type: FABRIC
      version: 1.21.10
      modrinth:
        projects:
          # Dependencies
          - fabric-api
          - fabric-language-kotlin
          # Optimization mods
          - lithium
          - scalablelux
          - c2me-fabric
          - krypton
          - ferrite-core
          # QoL
          - no-chat-reports
          - simple-voice-chat
          - ledger
        downloadDependencies: none
        allowedVersionType: release
      gamemode: survival
      difficulty: hard
      levelType: normal
      allowNether: true
      spawnAnimals: true
      spawnMonsters: true
      motd: |
        \u00A7d\u00A7lS\u00A75\u00A7lo\u00A79\u00A7lf\u00A7b\u00A7li\u00A7a\u00A7le\u00A7e\u00A7l'\u00A76\u00A7ls \u00A7c\u00A7lC\u00A7d\u00A7lo\u00A75\u00A7lr\u00A79\u00A7ln\u00A7b\u00A7le\u00A7a\u00A7lr
      maxPlayers: 20
      viewDistance: 16
      spawnProtection: 0
      generateStructures: true
      overrideServerProperties: true
      serviceType: LoadBalancer
      loadBalancerClass: io.cilium/bgp-control-plane
      extraPorts:
        - name: voice-chat
          containerPort: 24454
          protocol: UDP
          service:
            enabled: true
            embedded: true
            port: 24454
    serviceAnnotations:
      external-dns.alpha.kubernetes.io/hostname: mc.${DOMAIN}
      external-dns.alpha.kubernetes.io/target: ${IP_ADDRESS}
      lbipam.cilium.io/sharing-key: public-services
      lbipam.cilium.io/sharing-cross-namespace: network
    serviceLabels:
      bgp: "enabled"
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft
