apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: oauth2clients.ops.finnes.dev
spec:
  scope: Namespaced
  group: ops.finnes.dev
  names:
    kind: OAuth2Client
    plural: oauth2clients
  defaultCompositionRef:
    name: oauth2client-ldap
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clientID
                - redirectURIs
              x-kubernetes-validations:
                - rule: 'self.tokenEndpointAuthMethod == ''none'' ? !has(self.clientSecretRef) : has(self.clientSecretRef)'
                  message: Confidential clients require clientSecretRef; public clients must omit it.
              properties:
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                backendRef:
                  type: object
                  default:
                    kind: ClusterProviderConfig
                    name: directory
                  required:
                    - name
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: A backend change requires deliberate replacement and adoption.
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ClusterProviderConfig
                clientID:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: The client ID is immutable.
                displayName:
                  type: string
                  minLength: 1
                redirectURIs:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    pattern: ^[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+$
                postLogoutRedirectURIs:
                  type: array
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    pattern: ^[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+$
                scopes:
                  type: array
                  default:
                    - openid
                    - profile
                    - email
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                grantTypes:
                  type: array
                  default:
                    - authorization_code
                    - refresh_token
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - refresh_token
                tokenEndpointAuthMethod:
                  type: string
                  default: client_secret_basic
                  enum:
                    - client_secret_basic
                    - client_secret_post
                    - none
                clientSecretRef:
                  type: object
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: oauth2client-ldap
spec:
  compositeTypeRef:
    apiVersion: ops.finnes.dev/v1alpha1
    kind: OAuth2Client
  mode: Pipeline
  pipeline:
    - step: render-client
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{/* SPDX-FileCopyrightText: 2026 Sofie Finnes <sofie+git@finnes.dev>
            SPDX-License-Identifier: MIT */}}
            {{- $xr := getCompositeResource . -}}
            {{- $spec := $xr.spec -}}
            {{- $namespace := $xr.metadata.namespace -}}
            {{- $name := printf "oauth2-%s" $xr.metadata.uid -}}
            {{- $entry := getComposedResource . "ldap-entry" -}}
            {{- $dn := printf "oauthClientID=%s,%s" $spec.clientID "ou=clients,ou=oauth,dc=finnes,dc=dev" -}}
            {{- $public := eq $spec.tokenEndpointAuthMethod "none" -}}
            {{- $attributes := dict
                "objectClass" (list "oauthClient")
                "oauthClientName" (list ($spec.displayName | default $spec.clientID))
                "oauthClientID" (list $spec.clientID)
                "oauthRedirectURIs" $spec.redirectURIs
                "oauthGrantType" $spec.grantTypes
                "oauthResponseType" (list "code")
                "oauthScope" $spec.scopes
                "oauthTokenEndpointAuthMethod" (list $spec.tokenEndpointAuthMethod)
                "oauthIdTokenSignedResponseAlg" (list "RS256") -}}
            {{- $_ := set $attributes "oauthPostLogoutRedirectURI" ($spec.postLogoutRedirectURIs | default list) -}}
            {{- if $public -}}
            {{- $_ := set $attributes "oauthClientSecret" (list) -}}
            {{- end -}}
            {{- $_ := set $attributes "oauthAudience" (list $dn) -}}
            {{- $parameters := dict "dn" $dn "attributes" $attributes -}}
            {{- if not $public -}}
            {{- $_ := set $parameters "attributeSecretRefs" (dict "oauthClientSecret" $spec.clientSecretRef) -}}
            {{- end -}}
            apiVersion: ldap.finnes.dev/v1alpha1
            kind: Entry
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              labels:
                ops.finnes.dev/client-uid: {{ $xr.metadata.uid | quote }}
              annotations:
                {{ setResourceNameAnnotation "ldap-entry" }}
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" (not (empty (and $entry (eq (getResourceCondition "Ready" $entry).Status "True") (eq (getResourceCondition "Synced" $entry).Status "True") (eq (toString (dig "status" "atProvider" "observedGeneration" 0 $entry)) (toString $entry.metadata.generation)) (deepEqual $entry.spec.forProvider $parameters)))) | quote }}
            spec:
              managementPolicies: {{ ternary "[Observe, Create, Update]" "[Observe, Create, Update, Delete]" (eq ($spec.deletionPolicy | default "Delete") "Orphan") }}
              providerConfigRef:
                kind: {{ $spec.backendRef.kind | default "ClusterProviderConfig" }}
                name: {{ $spec.backendRef.name | quote }}
              forProvider: {{ $parameters | toJson }}
