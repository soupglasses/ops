apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jellyfin-media-claims
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
  validations:
    - expression: >-
        !has(object.spec.storageClassName) || object.spec.storageClassName != 'jellyfin-media' || (request.namespace
        == 'media' && object.metadata.name == 'jellyfin-media')
      message: The shared media storage class is reserved for media/jellyfin-media.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jellyfin-media-claims
spec:
  policyName: jellyfin-media-claims
  validationActions: [Deny]
