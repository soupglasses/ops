# Allow tf-runner pods from any namespace to reach source-controller
# Required for tofu-controller to download source artifacts
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tf-runner
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tf-runner
      ports:
        - protocol: TCP
          port: 9090
