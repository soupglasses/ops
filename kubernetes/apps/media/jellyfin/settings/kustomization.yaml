apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ./providerconfig.yaml
  - ./configuration.yaml
  - ./libraries.yaml
  - ./ldap.yaml
patches:
  - target:
      group: jellyfin.ops.finnes.dev
      kind: SystemConfiguration|NetworkingConfiguration|BrandingConfiguration|Library
    patch: |-
      - op: add
        path: /spec/managementPolicies
        value: [Observe, Create, Update]
      - op: add
        path: /spec/providerConfigRef
        value:
          kind: ProviderConfig
          name: jellyfin
