apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-storage
  labels:
    monitoring.finnes.dev/enabled: "true"
spec:
  groups:
    - name: observability.storage
      rules:
        - alert: ObservabilityStorageLow
          expr: |
            (vm_free_disk_space_bytes / vm_total_disk_space_bytes < 0.2)
            or (vl_free_disk_space_bytes / vl_total_disk_space_bytes < 0.2)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Observability storage has less than 20% free space
            description: Check pool capacity and expand the affected ZFS PVC.
        - alert: ObservabilityStorageReadOnly
          expr: vm_storage_is_read_only == 1 or vl_storage_is_read_only == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Observability ingestion stopped because storage is read-only
            description: Inspect free space and storage errors on the affected ZFS volume.
