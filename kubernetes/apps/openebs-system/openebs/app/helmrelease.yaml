apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 30m
  chart:
    spec:
      chart: openebs
      version: 4.6.1
      sourceRef:
        kind: HelmRepository
        name: openebs-charts
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    localpv-provisioner:
      localpv:
        image:
          registry: quay.io
          repository: openebs/provisioner-localpv
          # v4.5 uses Lease leader election instead of deprecated Endpoints.
          tag: 4.6.0@sha256:99f5116f5cb83fb9d046ef5ff5b8ea98da90e7da5250d7b101bd650662238a0a
      helperPod:
        image:
          registry: quay.io/
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false
        basePath: /var/openebs/local
        # Ubuntu's root filesystem is ext4. Use openebs-zfs for enforced capacity limits.
        xfsQuota:
          enabled: false

    zfs-localpv:
      zfsNode:
        encrKeysDir: /var/openebs/keys
      crds:
        csi:
          volumeSnapshots:
            enabled: false

    # CRDs and the snapshot controller are bundled with RKE2.
    openebs-crds:
      csi:
        volumeSnapshots:
          enable: false

    lvm-localpv:
      enabled: false
    mayastor:
      enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    minio:
      enabled: false

    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: true
        rawfile:
          enabled: false
      replicated:
        mayastor:
          enabled: false
