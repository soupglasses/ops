apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: network
  annotations:
    external-dns.kubernetes.io/target: ${IP_ADDRESS},${IPV6_ADDRESS}
spec:
  gatewayClassName: cilium-public
  infrastructure:
    labels:
      bgp: "enabled"
    annotations:
      lbipam.cilium.io/ips: 172.21.68.10,2a13:e745:1ee8:68::10
      lbipam.cilium.io/sharing-key: public-services
      lbipam.cilium.io/sharing-cross-namespace: default
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [identity, monitoring]
