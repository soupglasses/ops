- name: Prepare standalone etcd recovery without Kubernetes or Flux
  hosts: rke2_servers
  become: true
  gather_facts: false
  tasks:
    - name: Install recovery tools without starting or resetting RKE2
      ansible.builtin.import_role:
        name: rke2
        tasks_from: recovery-tools
