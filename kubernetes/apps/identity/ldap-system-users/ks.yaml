# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ldap-system-users
  namespace: identity
spec:
  path: ./kubernetes/apps/identity/ldap-system-users/app
  targetNamespace: identity
  dependsOn:
    - name: ldap-directory
      namespace: identity
  commonMetadata:
    labels:
      app.kubernetes.io/name: ldap-system-users
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
