apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: jellyfin
spec:
  package: ghcr.io/soupglasses/ops/provider-jellyfin@sha256:d1e22256a47695ac30882e0c6b319f10926d10cbd9618a808f664ed9b519af06
  revisionHistoryLimit: 2
  runtimeConfigRef:
    name: jellyfin
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: jellyfin
spec:
  serviceAccountTemplate:
    metadata:
      name: jellyfin-provider
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin-provider
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              env:
                - name: WATCH_NAMESPACE
                  value: media
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: 8081
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: 8081
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop: [ALL]
