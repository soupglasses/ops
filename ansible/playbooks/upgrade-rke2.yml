- name: Upgrade the single RKE2 server during a maintenance window
  hosts: rke2_servers
  become: true
  gather_facts: true
  serial: 1
  vars:
    kubectl_argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
  pre_tasks:
    - name: Require a real maintenance run
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: This upgrade requires a verified new S3 snapshot. Use --syntax-check for offline validation.

    - name: Require independently recoverable application backups and server token
      ansible.builtin.assert:
        that:
          - rke2_recovery_verified | default(false) | bool
          - rke2_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+$')
          - rke2_tarball_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: Verify application backups and off-node token custody, then set rke2_recovery_verified=true.

    - name: Read the installed version
      ansible.builtin.command: /usr/local/bin/rke2 --version
      register: upgrade_installed
      changed_when: false
      check_mode: false

    - name: Parse the installed and requested Kubernetes versions
      ansible.builtin.set_fact:
        upgrade_current: >-
          {{ upgrade_installed.stdout | regex_search('v[0-9]+\.[0-9]+\.[0-9]+') }}
        upgrade_target: "{{ rke2_version.split('+')[0] }}"

    - name: Refuse downgrades and skipped Kubernetes minor versions
      ansible.builtin.assert:
        that:
          - upgrade_current | length > 0
          - upgrade_target[1:].split('.')[0] == upgrade_current[1:].split('.')[0]
          - upgrade_target[1:].split('.')[1] | int >= upgrade_current[1:].split('.')[1] | int
          - upgrade_target[1:].split('.')[1] | int <= (upgrade_current[1:].split('.')[1] | int) + 1
          - upgrade_target[1:] is version(upgrade_current[1:], '>=')
          - >-
            upgrade_target != upgrade_current or (rke2_version.split('rke2r')[1] | int) >= (upgrade_installed.stdout
            | regex_search('rke2r[0-9]+') | replace('rke2r', '') | int)
        fail_msg: Upgrade one minor at a time. Rollback requires the documented datastore restore procedure.

    - name: Check the running node before accepting an already-installed release
      when: upgrade_installed.stdout.split()[2] == rke2_version
      block:
        - name: Read the running node state
          ansible.builtin.command:
            argv: "{{ kubectl_argv + ['get', 'node/nas', '-o', 'json', '--request-timeout=15s'] }}"
          register: upgrade_running_node
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Require a completed healthy upgrade before skipping installation
          ansible.builtin.assert:
            that:
              - >-
                upgrade_running_node.rc == 0 and (upgrade_running_node.stdout | from_json).status.nodeInfo.kubeletVersion
                == rke2_version and not ((upgrade_running_node.stdout | from_json).spec.unschedulable
                | default(false)) and ((upgrade_running_node.stdout | from_json).status.conditions | selectattr('type',
                'equalto', 'Ready') | map(attribute='status') | first | default('False')) == 'True'
            fail_msg: >-
              The target binary is installed but the node is not running that version, Ready and uncordoned.
              Inspect systemctl status rke2-server and kubectl get node nas before continuing. Preserve
              the original pre-upgrade S3 snapshot. Complete the interrupted restart and verify the node
              before uncordoning, or restore the matching pre-upgrade release and snapshot.

    - name: Skip installation when the pinned release is healthy and schedulable
      ansible.builtin.meta: end_host
      when: upgrade_installed.stdout.split()[2] == rke2_version

    - name: Create the RKE2 artifact cache
      ansible.builtin.file:
        path: /var/cache/rke2
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Download and verify the release before interrupting the node
      ansible.builtin.get_url:
        url: >-
          https://github.com/rancher/rke2/releases/download/{{ rke2_version | replace('+', '%2B') }}/rke2.linux-amd64.tar.gz
        dest: "/var/cache/rke2/rke2-{{ rke2_version | replace('+', '_') }}.tar.gz"
        owner: root
        group: root
        mode: "0640"
        checksum: "sha256:{{ rke2_tarball_sha256 }}"

    - name: Name the pre-upgrade recovery point
      ansible.builtin.set_fact:
        upgrade_snapshot: "pre-upgrade-{{ ansible_date_time.epoch }}"

    - name: Create an off-cluster etcd recovery point
      ansible.builtin.command:
        argv: [/usr/local/bin/rke2, etcd-snapshot, save, --s3, --name, "{{ upgrade_snapshot }}"]
      changed_when: true
      no_log: true

    - name: Confirm the new snapshot is listed in S3
      ansible.builtin.command: /usr/local/bin/rke2 etcd-snapshot ls --s3
      register: upgrade_snapshots
      changed_when: false
      # The listing also contains local copies, which cannot prove off-node survival.
      failed_when: >-
        upgrade_snapshots.rc != 0 or (upgrade_snapshots.stdout_lines | select('match', '^' + upgrade_snapshot
        + '-nas-[0-9]+(?:\\.zip)?\\s+s3://') | list | length) == 0
      no_log: true

  tasks:
    - name: Cordon the node before changing RKE2
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['cordon', 'nas'] }}"
      register: upgrade_cordon
      changed_when: "'already cordoned' not in upgrade_cordon.stdout"

    - name: Install the verified release using the existing host configuration
      ansible.builtin.unarchive:
        src: "/var/cache/rke2/rke2-{{ rke2_version | replace('+', '_') }}.tar.gz"
        dest: /usr/local
        remote_src: true

    - name: Restart the installed RKE2 service
      ansible.builtin.systemd_service:
        name: rke2-server
        state: restarted

    - name: Wait for the Kubernetes API after restart
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['get', '--raw=/readyz'] }}"
      register: upgrade_api_ready
      changed_when: false
      retries: 60
      delay: 5
      until: upgrade_api_ready.rc == 0 and upgrade_api_ready.stdout == 'ok'

    - name: Wait for the node to report the pinned Kubernetes version
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['get', 'node/nas', '-o', 'jsonpath={.status.nodeInfo.kubeletVersion}']
          }}"
      register: upgrade_node_version
      changed_when: false
      retries: 60
      delay: 5
      until: upgrade_node_version.rc == 0 and upgrade_node_version.stdout == rke2_version

    - name: Wait for node readiness after the upgrade
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['wait', '--for=condition=Ready', 'node/nas', '--timeout=300s'] }}"
      changed_when: false

    - name: Uncordon the healthy node
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['uncordon', 'nas'] }}"
      register: upgrade_uncordon
      changed_when: "'already uncordoned' not in upgrade_uncordon.stdout"

- name: Verify the upgraded host
  ansible.builtin.import_playbook: verify.yml
  vars:
    rke2_expected_version: "{{ rke2_version }}"
