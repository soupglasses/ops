apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: log-collector
  namespace: monitoring
spec:
  interval: 30m
  targetNamespace: log-collection
  dependsOn:
    - name: victoria-logs
  chart:
    spec:
      chart: vector
      version: 0.52.0
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    role: Agent
    image:
      base: debian
    serviceAccount:
      create: true
      automountToken: true
    rbac:
      create: true
    podLabels:
      vector.dev/exclude: 'true'
    tolerations:
      - operator: Exists
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    defaultVolumes:
      - name: var-log
        hostPath:
          path: /var/log
          type: Directory
      - name: run-log-journal
        hostPath:
          path: /run/log/journal
          type: Directory
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File
    defaultVolumeMounts:
      - name: var-log
        mountPath: /var/log
        readOnly: true
      - name: run-log-journal
        mountPath: /run/log/journal
        readOnly: true
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
    persistence:
      hostPath:
        enabled: true
        path: /var/lib/vector-victoria-logs
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 1Gi
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: false
      sources:
        k8s:
          type: kubernetes_logs
          self_node_name: $${VECTOR_SELF_NODE_NAME}
        journald:
          type: journald
          # The collector's systemd 257 cannot read all boots through Vector.
          current_boot_only: true
          since_now: false
        internal_metrics:
          type: internal_metrics
      transforms:
        parser:
          type: remap
          inputs:
            - k8s
          source: |
            .log = parse_json(.message) ?? .message
            del(.message)
            .source = "kubernetes"
        journald_normalize:
          type: remap
          inputs:
            - journald
          source: |
            .node_name = get_env_var!("VECTOR_SELF_NODE_NAME")
            .source = "journald"
      sinks:
        exporter:
          type: prometheus_exporter
          address: 0.0.0.0:9090
          inputs:
            - internal_metrics
        vlogs:
          type: elasticsearch
          inputs:
            - parser
            - journald_normalize
          mode: bulk
          api_version: v8
          compression: gzip
          batch:
            max_bytes: 1048576
          healthcheck:
            # VictoriaLogs supports bulk ingestion, not Elasticsearch cluster health.
            enabled: false
          buffer:
            type: disk
            max_size: 536870912
            when_full: block
          request:
            concurrency: 2
            headers:
              VL-Time-Field: timestamp
              VL-Stream-Fields: source,node_name,kubernetes.pod_namespace,kubernetes.container_name,_SYSTEMD_UNIT
              VL-Msg-Field: message,msg,_msg,log.msg,log.message,log
              AccountID: '0'
              ProjectID: '0'
          endpoints:
            - http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local.:9428/insert/elasticsearch/
    fullnameOverride: log-collector
    service:
      enabled: true
      ports:
        - name: metrics
          port: 9090
          targetPort: 9090
          protocol: TCP
  releaseName: log-collector
