apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-identity
  labels:
    monitoring.finnes.dev/enabled: "true"
spec:
  groups:
    - name: application.identity
      rules:
        # Prefer the recommended Kubernetes label, with legacy labels as fallbacks.
        - record: namespace_pod:app:info
          expr: |
            max by (namespace, pod, app) (
              label_replace(kube_pod_labels{label_app_kubernetes_io_name!=""}, "app", "$1", "label_app_kubernetes_io_name", "(.+)")
              or on (namespace, pod)
              label_replace(kube_pod_labels{label_app!=""}, "app", "$1", "label_app", "(.+)")
              or on (namespace, pod)
              label_replace(kube_pod_labels{label_k8s_app!=""}, "app", "$1", "label_k8s_app", "(.+)")
              or on (namespace, pod)
              label_replace(kube_pod_labels{label_component!=""}, "app", "$1", "label_component", "(.+)")
            )
        - record: namespace_app_persistentvolumeclaim:info
          expr: |
            max by (namespace, app, persistentvolumeclaim) (
              kube_pod_spec_volumes_persistentvolumeclaims_info
              * on (namespace, pod) group_left (app) namespace_pod:app:info
            )
---
