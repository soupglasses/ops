apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-gateway-tls
  namespace: network
spec:
  secretName: private-gateway-tls
  issuerRef:
    name: cloudflare-dns01-production
    kind: ClusterIssuer
  dnsNames:
    - jellyfin.home.${DOMAIN}
