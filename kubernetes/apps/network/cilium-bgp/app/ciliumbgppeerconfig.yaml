# CiliumBGPPeerConfig defines the BGP peering settings for RouterOS
# This is referenced by CiliumBGPClusterConfig
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: routeros-ipv6
spec:
  # Keep a distinct credential so either address family can be rotated independently.
  authSecretRef: cilium-bgp-ipv6-auth
  timers:
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
