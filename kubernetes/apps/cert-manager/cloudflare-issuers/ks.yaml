# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudflare-issuers
  namespace: &namespace cert-manager
spec:
  path: ./kubernetes/apps/cert-manager/cloudflare-issuers/app
  targetNamespace: *namespace
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: cloudflare-dns01-production
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: cloudflare-dns01-staging
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
