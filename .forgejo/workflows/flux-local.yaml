name: Flux Local Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-local-test:
    name: Flux Local Test
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run flux-local test
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace/soupglasses/ops" \
            -v "$HOME/.gitconfig:/root/.gitconfig:ro" \
            -w /workspace/soupglasses/ops \
            ghcr.io/allenporter/flux-local:v8.1.0 \
            test --enable-helm --all-namespaces --path kubernetes/clusters/home -v
