all:
  children:
    rke2_servers:
      hosts:
        nas:
          # `initial_ansible_host` supports the one-time installer-address handoff.
          # Unlike overriding ansible_host directly, the network role can replace it.
          ansible_host: "{{ initial_ansible_host | default(inventory_hostname) }}"
    satellite_servers:
      hosts:
        satellite:
          ansible_connection: local
          ansible_user: sofie
