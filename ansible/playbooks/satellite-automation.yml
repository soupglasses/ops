- name: Configure satellite bot automation and ACME webroot permissions
  hosts: satellite_servers
  become: true
  gather_facts: false
  pre_tasks:
    - name: Gather only the host identity
      ansible.builtin.setup:
        gather_subset: ["!all", "!min", platform]
        filter: ansible_hostname
  roles:
    - soupbot_runtime
