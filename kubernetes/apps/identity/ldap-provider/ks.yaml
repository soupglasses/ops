apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ldap-provider
  namespace: identity
spec:
  path: ./kubernetes/apps/identity/ldap-provider/app
  targetNamespace: identity
  dependsOn:
    - name: crossplane
      namespace: crossplane-system
    - name: openldap
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  timeout: 5m
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ldap-directory
  namespace: identity
spec:
  path: ./kubernetes/apps/identity/ldap-provider/config
  dependsOn:
    - name: ldap-provider
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  prune: true
