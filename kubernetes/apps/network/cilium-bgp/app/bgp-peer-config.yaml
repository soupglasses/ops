# CiliumBGPPeerConfig defines the BGP peering settings for RouterOS
# This is referenced by CiliumBGPClusterConfig
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: routeros-peer
  namespace: kube-system
spec:
  timers:
    # Fast failure detection for home network
    connectRetryTimeSeconds: 5
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  # Graceful restart allows Cilium agent restarts without traffic disruption
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  ebgpMultihop: 1
  families:
    # Only IPv4 is needed for this setup
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "bgp"
