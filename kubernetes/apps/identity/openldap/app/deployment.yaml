# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.33.2/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openldap
    spec:
      containers:
        - name: openldap
          image: ghcr.io/soupglasses/openldap@sha256:ea891fd9cdaa941a3e7ddd8375319ccb4a63b4f0da418516a0393ad0527c8005
          ports:
            - containerPort: 636
              name: ldaps
          env:
            - name: LDAP_SUFFIX
              value: "dc=finnes,dc=dev"
            - name: LDAP_ROOT_DN
              value: "cn=admin,dc=finnes,dc=dev"
            - name: LDAP_ORGANIZATION_NAME
              value: "Finnes"
            - name: LDAP_OVERLAYS
              value: "memberof,refint,otp"
            - name: LDAP_URLS
              value: "ldaps://0.0.0.0:636/"
            - name: LDAP_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openldap
                  key: LDAP_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /config/data
            - name: tls
              mountPath: /config/tls
              readOnly: true
            - name: overlays
              mountPath: /config/ldif.d
              readOnly: true
            - name: oauth-schema
              mountPath: /config/slapd.conf.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openldap-data
        - name: tls
          projected:
            sources:
              - secret:
                  name: openldap-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
                    - key: tls.crt
                      path: ca.crt
        - name: overlays
          configMap:
            name: openldap-overlays
        - name: oauth-schema
          configMap:
            name: openldap-oauth-schema
