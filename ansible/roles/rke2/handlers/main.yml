- name: Restart RKE2
  ansible.builtin.systemd_service:
    name: rke2-server
    state: restarted
    daemon_reload: true
  listen: Restart RKE2

- name: Restart Prometheus node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
    daemon_reload: true
  listen: Restart Prometheus node exporter
