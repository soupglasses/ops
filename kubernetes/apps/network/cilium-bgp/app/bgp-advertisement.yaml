# CiliumBGPAdvertisement defines what routes Cilium will advertise via BGP
# This is matched by the CiliumBGPPeerConfig via label selector
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    # This label is matched by CiliumBGPPeerConfig
    advertise: bgp
spec:
  advertisements:
    # Advertise the IPv4 and IPv6 LoadBalancer VIPs to RouterOS.
    - advertisementType: "Service"
      service:
        addresses:
          - LoadBalancerIP
      # Select services with the bgp label
      selector:
        matchLabels:
          bgp: "enabled"
