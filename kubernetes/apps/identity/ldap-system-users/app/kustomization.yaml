# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - ./providerconfig.yaml
  - ./entry.yaml
  - ./groupofnames.yaml
  - ./secret.sops.yaml
patches:
  - target:
      group: ldap.finnes.dev
      kind: Entry
    patch: |-
      - op: add
        path: /spec/managementPolicies
        value: [Observe, Create, Update]
      - op: add
        path: /spec/providerConfigRef
        value:
          kind: ProviderConfig
          name: directory-admin
