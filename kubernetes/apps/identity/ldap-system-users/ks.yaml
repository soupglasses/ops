# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ldap-system-users
  namespace: &namespace identity
spec:
  path: ./kubernetes/apps/identity/ldap-system-users/app
  targetNamespace: *namespace
  dependsOn:
    - name: openldap
      namespace: identity
    - name: tofu-controller
      namespace: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: infra.contrib.fluxcd.io/v1alpha2
      kind: Terraform
      name: ldap-system-users
      namespace: identity
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
