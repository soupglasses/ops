# One-time conversion input. Normal startup reads the resulting cn=config.
include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/nis.schema
include /etc/openldap/schema/inetorgperson.schema
include /source/oauth.schema.conf

pidfile /run/openldap/run/slapd.pid
argsfile /run/openldap/run/slapd.args
modulepath /usr/lib/openldap
moduleload back_mdb
moduleload memberof
moduleload refint
moduleload otp
moduleload ppolicy
moduleload argon2

TLSCertificateFile /certs/tls.crt
TLSCertificateKeyFile /certs/tls.key
TLSCACertificateFile /etc/ssl/certs/ca-certificates.crt
TLSVerifyClient never
TLSProtocolMin 3.3
localSSF 128
security ssf=128 simple_bind=128
password-hash {ARGON2}

database config
access to dn.exact="cn=config" attrs=olcTLSCertificateFile,olcTLSCertificateKeyFile
    by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage
    by dn.exact="gidNumber=389+uidNumber=389,cn=peercred,cn=external,cn=auth" write
    by * none
access to *
    by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage
    by * none

database mdb
maxsize 1073741824
suffix "dc=finnes,dc=dev"
rootdn "cn=admin,dc=finnes,dc=dev"
@ROOT_PASSWORD_HASH@
directory /var/lib/openldap
index objectClass eq
index uid,mail,cn eq
index member,memberOf eq
index entryUUID eq

access to attrs=userPassword by self =w by anonymous auth by * none
# Permit suffix-based application searches without exposing other subtrees.
access to dn.exact="dc=finnes,dc=dev" attrs=entry,objectClass,dc
    by group.exact="cn=ldap-readers,ou=groups,dc=finnes,dc=dev" read
    by * none
access to dn.subtree="ou=users,dc=finnes,dc=dev" attrs=entry,objectClass,uid,cn,sn,givenName,displayName,mail,memberOf,entryUUID,modifyTimestamp
    by group.exact="cn=ldap-readers,ou=groups,dc=finnes,dc=dev" read
    by self read
    by * none
access to dn.subtree="ou=groups,dc=finnes,dc=dev" attrs=entry,objectClass,cn,description,member,entryUUID,modifyTimestamp
    by group.exact="cn=ldap-readers,ou=groups,dc=finnes,dc=dev" read
    by * none
access to * by * none

overlay memberof
memberof-dangling ignore
memberof-refint TRUE
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf

overlay refint
refint_attributes memberOf member manager owner

overlay otp

overlay ppolicy
ppolicy_default "cn=password,ou=policies,dc=finnes,dc=dev"
ppolicy_hash_cleartext
ppolicy_use_lockout
