apiVersion: v1
kind: ConfigMap
metadata:
  name: application-overview-dashboard
  labels:
    grafana_dashboard: "1"
data:
  application-overview.json: |-
    {
      "uid": "application-overview",
      "title": "Application overview",
      "description": "Resource usage, logs, alerts and VolSync backups for a Kubernetes application.",
      "editable": false,
      "schemaVersion": 41,
      "version": 1,
      "tags": [
        "kubernetes",
        "apps"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "VictoriaMetrics"
            },
            "definition": "label_values(namespace_pod:app:info, namespace)",
            "query": {
              "query": "label_values(namespace_pod:app:info, namespace)",
              "refId": "namespace"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "default",
              "value": "default"
            }
          },
          {
            "name": "app",
            "label": "App",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "VictoriaMetrics"
            },
            "definition": "label_values(namespace_pod:app:info{namespace=\"$namespace\"}, app)",
            "query": {
              "query": "label_values(namespace_pod:app:info{namespace=\"$namespace\"}, app)",
              "refId": "app"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "minecraft",
              "value": "minecraft"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU used",
          "type": "gauge",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum((max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[$__rate_interval])) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))",
              "legendFormat": "",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "100 * ((sum((kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"cpu\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})) > 0) or sum(kube_node_status_allocatable{resource=\"cpu\"} and on (node) (kube_pod_info and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))",
              "legendFormat": "Gauge maximum",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": false
          },
          "description": "Peak is over the selected time range. Scale uses configured resource requests. Usage may exceed a request. If no request is configured, the scale uses allocatable capacity of the hosting nodes. CPU: 100% equals one core.",
          "transformations": [
            {
              "id": "configFromData",
              "options": {
                "configRefId": "B",
                "mappings": [
                  {
                    "fieldName": "Gauge maximum",
                    "handlerKey": "max",
                    "reducerId": "lastNotNull"
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 2,
          "title": "Peak CPU",
          "type": "gauge",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (clamp_min(max_over_time((sum((max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[$__rate_interval])) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))[$__range:1m]), scalar(sum((max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[$__rate_interval])) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))))",
              "legendFormat": "",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "100 * ((sum((kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"cpu\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})) > 0) or sum(kube_node_status_allocatable{resource=\"cpu\"} and on (node) (kube_pod_info and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))",
              "legendFormat": "Gauge maximum",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": false
          },
          "description": "Peak is over the selected time range. Scale uses configured resource requests. Usage may exceed a request. If no request is configured, the scale uses allocatable capacity of the hosting nodes. CPU: 100% equals one core.",
          "transformations": [
            {
              "id": "configFromData",
              "options": {
                "configRefId": "B",
                "mappings": [
                  {
                    "fieldName": "Gauge maximum",
                    "handlerKey": "max",
                    "reducerId": "lastNotNull"
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 3,
          "title": "Memory used",
          "type": "gauge",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "(sum((kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"memory\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})) > 0) or sum(kube_node_status_allocatable{resource=\"memory\"} and on (node) (kube_pod_info and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "Gauge maximum",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": false
          },
          "description": "Peak is over the selected time range. Scale uses configured resource requests. Usage may exceed a request. If no request is configured, the scale uses allocatable capacity of the hosting nodes.",
          "transformations": [
            {
              "id": "configFromData",
              "options": {
                "configRefId": "B",
                "mappings": [
                  {
                    "fieldName": "Gauge maximum",
                    "handlerKey": "max",
                    "reducerId": "lastNotNull"
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 4,
          "title": "Peak memory",
          "type": "gauge",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "clamp_min(max_over_time((sum((max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))[$__range:1m]), scalar(sum((max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))))",
              "legendFormat": "",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "(sum((kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"memory\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})) > 0) or sum(kube_node_status_allocatable{resource=\"memory\"} and on (node) (kube_pod_info and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "Gauge maximum",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": false
          },
          "description": "Peak is over the selected time range. Scale uses configured resource requests. Usage may exceed a request. If no request is configured, the scale uses allocatable capacity of the hosting nodes.",
          "transformations": [
            {
              "id": "configFromData",
              "options": {
                "configRefId": "B",
                "mappings": [
                  {
                    "fieldName": "Gauge maximum",
                    "handlerKey": "max",
                    "reducerId": "lastNotNull"
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 5,
          "title": "Ready pods",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((kube_pod_status_ready{condition=\"true\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Container restarts",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 5,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((increase(kube_pod_container_status_restarts_total[$__range]) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "description": "Restarts observed during the selected time range."
        },
        {
          "id": 7,
          "title": "Configured backups",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((volsync_source_info{namespace=\"$namespace\"} and on (namespace, persistentvolumeclaim) namespace_app_persistentvolumeclaim:info{namespace=\"$namespace\",app=\"$app\"})) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 8,
          "title": "Active alerts",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 5,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{namespace=\"$namespace\",app=\"$app\"} or (ALERTS{namespace=\"$namespace\"} and on (namespace,pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}) or (ALERTS{namespace=\"$namespace\"} and on (namespace,persistentvolumeclaim) namespace_app_persistentvolumeclaim:info{namespace=\"$namespace\",app=\"$app\"}) or ((ALERTS{obj_namespace=\"$namespace\"} and on (obj_namespace, obj_name) label_replace(label_replace((volsync_source_info{namespace=\"$namespace\"} and on (namespace, persistentvolumeclaim) namespace_app_persistentvolumeclaim:info{namespace=\"$namespace\",app=\"$app\"}), \"obj_namespace\", \"$1\", \"namespace\", \"(.+)\"), \"obj_name\", \"$1\", \"source\", \"(.+)\")))) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 9,
          "title": "CPU usage, requests and limits",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum((max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[$__rate_interval])) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))",
              "legendFormat": "Used",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "100 * (sum((kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"cpu\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))",
              "legendFormat": "Requested",
              "instant": false,
              "range": true
            },
            {
              "refId": "C",
              "expr": "100 * (sum((kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"cpu\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"})))",
              "legendFormat": "Limits (configured containers)",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "100% equals one CPU core. Requested and limit lines use the same scale."
        },
        {
          "id": 10,
          "title": "Memory working set, requests and limits",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum((max by (namespace, pod, container) (container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "Used",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum((kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"memory\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "Requested",
              "instant": false,
              "range": true
            },
            {
              "refId": "C",
              "expr": "sum((kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"memory\"} and on (namespace, pod) namespace_pod:app:info{namespace=\"$namespace\",app=\"$app\"}))",
              "legendFormat": "Limits (configured containers)",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "title": "Backups · last successful sync",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(time() - volsync_source_last_sync_time_seconds{namespace=\"$namespace\"}) and on (namespace, persistentvolumeclaim) namespace_app_persistentvolumeclaim:info{namespace=\"$namespace\",app=\"$app\"}",
              "legendFormat": "{{source}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "noValue": "No successful backup recorded"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "description": "Age of the last successful VolSync backup for each PVC used by this app. No data means no successful sync has been observed. Restore checks are recorded in the recovery runbook."
        },
        {
          "id": 12,
          "title": "Backups · synchronization",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(volsync_volume_out_of_sync{role=\"source\",obj_namespace=\"$namespace\"} and on (obj_namespace, obj_name) label_replace(label_replace((volsync_source_info{namespace=\"$namespace\"} and on (namespace, persistentvolumeclaim) namespace_app_persistentvolumeclaim:info{namespace=\"$namespace\",app=\"$app\"}), \"obj_namespace\", \"$1\", \"namespace\", \"(.+)\"), \"obj_name\", \"$1\", \"source\", \"(.+)\"))",
              "legendFormat": "{{obj_name}}",
