apiVersion: identity.ops.finnes.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: jellyfin-bind
  namespace: media
spec:
  cn: media.jellyfin
  description: LDAP lookup identity for Jellyfin
---
apiVersion: identity.ops.finnes.dev/v1alpha1
kind: GroupOfNames
metadata:
  name: jellyfin-user-group
spec:
  cn: jellyfin.user
  description: Users permitted to sign in to Jellyfin
---
apiVersion: identity.ops.finnes.dev/v1alpha1
kind: GroupOfNames
metadata:
  name: jellyfin-admin-group
spec:
  cn: jellyfin.admin
  description: Jellyfin administrators
