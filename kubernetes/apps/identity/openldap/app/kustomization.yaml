# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./certificate.yaml
  - ./secret.sops.yaml
components:
  - ../../../../components/volsync
  - ../../../../components/volsync-quiesce
configMapGenerator:
  - name: openldap-overlays
    files:
      - ./01-memberof.ldif
      - ./02-refint.ldif
      - ./03-ppolicy.ldif
      - ./04-otp.ldif
  - name: openldap-oauth-schema
    files:
      - ./oauth.schema.conf
