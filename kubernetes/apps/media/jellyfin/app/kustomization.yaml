apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./networkpolicy.yaml
  - ./httproute.yaml
  - ./pvc.yaml
  - ./storage-alerts.yaml
  - ./media-storage.yaml
  - ./media-admission.yaml
  - ./secret.sops.yaml
  - ./identity.yaml
  - ./settings.yaml
patches:
  - target:
      group: jellyfin.ops.finnes.dev
    patch: |-
      - op: add
        path: /metadata/namespace
        value: media
  - target:
      kind: Secret
    patch: |-
      - op: add
        path: /metadata/namespace
        value: media
  - target:
      group: jellyfin.ops.finnes.dev
      kind: SystemConfiguration|NetworkingConfiguration|BrandingConfiguration|Library
    patch: |-
      - op: add
        path: /spec/managementPolicies
        value: [Observe, Create, Update]
      - op: add
        path: /spec/providerConfigRef
        value:
          kind: ProviderConfig
          name: jellyfin
  - target:
      group: ops.finnes.dev
    patch: |-
      - op: add
        path: /metadata/namespace
        value: media
