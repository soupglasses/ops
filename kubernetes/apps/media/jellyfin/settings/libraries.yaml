apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: Library
metadata:
  name: jellyfin-movies
  annotations:
    crossplane.io/external-name: Movies
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
  providerConfigRef:
    kind: ProviderConfig
    name: jellyfin
  forProvider:
    collectionType: movies
    paths:
      - /media/movies
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
