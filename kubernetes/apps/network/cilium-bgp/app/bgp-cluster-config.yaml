# CiliumBGPClusterConfig defines the BGP instance and peer configuration
# This creates a BGP session between Cilium (on Kubernetes nodes) and RouterOS
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: routeros-bgp
  namespace: kube-system
spec:
  # Apply to all nodes (only nas currently)
  nodeSelector:
    matchExpressions:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists}
  bgpInstances:
    - name: "instance-64512"
      # Cilium uses a private ASN (64512-65534 are private ASNs)
      localASN: 64512
      peers:
        - name: "routeros-ipv4"
          peerASN: 64513
          peerAddress: 172.21.71.1
          peerConfigRef:
            name: "routeros-ipv4"
        - name: "routeros-ipv6"
          peerASN: 64513
          peerAddress: 2a13:e745:1ee8:71::1
          peerConfigRef:
            name: "routeros-ipv6"
