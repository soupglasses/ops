apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-identity
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/identity
  targetNamespace: media
  dependsOn:
    - name: ldap-directory
      namespace: identity
    - name: jellyfin-groups
      namespace: media
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-media
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/media
  dependsOn:
    - name: csi-driver-nfs
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/app
  targetNamespace: media
  dependsOn:
    - name: jellyfin-identity
      namespace: media
    - name: jellyfin-media
      namespace: media
    - name: cilium-private-gateway
      namespace: network
    - name: openebs
      namespace: openebs-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-groups
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/groups
  targetNamespace: identity
  dependsOn:
    - name: ldap-system-users
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: identity.ops.finnes.dev/v1alpha1
      kind: GroupOfNames
      name: jellyfin-user-group
      namespace: identity
    - apiVersion: identity.ops.finnes.dev/v1alpha1
      kind: GroupOfNames
      name: jellyfin-admin-group
      namespace: identity
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-provider
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/provider
  suspend: true
  dependsOn:
    - name: crossplane
      namespace: crossplane-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: jellyfin
  healthCheckExprs:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      current: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-settings
  namespace: media
spec:
  path: ./kubernetes/apps/media/jellyfin/settings
  suspend: true
  targetNamespace: media
  dependsOn:
    - name: jellyfin
      namespace: media
    - name: jellyfin-provider
      namespace: media
    - name: ldap-provider
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
