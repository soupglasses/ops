- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Install the host ruleset
  ansible.builtin.template:
    src: host-firewall.nft.j2
    dest: /etc/host-firewall.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft --check --file %s

- name: Install the host firewall unit
  ansible.builtin.template:
    src: host-firewall.service.j2
    dest: /etc/systemd/system/host-firewall.service
    owner: root
    group: root
    mode: "0644"

- name: Load the ruleset and keep it only when new connections succeed
  when: not ansible_check_mode
  block:
    - name: Arm a rollback that removes the firewall after five minutes
      ansible.builtin.command:
        argv:
          - systemd-run
          - --collect
          - --unit=host-firewall-rollback
          - --on-active=5min
          - systemctl
          - disable
          - --now
          - host-firewall.service
      changed_when: true

    - name: Load the host ruleset
      ansible.builtin.systemd_service:
        name: host-firewall.service
        state: reloaded
        enabled: true
        daemon_reload: true

    - name: Open a fresh SSH session from the controller
      ansible.builtin.command:
        argv: [ssh, -S, none, -o, BatchMode=yes, "{{ inventory_hostname }}", /bin/true]
      timeout: 30
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Keep the firewall by stopping the rollback
      ansible.builtin.systemd_service:
        name: host-firewall-rollback.timer
        state: stopped
