name: Ansible
on:
  pull_request:
    paths:
      - ansible/**
      - .mise.toml
      - .github/workflows/ansible.yaml
  push:
    branches: [main]
    paths:
      - ansible/**
      - .mise.toml
      - .github/workflows/ansible.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
          install_args: python aqua:go-task/task
      - name: Install pinned Ansible and collections
        run: |
          python -m pip install -r ansible/requirements.txt
          task ansible:deps
      - name: Validate playbooks without loading credentials
        run: task ansible:test
