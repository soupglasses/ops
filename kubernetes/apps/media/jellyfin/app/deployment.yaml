apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [2000]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          env:
            - name: JELLYFIN_DATA_DIR
              value: /config/server
            - name: JELLYFIN_CONFIG_DIR
              value: /config/server/config
            - name: JELLYFIN_LOG_DIR
              value: /config/server/log
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /health answers 200 with "Degraded" until startup completes.
          startupProbe:
            exec:
              command: [sh, -c, 'curl -fsS --max-time 2 http://127.0.0.1:8096/health | grep -qx Healthy']
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [sh, -c, 'curl -fsS --max-time 2 http://127.0.0.1:8096/health | grep -qx Healthy']
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
              readOnly: false
            - name: cache
              mountPath: /cache
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: cache
          emptyDir: {}
        - name: temporary
          emptyDir: {}
