apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: oauth2clients.ops.finnes.dev
spec:
  scope: Namespaced
  group: ops.finnes.dev
  names:
    kind: OAuth2Client
    plural: oauth2clients
  defaultCompositionRef:
    name: oauth2client-ldap
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clientID
                - redirectURIs
              x-kubernetes-validations:
                - rule: 'self.tokenEndpointAuthMethod == ''none'' ? !has(self.clientSecretRef) : has(self.clientSecretRef)'
                  message: Confidential clients require clientSecretRef; public clients must omit it.
              properties:
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                backendRef:
                  type: object
                  default:
                    kind: ClusterProviderConfig
                    name: directory
                  required:
                    - name
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: A backend change requires deliberate replacement and adoption.
                  properties:
                    name:
                      type: string
                      minLength: 1
                    kind:
                      type: string
                      enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                      default: ClusterProviderConfig
                clientID:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: The client ID is immutable.
                displayName:
                  type: string
                  minLength: 1
                redirectURIs:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    pattern: ^[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+$
                postLogoutRedirectURIs:
                  type: array
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    pattern: ^[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+$
                scopes:
                  type: array
                  default:
                    - openid
                    - profile
                    - email
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                grantTypes:
                  type: array
                  default:
                    - authorization_code
                    - refresh_token
                  minItems: 1
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - refresh_token
                tokenEndpointAuthMethod:
                  type: string
                  default: client_secret_basic
                  enum:
                    - client_secret_basic
                    - client_secret_post
                    - none
                clientSecretRef:
                  type: object
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
---
