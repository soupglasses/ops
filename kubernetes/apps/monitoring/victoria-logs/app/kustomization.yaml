# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ./configmap.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./persistentvolumeclaim.yaml
  - ./job.yaml
  - ./rbac.yaml
  - ./serviceaccount.yaml
  # Retain restore credentials until the retired repository is deleted.
  - ../../../../components/volsync/replicationdestination.yaml
  - ../../../../components/volsync/secret.yaml

configMapGenerator:
  - name: vector-k8s-monitoring-dashboard
    files:
      - vector-k8s-monitoring-custom.json=vector-k8s-monitoring.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
