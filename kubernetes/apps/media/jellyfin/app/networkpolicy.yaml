apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
spec:
  endpointSelector:
    matchLabels:
      app: jellyfin
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: crossplane-system
            app.kubernetes.io/name: jellyfin-provider
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - fromEntities: [ingress, host]
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: identity
            k8s:app.kubernetes.io/name: openldap
      toPorts:
        - ports:
            - port: "1636"
              protocol: TCP
    - toFQDNs:
        - matchName: ldap.finnes.dev
      toPorts:
        - ports:
            - port: "636"
              protocol: TCP
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
