- name: Verify the RKE2 host through observable interfaces
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    kubectl_argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Require core services to be running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['systemd-networkd.service'].state == 'running'
          - ansible_facts.services['auditd.service'].state == 'running'
          - ansible_facts.services['rke2-server.service'].state == 'running'

    - name: Check the AIDE integrity database
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db
      register: aide_database

    - name: Require an initialized AIDE database
      ansible.builtin.assert:
        that:
          - aide_database.stat.isreg | default(false)

    - name: Read node readiness from the Kubernetes API
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['wait', '--for=condition=Ready', 'node/nas', '--timeout=180s'] }}"
      changed_when: false

    - name: Read Cilium status
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['-n', 'kube-system', 'rollout', 'status', 'daemonset/cilium', '--timeout=180s']
          }}"
      changed_when: false

    - name: Read Cilium host-firewall status
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['-n', 'kube-system', 'exec', 'daemonset/cilium', '--', 'cilium-dbg',
          'status'] }}"
      register: cilium_status
      changed_when: false

    - name: Require the Cilium host firewall
      ansible.builtin.assert:
        that:
          - cilium_status.stdout is regex('(?m)^Host firewall:\s+Enabled')

    - name: Check node addresses
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['get', 'node/nas', '-o', 'jsonpath={.status.addresses[*].address}']
          }}"
      register: node_addresses
      changed_when: false

    - name: Require both static node addresses
      ansible.builtin.assert:
        that:
          - network_ipv4_address.split('/')[0] in node_addresses.stdout.split()
          - network_ipv6_address.split('/')[0] in node_addresses.stdout.split()

    - name: Check the adopted ZFS pool
      ansible.builtin.command: zpool status -x {{ zfs_pool_name }}
      register: zpool_status
      changed_when: false
      failed_when: zpool_status.rc != 0 or 'is healthy' not in zpool_status.stdout

    - name: Require the bundled snapshot CRDs
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['wait', '--for=condition=Established', 'crd/volumesnapshots.snapshot.storage.k8s.io',
          'crd/volumesnapshotcontents.snapshot.storage.k8s.io', 'crd/volumesnapshotclasses.snapshot.storage.k8s.io',
          '--timeout=120s'] }}"
      changed_when: false

    - name: Require the bundled snapshot controller
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['-n', 'kube-system', 'rollout', 'status', 'deployment/rke2-snapshot-controller',
          '--timeout=120s'] }}"
      changed_when: false
