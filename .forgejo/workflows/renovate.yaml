name: Renovate
on:
  schedule:
    - cron: "@daily"

  workflow_dispatch:
    inputs:
      loglevel:
        description: "Log Level"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug

jobs:
  Renovate:
    runs-on: codeberg-tiny
    steps:
      - name: Run Renovate
        uses: docker://ghcr.io/renovatebot/renovate:latest
        with:
          args: soupglasses/ops
        env:
          LOG_LEVEL: ${{ inputs.loglevel || 'info' }}
          RENOVATE_GIT_AUTHOR: Ops Bot <sofie+bot@mailbox.org>
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_PR_HOURLY_LIMIT: "0"
