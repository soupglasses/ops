version: "3"
tasks:
  test:
    desc: Run a Helm release's native acceptance tests
    requires:
      vars: [NAMESPACE, RELEASE]
    cmd: helm test {{.RELEASE | shellQuote}} --namespace {{.NAMESPACE | shellQuote}} --logs --timeout
      5m

  verify-render:
    desc: Verify Jellyfin storage, no-backup policy and private-route invariants in the final Flux render
    vars:
      RENDER:
        sh: mktemp
    cmds:
      - defer: rm -f {{.RENDER | shellQuote}}
      - task flate:build > {{.RENDER | shellQuote}}
      - python3 scripts/verify-jellyfin-render.py {{.RENDER | shellQuote}}
