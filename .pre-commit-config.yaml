default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: ec
        language: system
        stages: [pre-commit]
      - id: kubeconform
        name: kubeconform
        entry: >
          kubeconform -kubernetes-version='1.33.2' -schema-location='default' -schema-location='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -schema-location='https://json.schemastore.org/{{.ResourceKind}}.json' -summary
        language: system
        files: ^kubernetes/.*\.ya?ml$
        stages: [pre-commit]
      - id: reuse
        name: reuse
        entry: reuse
        args: [lint-file]
        language: system
        stages: [pre-commit]
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        types: [yaml]
        stages: [pre-commit]
  - repo: https://github.com/onedr0p/sops-pre-commit
    rev: v2.1.1
    hooks:
      - id: forbid-secrets
        name: forbid-secrets
        files: .*\.sops\.ya?ml
