name: Jellyfin
on:
  pull_request:
    paths:
      - "packages/jellyfin-runtime/**"
      - "packages/provider-jellyfin/**"
      - ".github/workflows/jellyfin.yaml"
  push:
    branches: [main]
    paths:
      - "packages/jellyfin-runtime/**"
      - "packages/provider-jellyfin/**"
      - ".github/workflows/jellyfin.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jellyfin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jellyfin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test runtime recovery
        run: |
          python3 -m unittest discover -s packages/jellyfin-runtime/tests -v
      - name: Build pinned Jellyfin and plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: packages/jellyfin-runtime/build.sh ghcr.io/soupglasses/ops/jellyfin-runtime:${{ github.sha
          }}
      - name: Build generated provider integration driver
        run: docker build --target tests -t ops-jellyfin-provider-tests packages/provider-jellyfin
      - name: Test LDAP login and photos through Upjet
        env:
          JELLYFIN_INTEGRATION_IMAGE: ghcr.io/soupglasses/ops/jellyfin-runtime:${{ github.sha }}
          JELLYFIN_PROVIDER_TEST_IMAGE: ops-jellyfin-provider-tests
        run: python3 -m unittest discover -s packages/jellyfin-runtime/tests -p test_identity_integration.py
          -v
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/soupglasses/ops/jellyfin-runtime:${{ github.sha }}
