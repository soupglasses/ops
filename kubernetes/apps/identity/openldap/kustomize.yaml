# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openldap
  namespace: &namespace identity
spec:
  path: ./kubernetes/apps/identity/openldap/app
  targetNamespace: *namespace
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: openldap
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  postBuild:
    substitute:
      APP: openldap-directory
      VOLSYNC_CAPACITY: 5Gi
      # Configuration and database are owned by the packaged ldap account.
      VOLSYNC_PUID: "389"
      VOLSYNC_PGID: "389"
      VOLSYNC_QUIESCE_TARGET_SELECTOR: app.kubernetes.io/name=openldap,app.kubernetes.io/component=server
      VOLSYNC_QUIESCE_TARGET_CONTAINER: openldap
      # Native transaction-consistent dumps; no claim of stopping directory writes.
      VOLSYNC_QUIESCE_CMD: /bin/sh /source/backup.sh
      VOLSYNC_RESUME_CMD: echo resume-noop
