- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
  listen: Restart SSH

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  listen: Reload sysctl

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  listen: Reload audit rules

- name: Restart auditd # noqa command-instead-of-module
  ansible.builtin.command: /usr/sbin/service auditd restart
  changed_when: true
  listen: Restart auditd

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
  listen: Restart chrony
