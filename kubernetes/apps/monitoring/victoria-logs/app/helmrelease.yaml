# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.12.3
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    printNotes: false
    serviceAccount:
      create: true
      automountToken: false

    server:
      retentionPeriod: 1y
      # Alert and expand the ZFS volume rather than delete history under pressure.
      retentionDiskSpaceUsage: ""
      extraArgs:
        envflag.enable: true
        envflag.prefix: VM_
        loggerFormat: json
        httpListenAddr: :9428
        http.shutdownDelay: 15s
        snapshotsMaxAge: 1d
        storage.minFreeDiskSpaceBytes: 5GB
      persistentVolume:
        enabled: true
        existingClaim: victoria-logs
        mountPath: /storage
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      ingress:
        enabled: false
      service:
        type: ClusterIP
      vmServiceScrape:
        enabled: true
        extraLabels:
          app.kubernetes.io/name: victoria-logs
          monitoring.finnes.dev/enabled: "true"
        interval: 1m
        scrapeTimeout: 10s

    vector:
      enabled: false

    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
