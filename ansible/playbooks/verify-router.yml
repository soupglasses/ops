- name: Verify the RouterOS boundary for Cilium
  hosts: routers
  gather_facts: false
  tasks:
    - name: Read Cilium BGP sessions
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ ansible_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - "{{ routeros_automation_user }}@{{ ansible_host }}"
        stdin: /routing/bgp/session/print detail where name~"cilium-bgp"
        stdin_add_newline: true
      register: routeros_bgp_sessions
      changed_when: false
      delegate_to: localhost

    - name: Require established IPv4 and IPv6 BGP sessions
      ansible.builtin.assert:
        that:
          - >-
            routeros_bgp_sessions.stdout is regex('(?m)^\\s*\\d+\\s+E\\s+name="' ~ routeros_cilium_v4_connection
            ~ '(?:-|\")')
          - >-
            routeros_bgp_sessions.stdout is regex('(?m)^\\s*\\d+\\s+E\\s+name="' ~ routeros_cilium_v6_connection
            ~ '(?:-|\")')
        fail_msg: Both Cilium BGP sessions must be established.

    - name: Read accepted Cilium routes
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ ansible_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - "{{ routeros_automation_user }}@{{ ansible_host }}"
        stdin: "{{ item }}"
        stdin_add_newline: true
      loop:
        - /ip/route/print detail where dst-address={{ routeros_cilium_vip_ipv4 }}
        - /ipv6/route/print detail where dst-address={{ routeros_cilium_vip_ipv6 }}
      register: routeros_cilium_routes
      changed_when: false
      delegate_to: localhost

    - name: Require both Cilium VIP routes
      ansible.builtin.assert:
        that:
          - routeros_node_ipv4 in routeros_cilium_routes.results[0].stdout
          - routeros_node_ipv6 in routeros_cilium_routes.results[1].stdout
        fail_msg: RouterOS did not install both Cilium VIP routes with the node as next hop.

    - name: Show scoped firewall counters
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ ansible_private_key_file }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - "{{ routeros_automation_user }}@{{ ansible_host }}"
        stdin: "{{ item }}"
        stdin_add_newline: true
      loop:
        - /ip/firewall/filter/print stats where comment~"ansible:cilium"
        - /ipv6/firewall/filter/print stats where comment~"ansible:cilium"
      register: routeros_cilium_firewall_stats
      changed_when: false
      delegate_to: localhost

    - name: Report BGP and firewall state
      ansible.builtin.debug:
        msg:
          - "{{ routeros_bgp_sessions.stdout }}"
          - "{{ routeros_cilium_routes.results | map(attribute='stdout') | join('\n') }}"
          - "{{ routeros_cilium_firewall_stats.results | map(attribute='stdout') | join('\n') }}"
