apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-https-redirect
  namespace: network
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames: ["auth.${DOMAIN}", "grafana.${DOMAIN}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canaille
  namespace: identity
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https
  hostnames: ["auth.${DOMAIN}"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove: [Server, X-Powered-By]
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600
      backendRefs:
        - name: canaille
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: network
      sectionName: https
  hostnames: ["grafana.${DOMAIN}"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            remove: [Server, X-Powered-By]
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: victoria-metrics-grafana
          port: 80
