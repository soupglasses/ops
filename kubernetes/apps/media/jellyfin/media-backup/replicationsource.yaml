apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: jellyfin-media
spec:
  sourcePVC: jellyfin-media
  trigger:
    schedule: "45 6 * * *"
  restic:
    copyMethod: Direct
    repository: volsync-jellyfin-media
    cacheCapacity: 5Gi
    cacheStorageClassName: openebs-zfs
    cacheAccessModes: [ReadWriteOnce]
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
