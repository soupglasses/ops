# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app victoria-logs
  namespace: &namespace monitoring
spec:
  path: ./kubernetes/apps/monitoring/victoria-logs/app
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: prometheus-operator-crds
      namespace: monitoring
    - name: victoria-metrics
      namespace: monitoring
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 200Gi
      VOLSYNC_CACHE_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: openebs-zfs
      VOLSYNC_SNAPSHOTCLASS: openebs-zfs-snapshot
      VOLSYNC_CACHE_SNAPSHOTCLASS: openebs-zfs
      VOLSYNC_SCHEDULE: 17 */6 * * *
      # VictoriaLogs writes as 1000:2000; the mover needs matching IDs to read all data.
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "2000"
