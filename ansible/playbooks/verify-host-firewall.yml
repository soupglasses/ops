- name: Verify host-firewall promotion through independent connections
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    kubectl_argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Open a fresh IPv4 SSH session from the controller
      ansible.builtin.command:
        argv:
          - ssh
          - -4
          - -F
          - /dev/null
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - -o
          - HostKeyAlias=nas.home.arpa
          - "{{ automation_user }}@{{ network_ipv4_address.split('/')[0] }}"
          - /bin/true
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Open a fresh IPv6 SSH session from the controller
      ansible.builtin.command:
        argv:
          - ssh
          - -6
          - -F
          - /dev/null
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - -o
          - HostKeyAlias=nas.home.arpa
          - "{{ automation_user }}@{{ network_ipv6_address.split('/')[0] }}"
          - /bin/true
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Open a new IPv4 Kubernetes API connection from the controller
      ansible.builtin.wait_for:
        host: "{{ network_ipv4_address.split('/')[0] }}"
        port: 6443
        connect_timeout: 5
        timeout: 15
      delegate_to: localhost
      become: false

    - name: Open a new IPv6 Kubernetes API connection from the controller
      ansible.builtin.wait_for:
        host: "{{ network_ipv6_address.split('/')[0] }}"
        port: 6443
        connect_timeout: 5
        timeout: 15
      delegate_to: localhost
      become: false

    - name: Read Cilium BGP peer state
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['-n', 'kube-system', 'exec', 'daemonset/cilium', '--', 'cilium-dbg',
          'bgp', 'peers'] }}"
      register: firewall_cilium_bgp_peers
      changed_when: false

    - name: Require established IPv4 and IPv6 router peers
      ansible.builtin.assert:
        that:
          - network_ipv4_gateway in firewall_cilium_bgp_peers.stdout
          - network_ipv6_gateway in firewall_cilium_bgp_peers.stdout
          - firewall_cilium_bgp_peers.stdout.lower().count('established') >= 2
        fail_msg: Both router peers must be established before host-firewall promotion is accepted.

    - name: Read Cilium host-endpoint audit mode
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['-n', 'kube-system', 'exec', 'daemonset/cilium', '--', 'cilium-dbg',
          'endpoint', 'get', '-l', 'reserved:host', '-o', 'jsonpath={[0].spec.options.PolicyAuditMode}']
          }}"
      register: firewall_cilium_audit_mode
      changed_when: false

    - name: Require enforced host policy
      ansible.builtin.assert:
        that:
          - firewall_cilium_audit_mode.stdout == 'Disabled'

    - name: Require the Ansible-owned host policy
      ansible.builtin.command:
        argv: "{{ kubectl_argv + ['get', 'ciliumclusterwidenetworkpolicy/rke2-host-ingress'] }}"
      changed_when: false
