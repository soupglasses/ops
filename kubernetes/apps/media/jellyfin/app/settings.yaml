apiVersion: jellyfin.ops.finnes.dev/v1beta1
kind: ProviderConfig
metadata:
  name: jellyfin
spec:
  endpoint: http://jellyfin.media.svc.cluster.local:8096
  username: ops-recovery
  passwordSecretRef:
    name: jellyfin-identity
    key: JELLYFIN_ADMIN_PASSWORD
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: SystemConfiguration
metadata:
  name: jellyfin
  annotations:
    crossplane.io/external-name: system
spec:
  forProvider:
    serverName: Jellyfin
    uiCulture: en-US
    metadataCountryCode: US
    preferredMetadataLanguage: en
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: NetworkingConfiguration
metadata:
  name: jellyfin
  annotations:
    crossplane.io/external-name: network
spec:
  forProvider:
    enableUpnp: false
    enableRemoteAccess: true
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: BrandingConfiguration
metadata:
  name: jellyfin
  annotations:
    crossplane.io/external-name: branding
spec:
  forProvider:
    loginDisclaimer: ''
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: Library
metadata:
  name: jellyfin-movies
  annotations:
    crossplane.io/external-name: Movies
spec:
  forProvider:
    collectionType: movies
    paths:
      - /media/movies
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: Library
metadata:
  name: jellyfin-tv
  annotations:
    crossplane.io/external-name: TV
spec:
  forProvider:
    collectionType: tvshows
    paths:
      - /media/tv
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: Library
metadata:
  name: jellyfin-music
  annotations:
    crossplane.io/external-name: Music
spec:
  forProvider:
    collectionType: music
    paths:
      - /media/music
---
apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: PluginSettings
metadata:
  name: jellyfin-ldap
spec:
  providerConfigRef:
    name: jellyfin
  pluginID: 958aad66-3784-4d2a-b89a-a7b6fab6e25c
  configuration:
    LdapServer: ldap.finnes.dev
    LdapPort: 636
    UseSsl: true
    UseStartTls: false
    SkipSslVerify: false
    AllowPassChange: false
    PasswordResetUrl: ''
    LdapBindUser: uid=media.jellyfin,ou=system,dc=finnes,dc=dev
    LdapBaseDn: ou=users,dc=finnes,dc=dev
    LdapSearchFilter: (|(memberOf=cn=media.jellyfin.user,ou=groups,dc=finnes,dc=dev)(memberOf=cn=media.jellyfin.admin,ou=groups,dc=finnes,dc=dev))
    LdapSearchAttributes: uid,mail
    LdapUidAttribute: uid
    LdapUsernameAttribute: uid
    LdapAdminFilter: (memberOf=cn=media.jellyfin.admin,ou=groups,dc=finnes,dc=dev)
    CreateUsersFromLdap: true
    EnableAllFolders: true
    EnableLdapProfileImageSync: true
    RemoveImagesNotInLdap: false
    LdapProfileImageAttribute: jpegPhoto
    LdapProfileImageFormat: Binary
  secretValues:
    LdapBindPassword:
      serviceAccountRef:
        name: jellyfin-bind
      key: password
