routeros_automation_user: ansible
routeros_automation_group: ansible
routeros_automation_key_owner: ansible-controller
routeros_automation_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ansible.pub"
routeros_automation_retire_key_owner: ""
ansible_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ansible"
ansible_network_cli_ssh_type: libssh
routeros_management_source_ipv4: 172.21.69.10/32
routeros_controller_mac_address: F4:C8:8A:B7:66:1E

routeros_wan_interface: ether1
routeros_server_interface: vlan71-servers
routeros_bgp_instance: bgp-instance-1
routeros_local_asn: 64513
routeros_cilium_asn: 64512
routeros_node_ipv4: 172.21.71.10
routeros_node_ipv6: 2a13:e745:1ee8:71::10
routeros_router_ipv4: 172.21.71.1
routeros_router_ipv6: 2a13:e745:1ee8:71::1
routeros_cilium_vip_ipv4: 172.21.68.10/32
routeros_cilium_vip_ipv6: 2a13:e745:1ee8:68::10/128

routeros_cilium_v4_filter: cilium-bgp-in-v4
routeros_cilium_v6_filter: cilium-bgp-in-v6
routeros_cilium_v4_connection: cilium-bgp
routeros_cilium_v6_connection: cilium-bgp-v6
cilium_bgp_ipv4_auth_secret_name: cilium-bgp-ipv4-auth
cilium_bgp_ipv6_auth_secret_name: cilium-bgp-ipv6-auth
cilium_bgp_auth_secret_key: password
cilium_bgp_ipv4_auth_generation: 1
cilium_bgp_ipv6_auth_generation: 1
