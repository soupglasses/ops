apiVersion: jellyfin.ops.finnes.dev/v1alpha1
kind: PluginSettings
metadata:
  name: jellyfin-ldap
spec:
  providerConfigRef:
    name: jellyfin
  pluginID: 958aad66-3784-4d2a-b89a-a7b6fab6e25c
  managementPolicies:
    - Observe
    - Create
    - Update
  configuration:
    LdapServer: ldap.finnes.dev
    LdapPort: 636
    UseSsl: true
    UseStartTls: false
    SkipSslVerify: false
    AllowPassChange: false
    PasswordResetUrl: ''
    LdapBindUser: uid=media.jellyfin,ou=system,dc=finnes,dc=dev
    LdapBaseDn: ou=users,dc=finnes,dc=dev
    LdapSearchFilter: (|(memberOf=cn=jellyfin.user,ou=groups,dc=finnes,dc=dev)(memberOf=cn=jellyfin.admin,ou=groups,dc=finnes,dc=dev))
    LdapSearchAttributes: uid,mail
    LdapUidAttribute: uid
    LdapUsernameAttribute: uid
    LdapAdminFilter: (memberOf=cn=jellyfin.admin,ou=groups,dc=finnes,dc=dev)
    CreateUsersFromLdap: true
    EnableAllFolders: true
    EnableLdapProfileImageSync: true
    RemoveImagesNotInLdap: false
    LdapProfileImageAttribute: jpegPhoto
    LdapProfileImageFormat: Binary
  secretValues:
    LdapBindPassword:
      name: jellyfin-identity
      key: LDAP_BIND_PASSWORD
