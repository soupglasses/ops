- name: Verify the RKE2 host through observable interfaces
  hosts: rke2_servers
  become: true
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Require core services to be running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['systemd-networkd.service'].state == 'running'
          - ansible_facts.services['auditd.service'].state == 'running'
          - ansible_facts.services['rke2-server.service'].state == 'running'

    - name: Check the AIDE integrity database
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db
      register: aide_database

    - name: Require an initialized AIDE database
      ansible.builtin.assert:
        that:
          - aide_database.stat.isreg | default(false)

    - name: Read node readiness from the Kubernetes API
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - wait
          - --for=condition=Ready
          - node/nas
          - --timeout=180s
      changed_when: false

    - name: Read Cilium status
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/cilium
          - --timeout=180s
      changed_when: false

    - name: Read Cilium host-firewall status
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - kube-system
          - exec
          - daemonset/cilium
          - --
          - cilium-dbg
          - status
      register: cilium_status
      changed_when: false

    - name: Require the Cilium host firewall
      ansible.builtin.assert:
        that:
          - cilium_status.stdout is regex('(?m)^Host firewall:\\s+Enabled')

    - name: Require the Ansible-owned host policy
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - get
          - ciliumclusterwidenetworkpolicy/rke2-host-ingress
      changed_when: false

    - name: Read the Cilium host-endpoint audit mode
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - -n
          - kube-system
          - exec
          - daemonset/cilium
          - --
          - cilium-dbg
          - endpoint
          - get
          - -l
          - reserved:host
          - -o
          - jsonpath={[0].spec.options.PolicyAuditMode}
      register: cilium_host_audit_mode
      changed_when: false

    - name: Require the configured host-firewall mode
      ansible.builtin.assert:
        that:
          - >-
            cilium_host_audit_mode.stdout == ('Enabled' if host_firewall_audit_mode | bool else 'Disabled')

    - name: Check node addresses
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - get
          - node/nas
          - -o
          - jsonpath={.status.addresses[*].address}
      register: node_addresses
      changed_when: false

    - name: Require both static node addresses
      ansible.builtin.assert:
        that:
          - "'172.21.71.10' in node_addresses.stdout"
          - "'2a13:e745:1ee8:71::10' in node_addresses.stdout"

    - name: Check the adopted ZFS pool
      ansible.builtin.command: zpool status -x {{ zfs_pool_name }}
      register: zpool_status
      changed_when: false
      failed_when: zpool_status.rc != 0 or 'is healthy' not in zpool_status.stdout
