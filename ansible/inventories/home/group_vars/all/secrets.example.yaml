# Copy this file to secrets.sops.yaml, replace every placeholder, then encrypt it once.
# The community.sops vars plugin decrypts that file in memory on the controller.
stringData:
  rke2_token: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  rke2_etcd_s3_endpoint: REPLACE_WITH_S3_ENDPOINT
  rke2_etcd_s3_region: REPLACE_WITH_S3_REGION
  rke2_etcd_s3_bucket: REPLACE_WITH_S3_BUCKET
  rke2_etcd_s3_access_key: REPLACE_WITH_S3_ACCESS_KEY
  rke2_etcd_s3_secret_key: REPLACE_WITH_S3_SECRET_KEY
