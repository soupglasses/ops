apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ldap-provider
  namespace: identity
spec:
  path: ./kubernetes/apps/identity/ldap-provider/app
  dependsOn:
    - name: crossplane
      namespace: crossplane-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  timeout: 5m
  prune: true
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: ldap
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      name: function-go-templating
    - apiVersion: apiextensions.crossplane.io/v2
      kind: CompositeResourceDefinition
      name: oauth2clients.ops.finnes.dev
    - apiVersion: apiextensions.crossplane.io/v2
      kind: CompositeResourceDefinition
      name: groupofnames.ops.finnes.dev
    - apiVersion: apiextensions.crossplane.io/v2
      kind: CompositeResourceDefinition
      name: serviceaccounts.ops.finnes.dev
  healthCheckExprs:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      current: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      current: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
    - apiVersion: apiextensions.crossplane.io/v2
      kind: CompositeResourceDefinition
      current: status.conditions.exists(c, c.type == 'Established' && c.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ldap-directory
  namespace: identity
spec:
  path: ./kubernetes/apps/identity/ldap-provider/config
  dependsOn:
    - name: ldap-provider
      namespace: identity
    - name: openldap
      namespace: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  prune: true
