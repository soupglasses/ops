version: "3"

set: [pipefail]
shopt: [globstar]

tasks:
  kubeconfig:
    desc: Fetch and verify the RKE2 administrator kubeconfig (human operator only)
    silent: true
    preconditions:
      - command -v ssh
      - command -v kubectl
      - command -v yq
      - command -v bash
    cmds:
      - |
        bash -eu <<'BASH'
        set -eu
        umask 077
        mkdir -p .secure
        temporary=$(mktemp .secure/kubeconfig.XXXXXX)
        trap 'rm -f "$temporary"' EXIT
        ssh -F /dev/null -o BatchMode=yes -o ConnectTimeout=10 \
          -i "$HOME/.ssh/ansible" -o StrictHostKeyChecking=yes \
          -o HostKeyAlias=nas.home.finnes.dev ansible@172.21.71.10 \
          'sudo -n cat /etc/rancher/rke2/rke2.yaml' > "$temporary"
        yq -i '.clusters[].cluster.server = "https://k8s.home.finnes.dev:6443"' "$temporary"
        kubectl --kubeconfig "$temporary" --request-timeout=15s get nodes
        if [ -f .secure/kubeconfig ]; then
          cp -p .secure/kubeconfig ".secure/kubeconfig.backup.$(date +%Y%m%dT%H%M%S)"
        fi
        mv "$temporary" .secure/kubeconfig
        printf '%s\n' 'Installed .secure/kubeconfig; mise selects it in this repository.'
        BASH

  clean-pods:
    desc: Delete all pods with a Failed/Pending/Succeeded status
    cmds:
      - for:
          matrix:
            PHASE: [Failed, Pending, Succeeded]
        cmd: kubectl delete pods --all-namespaces --field-selector status.phase={{.ITEM.PHASE}} --ignore-not-found=true
    preconditions:
      - which kubectl
      - test -f "$KUBECONFIG"
  fetch-agekey:
    desc: Fetch agekey from the cluster
    preconditions:
      - test ! -e ".secure/age.agekey"
      - test -f "$KUBECONFIG"
    cmds:
      - mkdir -p .secure
      - kubectl get secret sops-age -n flux-system -o jsonpath='{.data.age\.agekey}' | base64 -d > .secure/age.agekey
  shell:
    desc: Spawn a temporary root shell on a [NODE=required]
    cmd: |
      kubectl debug --profile=sysadmin --namespace kube-system -it --image debian node/{{.NODE}} -- bash -c '
      cat > /tmp/.bashrc <<"EOF"
      for dir in /host/bin /host/sbin /host/usr/local/sbin /host/usr/local/bin /host/usr/bin /host/usr/sbin; do
        for bin in "$dir"/*; do
          [ -x "$bin" ] && alias "$(basename "$bin")"="chroot /host $(basename "$bin")"
        done
      done
      EOF
      exec bash --rcfile /tmp/.bashrc
      '
    interactive: true
    requires:
      vars: [NODE]
    preconditions:
      - test -f "$KUBECONFIG"
      - kubectl get node {{.NODE}}
