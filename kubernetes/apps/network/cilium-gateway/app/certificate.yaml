apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-gateway-tls
  namespace: network
spec:
  secretName: public-gateway-tls
  issuerRef:
    name: cloudflare-dns01-production
    kind: ClusterIssuer
  dnsNames:
    - auth.${DOMAIN}
    - grafana.${DOMAIN}
