# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]
shopt: [globstar]

tasks:
  shell:
    desc: Spawn a temporary root shell on a [NODE=required]
    cmd: kubectl debug --profile=sysadmin --namespace kube-system -it --image alpine node/{{.NODE}}
    interactive: true
    requires:
      vars: [NODE]
    preconditions:
      - kubectl get node {{.NODE}}
  license-mit:
    desc: License files as MIT
    cmd: >
      reuse annotate --copyright="$(git config get user.name) <$(git config get user.email)>" --license=MIT
      --merge-copyrights {{.CLI_ARGS}}
  license-cc0:
    desc: License files as CC0-1.0
    cmd: >
      reuse annotate --copyright="$(git config get user.name) <$(git config get user.email)>" --license=CC0-1.0
      --merge-copyrights --exclude-year {{.CLI_ARGS}}
  reconcile:
    desc: Trigger manual reconcile for Flux.
    cmd: flux reconcile kustomization flux-system --with-source
  preconditions:
    - which flux
    - flux check
  clean-pods:
    desc: Delete all pods with a Failed/Pending/Succeeded status
    cmds:
      - for:
          matrix:
            PHASE: [Failed, Pending, Succeeded]
        cmd: kubectl delete pods --all-namespaces --field-selector status.phase={{.ITEM.PHASE}} --ignore-not-found=true
    preconditions:
      - which kubectl
