# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  ansible:
    taskfile: ansible/Taskfile.yaml
    dir: ansible
  talos:
    taskfile: .taskfiles/talos.yaml
    dir: .
  flux:
    taskfile: .taskfiles/flux.yaml
    dir: .
  flate:
    taskfile: .taskfiles/flate.yaml
    dir: .
  flux-local:
    taskfile: .taskfiles/flate.yaml
    dir: .
  kube:
    taskfile: .taskfiles/kubernetes.yaml
    dir: .
  license:
    taskfile: .taskfiles/license.yaml
    dir: .
  volsync:
    taskfile: .taskfiles/volsync.yaml
    dir: .

tasks:
  hermes:deploy-keys:
    desc: Install or renew Kubernetes credentials in an existing Hermes container
    silent: true
    requires:
      vars: [HOST]
    cmd: python3 scripts/hermes-kubeconfig.py --host {{.HOST | shellQuote}} {{.CLI_ARGS}}
