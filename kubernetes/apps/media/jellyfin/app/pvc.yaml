apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-zfs
  resources:
    requests:
      storage: 20Gi
