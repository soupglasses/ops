- name: Validate the pinned RKE2 configuration
  ansible.builtin.assert:
    that:
      - rke2_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+\\+rke2r[0-9]+$')
      - rke2_cluster_cidrs | length == 2
      - rke2_service_cidrs | length == 2
      - rke2_tarball_sha256 is match('^[0-9a-f]{64}$')
      - "':' in rke2_cluster_cidrs[1]"
      - "':' in rke2_service_cidrs[1]"

- name: Require a stable recovery token before first boot
  ansible.builtin.assert:
    that:
      - (rke2_token | default('')) | length >= 32
    fail_msg: Define rke2_token in the encrypted SOPS inventory before starting RKE2.
  no_log: true

- name: Require complete etcd S3 settings when enabled
  ansible.builtin.assert:
    that:
      - rke2_etcd_s3_retention | int >= rke2_etcd_snapshot_retention | int
      - (rke2_etcd_s3_endpoint | default('')) | length > 0
      - (rke2_etcd_s3_region | default('')) | length > 0
      - (rke2_etcd_s3_bucket | default('')) | length > 0
      - (rke2_etcd_s3_access_key | default('')) | length > 0
      - (rke2_etcd_s3_secret_key | default('')) | length > 0
    fail_msg: >-
      Supply all etcd S3 settings through encrypted inventory variables and retain at least as many S3
      snapshots as local snapshots.
  when: rke2_etcd_s3_enabled | bool

- name: Require independent high-entropy BGP authentication passwords
  ansible.builtin.assert:
    that:
      - (cilium_bgp_ipv4_password | default('')) is match('^[A-Za-z0-9_-]{32,80}$')
      - (cilium_bgp_ipv6_password | default('')) is match('^[A-Za-z0-9_-]{32,80}$')
      - (cilium_bgp_ipv4_password | default('')) != (cilium_bgp_ipv6_password | default(''))
    fail_msg: >-
      Supply distinct, randomly generated, 32-80 character base64url-safe BGP passwords through encrypted
      inventory variables. Hexadecimal values are valid.
  no_log: true

- name: Require explicit acknowledgement before enforcing the host firewall
  ansible.builtin.assert:
    that:
      - >-
        host_firewall_enforcement_acknowledgement == 'I_HAVE_VERIFIED_DUAL_STACK_HOST_ACCESS_AND_ACCEPT_LOCKOUT_RISK'
    fail_msg: >-
      Leave host_firewall_audit_mode=true until the promotion checks pass. Enforcement requires the documented
      acknowledgement phrase and console access.
  when: not host_firewall_audit_mode | bool

- name: Create the etcd service identity required by the CIS profile
  ansible.builtin.user:
    name: etcd
    system: true
    home: /var/lib/rancher/rke2/server/db
    shell: /usr/sbin/nologin
    create_home: false

- name: Create RKE2 configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/rancher/rke2
      mode: "0750"
    - path: /var/lib/rancher/rke2/server/manifests
      mode: "0750"

- name: Remove any legacy rendered BGP authentication manifest
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests/cilium-bgp-auth-secrets.yaml
    state: absent

- name: Read the installed RKE2 version
  ansible.builtin.command: /usr/local/bin/rke2 --version
  register: rke2_installed_version
  changed_when: false
  failed_when: false

- name: Select the immutable RKE2 release URL
  ansible.builtin.set_fact:
    rke2_release_url: >-
      https://github.com/rancher/rke2/releases/download/{{ rke2_version | replace('+', '%2B') }}
  when: rke2_version not in rke2_installed_version.stdout

- name: Create the RKE2 artifact cache
  ansible.builtin.file:
    path: /var/cache/rke2
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: rke2_version not in rke2_installed_version.stdout

- name: Download the immutable RKE2 release artifact
  ansible.builtin.get_url:
    url: "{{ rke2_release_url }}/rke2.linux-amd64.tar.gz"
    dest: "/var/cache/rke2/rke2-{{ rke2_version | replace('+', '_') }}.tar.gz"
    owner: root
    group: root
    mode: "0640"
    checksum: "sha256:{{ rke2_tarball_sha256 }}"
  when: rke2_version not in rke2_installed_version.stdout

- name: Install the verified pinned RKE2 release without starting it
  ansible.builtin.unarchive:
    src: "/var/cache/rke2/rke2-{{ rke2_version | replace('+', '_') }}.tar.gz"
    dest: /usr/local
    remote_src: true
  changed_when: true
  notify: Restart RKE2
  when: rke2_version not in rke2_installed_version.stdout

- name: Install the RKE2 server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ (rke2_etcd_s3_enabled | bool) or ((rke2_token | default('')) | length > 0) }}"
  notify: Restart RKE2

- name: Install the bootstrap Cilium configuration
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    owner: root
    group: root
    mode: "0640"
  notify: Restart RKE2

- name: Enable and start RKE2
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending RKE2 restart before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Wait for the Kubernetes API
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - get
      - --raw=/readyz
  register: rke2_kubernetes_ready
  retries: 36
  delay: 5
  until: rke2_kubernetes_ready.rc == 0 and rke2_kubernetes_ready.stdout == 'ok'
  changed_when: false

- name: Apply Cilium BGP authentication Secrets without persistent plaintext
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - apply
      - -f
      - -
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: cilium-bgp-ipv4-auth
        namespace: kube-system
      type: Opaque
      stringData:
        password: {{ cilium_bgp_ipv4_password | to_json }}
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: cilium-bgp-ipv6-auth
        namespace: kube-system
      type: Opaque
      stringData:
        password: {{ cilium_bgp_ipv6_password | to_json }}
  register: rke2_cilium_bgp_auth_secrets
  changed_when: >-
    'created' in rke2_cilium_bgp_auth_secrets.stdout or 'configured' in rke2_cilium_bgp_auth_secrets.stdout
  no_log: true

- name: Wait for the Cilium agent
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - -n
      - kube-system
      - rollout
      - status
      - daemonset/cilium
      - --timeout=300s
  changed_when: false

- name: Find the local Cilium pod
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - -n
      - kube-system
      - get
      - pods
      - -l
      - k8s-app=cilium
      - --field-selector
      - spec.nodeName=nas
      - -o
      - jsonpath={.items[0].metadata.name}
  register: rke2_cilium_pod
  changed_when: false

- name: Find the Cilium host endpoint
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - -n
      - kube-system
      - exec
      - "{{ rke2_cilium_pod.stdout }}"
      - --
      - cilium-dbg
      - endpoint
      - get
      - -l
      - reserved:host
      - -o
      - jsonpath={$[0].id}
  register: rke2_cilium_host_endpoint
  changed_when: false

- name: Run promotion probes before disabling host-firewall audit mode
  ansible.builtin.include_tasks: host_firewall_promotion_preflight.yml
  when: not host_firewall_audit_mode | bool

- name: Set Cilium host-firewall audit mode before applying policy
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - -n
      - kube-system
      - exec
      - "{{ rke2_cilium_pod.stdout }}"
      - --
      - cilium-dbg
      - endpoint
      - config
      - "{{ rke2_cilium_host_endpoint.stdout }}"
      - "PolicyAuditMode={{ 'Enabled' if host_firewall_audit_mode | bool else 'Disabled' }}"
  changed_when: true

- name: Install the Cilium host policy definition
  ansible.builtin.template:
    src: host-firewall.yaml.j2
    dest: /etc/rancher/rke2/host-firewall.yaml
    owner: root
    group: root
    mode: "0640"

- name: Apply the Cilium host policy
  ansible.builtin.command:
    argv:
      - /var/lib/rancher/rke2/bin/kubectl
      - --kubeconfig
      - /etc/rancher/rke2/rke2.yaml
      - apply
      - -f
      - /etc/rancher/rke2/host-firewall.yaml
  register: rke2_cilium_host_policy
  changed_when: >-
    'configured' in rke2_cilium_host_policy.stdout or 'created' in rke2_cilium_host_policy.stdout

- name: Install the Prometheus host metrics exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the node exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/prometheus/node-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the node exporter textfile collector
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus node exporter

- name: Install the aggregate RKE2 S3 snapshot metric collector
  ansible.builtin.template:
    src: etcd-snapshot-metrics.sh.j2
    dest: /usr/local/libexec/rke2-etcd-snapshot-metrics
    owner: root
    group: root
    mode: "0750"

- name: Install the RKE2 S3 snapshot metric service
  ansible.builtin.template:
    src: etcd-snapshot-metrics.service.j2
    dest: /etc/systemd/system/rke2-etcd-snapshot-metrics.service
    owner: root
    group: root
    mode: "0644"

- name: Install the RKE2 S3 snapshot metric timer
  ansible.builtin.template:
    src: etcd-snapshot-metrics.timer.j2
    dest: /etc/systemd/system/rke2-etcd-snapshot-metrics.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable the Prometheus node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Enable the RKE2 S3 snapshot metric timer
  ansible.builtin.systemd_service:
    name: rke2-etcd-snapshot-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Seed the RKE2 S3 snapshot metrics
  ansible.builtin.systemd_service:
    name: rke2-etcd-snapshot-metrics.service
    state: started
  no_log: true

- name: Report the server-token recovery requirement without exposing it
  ansible.builtin.debug:
    msg: >-
      Preserve /var/lib/rancher/rke2/server/token independently; it is required with an etcd snapshot
      for disaster recovery. This role deliberately does not read or print it.
