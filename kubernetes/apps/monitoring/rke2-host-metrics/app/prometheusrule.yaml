# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rke2-etcd-restic-backups
  labels:
    monitoring.finnes.dev/enabled: "true"
spec:
  groups:
    - name: rke2-etcd-restic-backups.rules
      rules:
        - alert: RKE2EtcdResticBackupMetricsAbsent
          annotations:
            summary: Encrypted RKE2 etcd backup metrics have disappeared from Prometheus.
          expr: |
            absent(rke2_etcd_restic_backup_success)
            or absent(rke2_etcd_restic_backup_last_attempt_timestamp_seconds)
            or absent(rke2_etcd_restic_backup_last_verified_timestamp_seconds)
            or absent(rke2_etcd_restic_snapshot_count)
          for: 30m
          labels:
            severity: critical
        - alert: RKE2EtcdResticBackupFailed
          annotations:
            summary: The last encrypted RKE2 etcd backup or restore verification failed.
          expr: |
            rke2_etcd_restic_backup_success == 0
          for: 1h
          labels:
            severity: warning
        - alert: RKE2EtcdResticBackupStale
          annotations:
            summary: No recent encrypted RKE2 etcd backup has passed restic restore verification.
          expr: |
            rke2_etcd_restic_backup_last_verified_timestamp_seconds == 0
            or time() - rke2_etcd_restic_backup_last_verified_timestamp_seconds > 10 * 60 * 60
          for: 30m
          labels:
            severity: critical
        - alert: RKE2EtcdResticBackupHistoryBelowTarget
          annotations:
            summary: Encrypted RKE2 etcd backup history has remained below 28 snapshots for eight days.
          expr: |
            rke2_etcd_restic_snapshot_count < 28
          for: 8d
          labels:
            severity: warning
